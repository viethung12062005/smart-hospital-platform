# SINH BỞI tools/contracts/gen_openapi.py từ docs/03-architecture/detailed-design/08..12. Thêm schema ở dưới các operation.
openapi: 3.1.0
info:
  title: SHP document API
  version: 1.0.0
  description: Khung sinh từ tài liệu thiết kế; thêm schema thân request/response khi làm task endpoint.
servers:
- url: https://api.{env}.shp.example.org
  variables:
    env:
      default: uat
security:
- oidc: []
paths:
  /api/v1/documents/uploads:
    post:
      operationId: D1
      summary: Bắt đầu upload, nhận SAS
      tags:
      - document
      x-permission: D (Care), N
      x-roles:
      - doctor
      - nurse
      x-doc: detailed-design/10-api-document.md
      responses:
        '200':
          description: Thành công
        '400':
          description: Yêu cầu sai
          content:
            application/problem+json: {}
        '401':
          description: Chưa xác thực
          content:
            application/problem+json: {}
        '403':
          description: Không đủ quyền (có ghi audit)
          content:
            application/problem+json: {}
        '404':
          description: Không tìm thấy
          content:
            application/problem+json: {}
        '409':
          description: Xung đột (version/idempotency)
          content:
            application/problem+json: {}
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json: {}
        '429':
          description: Quá giới hạn tốc độ
          content:
            application/problem+json: {}
