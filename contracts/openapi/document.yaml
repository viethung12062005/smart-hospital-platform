components:
  schemas:
    OperationOutcome:
      type: object
      required:
      - resourceType
      - issue
      properties:
        resourceType:
          const: OperationOutcome
        issue:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - severity
            - code
            properties:
              severity:
                enum:
                - fatal
                - error
                - warning
                - information
              code:
                type: string
                description: Code in 07 §5, e.g. validation-failed
              diagnostics:
                type: string
                description: vi/en translation, contains no submitted value
              details:
                type: object
                properties:
                  text:
                    type: string
                  coding:
                    type: array
                    items:
                      type: object
                      properties:
                        system:
                          type: string
                        code:
                          type: string
                        display:
                          type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          description: vi/en translation of the error code
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Code in the ErrorCatalog (07 §5)
        detail:
          type: string
        traceId:
          type: string
          description: Trace id for log correlation
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://login.example.org/.well-known/openid-configuration
    workloadIdentity:
      type: http
      scheme: bearer
      description: Workload identity token of the calling service (internal)
