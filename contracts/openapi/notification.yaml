components:
  schemas:
    OperationOutcome:
      type: object
      required:
      - resourceType
      - issue
      properties:
        resourceType:
          const: OperationOutcome
        issue:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - severity
            - code
            properties:
              severity:
                enum:
                - fatal
                - error
                - warning
                - information
              code:
                type: string
                description: Mã trong 07 §5, ví dụ validation-failed
              diagnostics:
                type: string
                description: Bản dịch vi/en, không chứa giá trị gửi lên
              details:
                type: object
                properties:
                  text:
                    type: string
                  coding:
                    type: array
                    items:
                      type: object
                      properties:
                        system:
                          type: string
                        code:
                          type: string
                        display:
                          type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          description: Bản dịch vi/en của mã lỗi
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Mã trong ErrorCatalog (07 §5)
        detail:
          type: string
        traceId:
          type: string
          description: Trace id để đối chiếu log
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://login.example.org/.well-known/openid-configuration
    workloadIdentity:
      type: http
      scheme: bearer
      description: Token workload identity của service gọi (nội bộ)
