# Shared code catalogs (value sets). Source: docs/03-architecture/detailed-design/01-domain-model.md §3.
# - specialty, cancel-reason, booking-channel: defined by SHP (canonical URL assumed to be shp.example.org).
# - LOINC / ICD-10: a curated SUBSET sufficient for the project's fake data, not the full catalog.
#   LOINC/ICD-10 codes were checked by the SA against standard knowledge, not against the official release: verify before use outside the project.
version: 1
codeSystems:
  specialty:
    url: https://shp.example.org/fhir/CodeSystem/specialty
    concepts:
      internal-medicine: Nội tổng quát
      cardiology: Tim mạch
      pediatrics: Nhi
      obstetrics-gynecology: Sản phụ khoa
      dermatology: Da liễu
      ent: Tai mũi họng
      ophthalmology: Mắt
      orthopedics: Chấn thương chỉnh hình
      neurology: Thần kinh
      gastroenterology: Tiêu hóa
      endocrinology: Nội tiết
      general-surgery: Ngoại tổng quát
  cancel-reason:
    url: https://shp.example.org/fhir/CodeSystem/cancel-reason
    concepts:
      patient-request: Bệnh nhân yêu cầu
      practitioner-unavailable: Bác sĩ không có mặt
      duplicate: Trùng lịch
      rescheduled: Đã đổi lịch
      system-noshow-cleanup: Hệ thống dọn dẹp
      other: Khác
  booking-channel:
    url: https://shp.example.org/fhir/CodeSystem/booking-channel
    concepts: { web: Web, chatbot: Chatbot, staff: Nhân viên đặt }
  practitioner-role:
    url: https://shp.example.org/fhir/CodeSystem/practitioner-role
    concepts: { doctor: Bác sĩ, nurse: Điều dưỡng }
  loinc-vital-signs:
    url: http://loinc.org
    concepts:
      8867-4: Heart rate (/min)
      85354-9: Blood pressure panel (mm[Hg])
      8480-6: Systolic blood pressure (mm[Hg])
      8462-4: Diastolic blood pressure (mm[Hg])
      8310-5: Body temperature (Cel)
      9279-1: Respiratory rate (/min)
      59408-5: Oxygen saturation by pulse oximetry (%)
      29463-7: Body weight (kg)
      8302-2: Body height (cm)
      39156-5: Body mass index (kg/m2)
  loinc-document-types:
    url: http://loinc.org
    concepts:
      11502-2: Laboratory report
      18748-4: Diagnostic imaging study
      57833-6: Prescription for medication
      57133-1: Referral note
      34133-9: Summarization of episode note
      51851-4: Administrative note
  icd10-subset:
    url: http://hl7.org/fhir/sid/icd-10
    concepts:
      A09: Infectious gastroenteritis and colitis, unspecified
      E11: Type 2 diabetes mellitus
      E78.5: Hyperlipidaemia, unspecified
      I10: Essential (primary) hypertension
      I25.9: Chronic ischaemic heart disease, unspecified
      J06.9: Acute upper respiratory infection, unspecified
      J18.9: Pneumonia, unspecified
      J45: Asthma
      K29.7: Gastritis, unspecified
      M54.5: Low back pain
      N39.0: Urinary tract infection, site not specified
      R50.9: Fever, unspecified
# URLs of FHIR extensions (StructureDefinitions) defined by SHP, under the same canonical root as the CodeSystems above.
# Source: 01-domain-model §3.1; validate_terminology.py checks both directions against the `extension[<key>]` lines in the document.
extensions:
  booking-channel:
    url: https://shp.example.org/fhir/StructureDefinition/booking-channel
    context: Appointment
    value: "valueCode (CodeSystem booking-channel)"
  rescheduled-from:
    url: https://shp.example.org/fhir/StructureDefinition/rescheduled-from
    context: Appointment
    value: "valueReference (Appointment)"
  clinical-note:
    url: https://shp.example.org/fhir/StructureDefinition/clinical-note
    context: Encounter
    value: valueMarkdown
  addendum:
    url: https://shp.example.org/fhir/StructureDefinition/addendum
    context: Encounter
    value: "complex: author (valueReference Practitioner), recordedAt (valueDateTime), text (valueMarkdown)"
  released-to-patient:
    url: https://shp.example.org/fhir/StructureDefinition/released-to-patient
    context: DocumentReference
    value: "complex: releasedAt (valueDateTime), releasedBy (valueReference Practitioner)"
