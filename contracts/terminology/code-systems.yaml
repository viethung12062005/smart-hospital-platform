# Danh mục mã dùng chung (value set). Nguồn: docs/03-architecture/detailed-design/01-domain-model.md §3.
# - specialty, cancel-reason, booking-channel: do SHP định nghĩa (canonical URL giả định shp.example.org).
# - LOINC / ICD-10: TẬP CON chọn lọc đủ cho dữ liệu giả của đồ án, không phải toàn bộ danh mục.
# - ICD-10 (icd10-subset): ~380 mã ngoại trú thường gặp; mỗi mã đối chiếu với file chính thức ICD-10-CM FY2027 của CMS
#   (icd10cm_order_2027.txt, phạm vi công cộng), nhãn là mô tả dài nguyên văn trong file đó. Chỉ giữ mã dùng chung với ICD-10 của WHO.
# - LOINC: chọn theo kiến thức chuẩn, chưa đối chiếu bản phát hành chính thức của LOINC.
# Một nguồn duy nhất: web đọc thẳng file này, Java dùng org.shp.events.Terminology (nhúng vào jar shp-events lúc build).
version: 1
codeSystems:
