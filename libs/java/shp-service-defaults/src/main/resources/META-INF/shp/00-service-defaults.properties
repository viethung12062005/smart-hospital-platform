# Defaults shared by EVERY service (loaded by ShpDefaultsEnvironmentPostProcessor, LOWEST priority: a service can override them).
# Paths match the microservice Helm chart: /health/live, /health/ready, /info.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState,db,mongo,redis
# A service's ready group includes the databases it actually has; missing ones are skipped (no startup failure)
management.endpoint.health.validate-group-membership=false
management.endpoint.health.show-details=never
management.info.env.enabled=false
# Trace 100% of requests (NFR-O1). OTLP is exported only when the cluster enables it (Helm sets SHP_OTLP_EXPORT=true and OTEL_EXPORTER_OTLP_ENDPOINT).
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${SHP_OTLP_EXPORT:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
# Operations
server.shutdown=graceful
spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s
