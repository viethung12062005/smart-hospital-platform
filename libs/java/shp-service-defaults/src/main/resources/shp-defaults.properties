# Mặc định chung cho MỌI service (nạp bởi ServiceDefaultsAutoConfiguration, ưu tiên THẤP NHẤT: service ghi đè được).
# Đường dẫn khớp Helm chart microservice: /health/live, /health/ready, /info.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState,db,mongo,redis
# Service nào có DB nào thì nhóm ready gồm DB đó; không có thì bỏ qua (không lỗi khởi động)
management.endpoint.health.validate-group-membership=false
management.endpoint.health.show-details=never
management.info.env.enabled=false
# Tracing 100% request (NFR-O1). Chỉ xuất OTLP khi cluster bật (Helm đặt SHP_OTLP_EXPORT=true và OTEL_EXPORTER_OTLP_ENDPOINT).
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${SHP_OTLP_EXPORT:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
# Vận hành
server.shutdown=graceful
spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s
