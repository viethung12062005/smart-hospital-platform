# SHP messaging defaults (13-events §1.1); a service can override them in application.yml or through env vars.
# Binder: rabbit (local, the default) or servicebus (uat/prod: SHP_MESSAGING_BINDER=servicebus in shp-gitops).
spring.cloud.stream.default-binder=${SHP_MESSAGING_BINDER:rabbit}
spring.cloud.stream.bindings.shp-events-out-0.destination=shp-events
# The body is the full CloudEvent JSON; application/cloudevents+json is not declared because Spring Cloud Function strips the envelope itself.
spring.cloud.stream.bindings.shp-events-out-0.content-type=application/json

# Consume: number of in-process attempts. RabbitMQ: 5 attempts then the DLQ. Service Bus:
# SHP_MESSAGING_IN_PROCESS_ATTEMPTS=1 and the broker redelivers up to max_delivery_count = 5 (shp-infra) before dead-lettering.
spring.cloud.stream.default.consumer.max-attempts=${SHP_MESSAGING_IN_PROCESS_ATTEMPTS:5}
spring.cloud.stream.default.consumer.back-off-initial-interval=1000
spring.cloud.stream.default.consumer.back-off-multiplier=2.0
spring.cloud.stream.default.consumer.back-off-max-interval=10000

# RabbitMQ: topic exchange shp-events, routing key = type; each consumer gets its own queue shp-events.<group> + DLQ.
spring.cloud.stream.rabbit.bindings.shp-events-out-0.producer.exchange-type=topic
spring.cloud.stream.rabbit.bindings.shp-events-out-0.producer.routing-key-expression=headers['type']
spring.cloud.stream.rabbit.default.consumer.exchange-type=topic
spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.consumer.binding-routing-key-delimiter=,

# Service Bus: topic, signing in with Workload Identity (DefaultAzureCredential reads AZURE_CLIENT_ID and the token
# the webhook attaches to the pod), no connection string. Namespace: <name>.servicebus.windows.net (Terraform output servicebus_endpoint).
spring.cloud.azure.servicebus.namespace=${SHP_SERVICEBUS_NAMESPACE:}
spring.cloud.stream.servicebus.bindings.shp-events-out-0.producer.entity-type=topic
