# Nạp bởi ShpDefaultsEnvironmentPostProcessor (ưu tiên thấp nhất).
# Mặc định của shp-web (ưu tiên thấp nhất). Helm values local đặt OIDC_AUTHORITY, OIDC_AUDIENCE; cloud đặt qua values/Key Vault.
shp.auth.authority=${OIDC_AUTHORITY:}
shp.auth.audience=${OIDC_AUDIENCE:}
shp.auth.require-mfa-for-staff=${SHP_REQUIRE_MFA_FOR_STAFF:true}
# Tùy chọn: URL JWKS trong cụm khi issuer (vd. localhost:18080) không gọi được từ pod.
shp.auth.jwk-set-uri=${OIDC_JWK_SET_URI:}
