# Loaded by ShpDefaultsEnvironmentPostProcessor (lowest priority).
# shp-web defaults (lowest priority). Local Helm values set OIDC_AUTHORITY and OIDC_AUDIENCE; in the cloud they come from values/Key Vault.
shp.auth.authority=${OIDC_AUTHORITY:}
shp.auth.audience=${OIDC_AUDIENCE:}
shp.auth.require-mfa-for-staff=${SHP_REQUIRE_MFA_FOR_STAFF:true}
# Optional: in-cluster JWKS URL for when the issuer (e.g. localhost:18080) is not reachable from the pod.
shp.auth.jwk-set-uri=${OIDC_JWK_SET_URI:}
