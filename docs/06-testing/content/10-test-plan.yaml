# Master Test Plan for the Smart Hospital Platform. Generates the docx with tools/qa/plan_docx.py.
document:
  title: Master Test Plan
  system: Smart Hospital Platform
  version: "0.9"
  team: Team 12
  date_text: November 2026
  srs_version: "0.96"

sections:
  - name: Introduction
    paragraphs:
      - >-
        This document describes how the team tests the Smart Hospital Platform to prove that every requirement in SRS v0.96 is met:
        scope, risk-based strategy, test levels and types, environments, tools, entry/exit criteria, the defect process,
        and how testing is integrated into CI/CD. The system handles health data, so security and privacy are the number one risk:
        do not release while a P0 security test is failing.
      - >-
        The source of truth for the plan is code: the test case catalog lives in docs/06-testing/catalog, and the traceability
        tool (tools/qa/trace.py) checks in every PR that every acceptance criterion and NFR has a test case, that every automated
        test reference exists, and that the automation rate does not decrease. This document and the traceability reports are
        generated from it.
  - name: Testing scope
    table:
      header: ["Item", "In scope", "Out of scope / limitations"]
      widths: [3.6, 6.8, 6.1]
      rows:
        - ["Functional", "57 SRS use cases (6 modules) and 112 Given/When/Then acceptance criteria", "Payment, inpatient care, prescribing (out of product scope)"]
        - ["Non-functional", "62 NFRs: performance, scalability, availability, security and privacy, operations, deployment, cost, AI quality, compatibility, accessibility", "Actual cost is only measured when Azure is available"]
        - ["Security", "28 additional security tests following OWASP ASVS level 2, OWASP API Top 10, OWASP LLM Top 10", "Third-party penetration testing: recommended before using real data"]
        - ["Components", "8 services, gateway, web, shared libraries, contracts (OpenAPI, events, authorization), infrastructure as code, pipelines", "Provider-managed services (Azure, Entra ID, LLM) are only integration-tested, not tested internally"]
        - ["Data", "Synthetic data only, generated per docs/00-synthetic-data.md", "Real patient data is never used for testing"]
  - name: Testing strategy
    paragraphs:
      - "The strategy has three principles: risk-based testing, the test pyramid (many fast tests at the base, few slow tests at the top), and shift left (find defects as early as possible, inside the PR)."
    table:
      header: ["Priority", "Criteria", "Examples", "Impact of failure"]
      widths: [1.8, 5.8, 5.4, 3.5]
      rows:
        - ["P0", "Access control, patient data, identity, consent, audit, malware, patient safety, double booking of a slot", "A doctor with no treatment relationship opens a medical record; logs contain patient names; AI books without confirmation", "Block release; fix immediately"]
        - ["P1", "Remaining Must functions and performance/availability NFRs", "Book, cancel, reschedule; reminders; p95 slot search", "Fix before the end of the sprint"]
        - ["P2", "Should/Could, secondary UI, rare cases", "Booking chatbot, fallback-channel notifications", "Can move to a later sprint"]
    paragraphs_after:
      - "Current figures (see the traceability report): 180 test cases, of which 105 are P0 test cases."
  - name: Test levels and types
    table:
      header: ["Level", "Goal", "Tools", "When it runs", "Who writes it"]
      widths: [2.6, 4.8, 3.8, 3.4, 1.9]
      rows:
        - ["Unit", "Pure logic: authorization, rules, validators, formatting", "JUnit 5; pytest; Vitest", "Every PR (java-ci, python-ci, node-ci)", "Dev"]
        - ["Integration", "Service with real databases, queues and file stores", "Testcontainers (PostgreSQL, MongoDB, RabbitMQ, Azurite)", "Every PR", "Dev"]
        - ["Contract", "OpenAPI, event schemas and the authorization matrix match between definition and use", "tools/contracts, openapi-spec-validator, jsonschema", "Every PR that changes contracts", "SA, Dev"]
        - ["API", "Each SRS endpoint: result, error code, authorization, idempotency", "Spring MockMvc/WebTestClient + Testcontainers; tests generated from the authorization matrix and OpenAPI", "Every service PR", "Dev"]
        - ["E2E", "UI user flows: booking, cancellation, screen authorization, accessibility, mobile", "Playwright + axe-core, run with synthetic data (MSW) without a backend", "Every PR that changes web (qa.yml, e2e job)", "SA, Dev"]
        - ["Security", "Authorization, injection, headers, data disclosure, supply chain, AI", "gitleaks, Trivy, OSV-Scanner, OWASP Dependency-Check, OWASP ZAP baseline, custom tests", "Every PR (static) and nightly (dynamic)", "SA"]
        - ["Performance", "p95, throughput, 1x/5x/10x scaling", "k6 (tests/performance/k6)", "Syntax: every PR. Real runs: on UAT before each milestone", "SA"]
        - ["Resilience", "Zone loss, dependency failure, backup/restore, rollback", "Documented manual drills; scenarios gradually automated", "H1 (weeks 10-11) on UAT", "SA"]
        - ["AI evaluation", "Recall@5, MRR, groundedness, citations, prompt injection, extraction F1, no-show AUC", "Dedicated eval set + harness (AI-14..17)", "Every prompt/model change; weekly", "AI Dev"]
        - ["Review", "NFRs measured by review: architecture, cost, documents, legal records", "Checklist in the PR", "Before each gate", "SA"]
  - name: Test environments and data
    table:
      header: ["Environment", "Used for", "How it is provisioned", "Data"]
      widths: [2.6, 5.0, 5.2, 3.7]
      rows:
        - ["PR / CI", "All automated PR tests", "GitHub runners, Testcontainers, web in synthetic-data mode, web container for ZAP scans", "Fixed synthetic data in the repo; fixed clock for E2E"]
        - ["Dev machine (kind)", "Running real services, trying integrations, reproducing defects", "make quickstart (dev/)", "Synthetic data loaded with the seed CLI"]
        - ["UAT (Azure)", "Production-sized performance tests, resilience, full DAST, acceptance", "env-provision (provision on demand, destroy when done)", "Synthetic data at first-year scale (50,000 patients)"]
        - ["Temporary prod", "Demo drill", "env-provision prod", "Demo synthetic data"]
    paragraphs_after:
      - "Data rules: never use real data in any environment; synthetic data uses recognizable names, phone numbers and emails so log scans and PII-leak scans can find them; each test creates and cleans up its own data."
  - name: Automation in CI/CD
    paragraphs:
      - "All automated tests run in GitHub Actions without Azure. The results of every workflow are aggregated into the pr-gate status, which is a required check for merging into main."
    table:
      header: ["Stage", "Workflow / job", "What it checks", "Blocks merge"]
      widths: [3.0, 5.0, 6.5, 2.0]
      rows:
        - ["Every PR", "pr-checks", "gitleaks, actionlint, Trivy fs, OSV-Scanner, OWASP Dependency-Check", "Yes"]
        - ["Every PR", "svc-*, libs-java", "Format, build, unit and integration tests, coverage, image scan (HIGH/CRITICAL), SBOM, signing", "Yes"]
        - ["PR that changes contracts or requirements", "contracts", "OpenAPI, events, authorization matrix, SRS content", "Yes"]
        - ["PR that changes web, requirements, tests, libs, services", "qa / trace", "Every AC/NFR has a test case; test references exist; the automation rate does not decrease", "Yes"]
        - ["PR that changes web, requirements, tests, libs, services", "qa / e2e", "Desktop and mobile E2E, axe WCAG 2.1 AA, UI security", "Yes"]
        - ["PR that changes web, requirements, tests, libs, services", "qa / dast-web", "Web image security headers; OWASP ZAP baseline (FAIL rules block)", "Yes"]
        - ["PR that changes web, requirements, tests, libs, services", "qa / k6-check", "Performance script syntax and thresholds", "Yes"]
        - ["Nightly", "qa (schedule), dependency-check-db", "ZAP scan with the latest rule set; NVD vulnerability database update", "Report a failure"]
        - ["Before each milestone, on UAT", "qa / k6 (manual run)", "1x, 5x, 10x load tests; failure tests; backup/restore", "Per gate"]
    paragraphs_after:
      - "Ratchet mechanism: baseline.json stores the number of automated test cases; a PR that decreases this number is blocked. When a new feature has tests, the author raises the baseline with `python -I tools/qa/trace.py --update-baseline` in the same PR so the automation level only increases."
  - name: Security and privacy testing
    paragraphs:
      - "Because this is health data, the following tests are mandatory, and each item has a P0 test case in the catalog:"
    bullets:
      - "Authorization: tests generated from contracts/authz/matrix.yaml for every cell (role x resource x action x condition); test 'every endpoint must have a rule'; IDOR; privilege escalation; mass assignment (TC-SEC-01..03)."
      - "No existence disclosure: another person's data returns 404, the response body is identical to a non-existent ID; every denial is audited."
      - "Authentication: token with a wrong signature, alg=none, expired, wrong audience; MFA required for staff; no tokens stored in localStorage (TC-SEC-04..06, 28)."
      - "No PII/PHI disclosure: scan logs, metrics, traces, events, URLs and error messages using recognizable synthetic data (TC-SEC-11..12)."
      - "File upload: renamed extension, polyglot file, oversized, file name containing ../, EICAR sample; download links expire and cannot be reused (TC-SEC-13..14)."
      - "Headers and web application: strict CSP, X-Frame-Options, nosniff, COOP/COEP/CORP, no server version disclosure; OWASP ZAP baseline with FAIL rules; stored XSS (TC-SEC-08..10)."
      - "AI: suite of 50 prompt injection samples in questions and in documents; data sent to external LLMs is de-identified; AI has only the caller's permissions; the bot does not act without confirmation (TC-SEC-17..19)."
      - "Emergency access and audit: scope of one patient, expires after 60 minutes, alerts the DPO, audit cannot be modified/deleted (TC-SEC-25..26)."
      - "Supply chain, secrets, network isolation, TLS (TC-SEC-21..24)."
    paragraphs_after:
      - "Actual findings from the first run: the ZAP scan showed that the CSP connect-src and form-action directives were too broad and that COEP was missing; E2E found that the empty time-slot list was not refreshed after booking; axe found several text elements with insufficient WCAG AA contrast. All three were fixed together with tests."
  - name: Performance and resilience testing
    table:
      header: ["NFR", "Scenario", "Pass threshold", "Conditions"]
      widths: [1.8, 6.0, 4.5, 4.2]
      rows:
        - ["NFR-P1", "Slot search, 500 RPS, 10 minutes (slots-search.js, SCENARIO=load)", "p95 <= 300 ms, errors < 0.1%", "Production-sized UAT, 50,000 synthetic patients, warmed up"]
        - ["NFR-P2", "Booking, 50 RPS, 20% contending for the same slot (booking.js)", "p95 <= 800 ms, 5xx < 0.1%; exactly one winner per slot", "As above"]
        - ["NFR-S2, S3", "5x and 10x load (SCENARIO=x5, x10)", "5x: p95 <= 2x target. 10x: 429 instead of outage", "As above"]
        - ["NFR-S1", "Load surge at 07:00 from the minimum level", "Meets load within <= 2 minutes without intervention", "KEDA cron + HPA"]
        - ["NFR-A3, A6", "Loss of one zone; disabling the SMS, LLM and ML providers", "No data loss; recovery <= 5 minutes; the encounter flow is not broken", "UAT"]
        - ["NFR-A4, A5", "Point-in-time restore of PostgreSQL, MongoDB and documents", "RPO <= 5 minutes, RTO <= 1 hour", "Timed, documented drill"]
        - ["NFR-A7", "Canary deployment under load", "0 requests fail due to the deployment", "Argo Rollouts on UAT"]
  - name: Entry and exit criteria
    table:
      header: ["Stage", "Entry criteria", "Exit criteria"]
      widths: [3.0, 6.5, 7.0]
      rows:
        - ["Sprint (merge PR)", "The PR has a description and new or updated tests for the change; CI can run", "pr-gate green; the feature's test cases have updated automation status; one reviewer"]
        - ["Feature acceptance", "The feature is complete per the task's 'Done when'", "Every use case AC has an automated test or an approved manual test record; 0 open P0 and P1 defects"]
        - ["Hardening (H1)", "The system runs on production-sized UAT", "NFR-P/S/A met per the table above; ZAP 0 FAIL; test report per NFR"]
        - ["Demo release / defense", "Test report, remaining defect list and accepted risks", "No failing P0 tests; every NFR-SEC met or accepted in writing by the SA"]
    paragraphs_after:
      - "Automation goals: 100% of P0 test cases at unit/integration/API/E2E level have automated tests before H1; at least 80% of all test cases automated or with a documented record; line coverage of shared libraries >= 80%, services >= 70%, web >= 70%."
  - name: Defect management
    table:
      header: ["Severity", "Definition", "Fix deadline"]
      widths: [3.0, 9.0, 4.5]
      rows:
        - ["Critical (S1)", "Patient data disclosure, privilege bypass, data loss, system outage", "Immediately; blocks release"]
        - ["High (S2)", "Core business logic error (double booking, wrong reminder, wrong AI result), NFR-SEC violation", "Within the sprint"]
        - ["Medium (S3)", "Secondary function error, hard-to-use UI, performance NFR off by less than 20%", "Next sprint"]
        - ["Low (S4)", "Display error, wording", "As capacity allows"]
    paragraphs_after:
      - "Every defect is a GitHub issue labeled with severity S1-S4, the failing test case code and the module. A fixed defect must come with a regression test (or an upgrade of the existing test case) in the same PR. Security defects are not disclosed publicly: use the repository's private reporting channel."
  - name: Roles and responsibilities
    table:
      header: ["Role", "Testing responsibility"]
      widths: [5.0, 11.5]
      rows:
        - ["Architect / DevOps (viethung12062005)", "Strategy, plan, traceability tooling, qa pipeline, E2E, security, performance, resilience; approve core test changes"]
        - ["Scheduling and notification Dev (qnt124)", "Unit, integration and API tests for scheduling and notification; test cases for the scheduling and system modules"]
        - ["Clinical, document, audit Dev (Her55chers)", "Unit, integration and API tests for clinical, document and audit; test cases for the clinical, documents and privacy-admin modules"]
        - ["AI/ML Dev (24021501-hunglk)", "Tests for ai and ml; RAG eval set, prompt injection, extraction, no-show"]
    paragraphs_after:
      - "Rules: every feature PR includes tests; the feature author writes the tests for that feature and someone else reviews them. Catalog test cases have a default owner per module."
  - name: Test plan risks
    table:
      header: ["Risk", "Impact", "Mitigation"]
      widths: [5.8, 5.4, 5.3]
      rows:
        - ["Services have no endpoints yet, so API tests cannot be written yet (currently 0 business endpoints)", "Most P0 tests are still in the 'awaiting implementation' state", "Tests are written alongside the feature; the traceability report lists missing P0 tests per person; ratchet prevents regression"]
        - ["No Azure yet, so performance, resilience and full DAST cannot be measured", "NFR-P, S and A have no measurements yet", "k6 scripts and scenarios are ready; run as soon as UAT is provisioned; trial measurements on kind"]
        - ["Synthetic data does not yet reflect every real-world situation", "Missed defects", "The data set includes edge cases (duplicate medical records, names with diacritics, times close to the 2-hour deadline); extend it based on defects found"]
        - ["AI quality depends on the model provider and may change", "Eval results fluctuate", "Re-run evals when the model changes; thresholds per NFR-AI; store results by model version"]
        - ["Small team, large test-writing workload", "Schedule slippage", "Prioritize P0 first; test generation from the authorization matrix and OpenAPI; each PR only adds tests for its own scope"]
        - ["Legal basis still needs verification (retention periods, decree effective dates)", "Retention policy tests may be wrong", "SRS Appendix A lists the items to verify; retention is configured per record type, so changing the number of years does not require code changes"]
  - name: Test schedule
    table:
      header: ["Week", "Testing focus"]
      widths: [3.0, 13.5]
      rows:
        - ["6-7", "Finalize SRS v1.0, functional test cases per module, API test skeleton; E2E, ZAP and k6-check in CI (already present); write API tests alongside the first endpoint"]
        - ["8-9", "API and integration tests for scheduling, medical records and documents; per-endpoint authorization matrix tests; AI eval part 1"]
        - ["10", "E2E tests on UAT; full ZAP; prompt injection attack suite; AI eval part 2"]
        - ["11", "1x, 5x, 10x load tests; failure tests; backup/restore; fix defects"]
        - ["12", "Security review; test results report per NFR; cost report"]
        - ["13", "Demo drill; finalize the remaining defect and risk list"]
