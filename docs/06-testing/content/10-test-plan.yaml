# Kế hoạch kiểm thử tổng thể (Master Test Plan) của Smart Hospital Platform. Sinh ra docx bằng tools/qa/plan_docx.py.
document:
  title: Kế hoạch kiểm thử tổng thể
  system: Smart Hospital Platform
  version: "0.9"
  team: Nhóm 12
  date_text: Tháng 11/2026
  srs_version: "0.96"

sections:
  - name: Giới thiệu
    paragraphs:
      - >-
        Tài liệu này mô tả cách nhóm kiểm thử Smart Hospital Platform để chứng minh từng yêu cầu trong SRS v0.96 được đáp ứng:
        phạm vi, chiến lược theo rủi ro, các mức và loại kiểm thử, môi trường, công cụ, tiêu chí vào/ra, quy trình xử lý lỗi,
        và cách tích hợp vào CI/CD. Hệ thống xử lý dữ liệu sức khỏe nên bảo mật và quyền riêng tư là rủi ro số một: không phát
        hành khi còn một test bảo mật mức P0 thất bại.
      - >-
        Nguồn sự thật của kế hoạch là mã: danh mục test case nằm ở docs/06-testing/catalog, công cụ truy vết
        (tools/qa/trace.py) kiểm trong mỗi PR rằng mọi tiêu chí nghiệm thu và NFR có test case, mọi tham chiếu test tự động
        tồn tại, và tỉ lệ tự động hóa không giảm. Tài liệu này và các báo cáo truy vết được sinh ra từ đó.
  - name: Phạm vi kiểm thử
    table:
      header: ["Hạng mục", "Trong phạm vi", "Ngoài phạm vi / giới hạn"]
      widths: [3.6, 6.8, 6.1]
      rows:
        - ["Chức năng", "52 use case của SRS (6 module) và 90 tiêu chí nghiệm thu Given/When/Then", "Thanh toán, nội trú, kê đơn (ngoài phạm vi sản phẩm)"]
        - ["Phi chức năng", "62 NFR: hiệu năng, mở rộng, sẵn sàng, bảo mật và quyền riêng tư, vận hành, triển khai, chi phí, chất lượng AI, tương thích, trợ năng", "Chi phí thực tế chỉ đo khi có Azure"]
        - ["Bảo mật", "28 test bảo mật bổ sung theo OWASP ASVS mức 2, OWASP API Top 10, OWASP LLM Top 10", "Kiểm thử xâm nhập bởi bên thứ ba: khuyến nghị trước khi dùng dữ liệu thật"]
        - ["Thành phần", "8 service, gateway, web, thư viện dùng chung, contracts (OpenAPI, sự kiện, phân quyền), hạ tầng dưới dạng code, pipeline", "Dịch vụ do nhà cung cấp quản lý (Azure, Entra ID, LLM) chỉ kiểm tích hợp, không kiểm bên trong"]
        - ["Dữ liệu", "Chỉ dữ liệu giả sinh theo docs/00-synthetic-data.md", "Dữ liệu bệnh nhân thật không bao giờ dùng để kiểm thử"]
  - name: Chiến lược kiểm thử
    paragraphs:
      - "Chiến lược theo ba nguyên tắc: kiểm thử dựa trên rủi ro, kim tự tháp kiểm thử (nhiều test nhanh ở đáy, ít test chậm ở đỉnh), và dịch chuyển sang trái (phát hiện lỗi càng sớm càng tốt, ngay trong PR)."
    table:
      header: ["Ưu tiên", "Tiêu chí", "Ví dụ", "Hậu quả khi lỗi"]
      widths: [1.8, 5.8, 5.4, 3.5]
      rows:
        - ["P0", "Liên quan quyền truy cập, dữ liệu bệnh nhân, định danh, đồng ý, audit, mã độc, an toàn người bệnh, đặt trùng slot", "Bác sĩ không có quan hệ điều trị mở được hồ sơ; log chứa tên bệnh nhân; AI đặt lịch khi chưa xác nhận", "Chặn phát hành; sửa ngay"]
        - ["P1", "Chức năng Must còn lại và NFR hiệu năng, sẵn sàng", "Đặt, hủy, đổi lịch; nhắc lịch; p95 tìm slot", "Sửa trước khi kết thúc sprint"]
        - ["P2", "Should/Could, giao diện phụ, trường hợp hiếm", "Chatbot đặt lịch, thông báo kênh dự phòng", "Có thể lùi sang sprint sau"]
    paragraphs_after:
      - "Số liệu hiện tại (xem báo cáo truy vết): 180 test case, trong đó 105 test case P0."
  - name: Các mức và loại kiểm thử
