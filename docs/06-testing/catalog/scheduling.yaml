  module: scheduling
  level: api
  priority: P1
  spec: Given 1 slot trống và 50 yêu cầu đặt đồng thời từ 50 bệnh nhân, When xử lý xong, Then đúng 1 yêu cầu thành công và
    49 nhận lỗi “slot-unavailable”.
