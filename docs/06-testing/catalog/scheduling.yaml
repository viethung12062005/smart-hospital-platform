  covers:
  - AC-FS.1
  srs_uc: find-slot
  srs_ref: UC 1
  module: scheduling
  level: api
  priority: P1
  spec: Given lịch làm việc có 14 slot trống ngày mai, When bệnh nhân tìm theo chuyên khoa đó, Then thấy đúng 14 slot theo
    thứ tự giờ.
