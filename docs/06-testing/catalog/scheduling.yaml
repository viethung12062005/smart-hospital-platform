# Test cases for module 'scheduling'. Source: acceptance criteria / NFRs in docs/02-requirements/srs. Automation: see automation.yaml
testcases:
- id: TC-AC-FS.1
  title: 'Find doctors and free time slots: AC-FS.1'
  covers:
  - AC-FS.1
  srs_uc: find-slot
  srs_ref: UC 1
  module: scheduling
  level: api
  priority: P1
  spec: Given the schedule has 14 free slots tomorrow, When the patient searches by that specialty, Then they see exactly 14
    slots in time order.
- id: TC-AC-FS.2
  title: 'Find doctors and free time slots: AC-FS.2'
  covers:
  - AC-FS.2
  srs_uc: find-slot
  srs_ref: UC 1
  module: scheduling
  level: api
  priority: P1
  spec: Given the date range exceeds 30 days, When searching, Then only slots up to <Today> + 30 days are returned.
- id: TC-AC-FS.3
  title: 'Find doctors and free time slots: AC-FS.3'
  covers:
  - AC-FS.3
  srs_uc: find-slot
  srs_ref: UC 1
  module: scheduling
  level: api
  priority: P0
  spec: Given a patient, When filtering by status "busy", Then the request is rejected or the parameter ignored, without
    exposing other people's appointments.
- id: TC-AC-03.1
  title: 'Book an appointment: AC-03.1'
  covers:
  - AC-03.1
  srs_uc: book
  srs_ref: UC 2
  module: scheduling
  level: api
  priority: P1
  spec: Given 1 free slot and 50 concurrent booking requests from 50 patients, When processing completes, Then exactly 1
    request succeeds and 49 receive the "slot-unavailable" error.
- id: TC-AC-03.2
  title: 'Book an appointment: AC-03.2'
  covers:
  - AC-03.2
  srs_uc: book
  srs_ref: UC 2
  module: scheduling
  level: api
  priority: P0
  spec: Given the same Idempotency-Key sent twice with the same content, Then both receive the same appointment and only 1
    appointment exists.
- id: TC-AC-03.3
  title: 'Book an appointment: AC-03.3'
  covers:
  - AC-03.3
  srs_uc: book
  srs_ref: UC 2
  module: scheduling
  level: api
  priority: P0
  spec: Given the same Idempotency-Key but different content, When sent, Then it is rejected and nothing changes.
- id: TC-AC-03.4
  title: 'Book an appointment: AC-03.4'
  covers:
  - AC-03.4
  srs_uc: book
  srs_ref: UC 2
  module: scheduling
  level: api
  priority: P0
  spec: Given the patient already has 3 future appointments, When booking another, Then it is rejected with
    "max-future-appointments".
- id: TC-AC-03.6
  title: 'Book an appointment: AC-03.6'
  covers:
  - AC-03.6
  srs_uc: book
  srs_ref: UC 2
  module: scheduling
  level: api
  priority: P0
  spec: Given patient A, When booking for patient B, Then it is rejected and a "deny" audit record exists.
- id: TC-AC-BK.1
  title: 'Book an appointment: AC-BK.1'
  covers:
  - AC-BK.1
  srs_uc: book
  srs_ref: UC 2
  module: scheduling
  level: integration
  priority: P0
  spec: Given a successful booking, Then the emitted event contains no name, phone number, email or visit reason.
- id: TC-AC-03.5
  title: 'Cancel an appointment: AC-03.5'
  covers:
  - AC-03.5
  srs_uc: cancel
  srs_ref: UC 3
  module: scheduling
  level: api
  priority: P0
  spec: Given 1 hour remains until the appointment, When the patient cancels, Then it is rejected with
    "cancellation-too-late"; When a nurse cancels, Then it succeeds.
- id: TC-AC-07.1
  title: 'Cancel an appointment: AC-07.1'
  covers:
  - AC-07.1
  srs_uc: cancel
  srs_ref: UC 3
  module: scheduling
  level: api
  priority: P1
  spec: Given the appointment is cancelled before the reminder time, Then no reminder is sent.
- id: TC-AC-CN.1
  title: 'Cancel an appointment: AC-CN.1'
  covers:
  - AC-CN.1
  srs_uc: cancel
  srs_ref: UC 3
  module: scheduling
  level: api
  priority: P1
  spec: Given a successful cancellation, Then the slot returns to "free" and appears in search results within <= 5
    seconds.
- id: TC-AC-RS.1
  title: 'Reschedule an appointment: AC-RS.1'
  covers:
  - AC-RS.1
  srs_uc: reschedule
  srs_ref: UC 4
  module: scheduling
  level: api
  priority: P0
  spec: Given the new slot was just booked by someone else, When rescheduling, Then the old appointment remains "booked"
    and no new appointment exists.
- id: TC-AC-RS.2
  title: 'Reschedule an appointment: AC-RS.2'
  covers:
  - AC-RS.2
  srs_uc: reschedule
  srs_ref: UC 4
  module: scheduling
  level: api
  priority: P1
  spec: Given the patient has 3 future appointments, When rescheduling one, Then it succeeds (BR-03 does not block it).
- id: TC-AC-MA.1
  title: 'View my appointments: AC-MA.1'
  covers:
  - AC-MA.1
  srs_uc: my-appointments
  srs_ref: UC 5
  module: scheduling
  level: api
  priority: P0
  spec: Given patient A sends a request to filter patient B's appointments, Then they only receive A's appointments.
- id: TC-AC-ST.1
  title: 'Create work schedule and weekly schedule template: AC-ST.1'
  covers:
  - AC-ST.1
  srs_uc: schedule-template
  srs_ref: UC 6
  module: scheduling
  level: api
  priority: P1
  spec: Given a template 08:00-11:30 with 15-minute slots, When saved, Then it is valid; Given 08:00-11:20 with 15-minute
    slots, Then an uneven-division error is returned.
- id: TC-AC-02.1
  title: 'Generate slots from a template: AC-02.1'
  covers:
  - AC-02.1
  srs_uc: generate-slots
  srs_ref: UC 7
  module: scheduling
  level: api
  priority: P1
  spec: Given a template 08:00-11:30 with 15-minute slots, When generating slots for one day, Then there are exactly 14
    "free" slots.
- id: TC-AC-GS.1
  title: 'Generate slots from a template: AC-GS.1'
  covers:
  - AC-GS.1
  srs_uc: generate-slots
  srs_ref: UC 7
  module: scheduling
  level: api
  priority: P1
  spec: Given slots for day D have been generated, When regenerating day D, Then the total number of slots for day D is
    unchanged.
- id: TC-AC-02.2
  title: 'Block / unblock slot: AC-02.2'
  covers:
  - AC-02.2
  srs_uc: block-slot
  srs_ref: UC 8
  module: scheduling
  level: api
  priority: P1
  spec: Given a slot has been booked, When blocking the slot, Then return the "slot-has-appointment" error.
- id: TC-AC-02.3
  title: 'Doctor views own work schedule and appointment schedule: AC-02.3'
  covers:
  - AC-02.3
  srs_uc: view-own-schedule
  srs_ref: UC 9
  module: scheduling
  level: api
  priority: P0
  spec: Given doctor A, When viewing doctor B's schedule or editing their own schedule, Then it is rejected and audited.
- id: TC-AC-03.7
  title: 'Book an appointment: AC-03.7'
  covers:
  - AC-03.7
  srs_uc: book
  srs_ref: UC 2
  module: scheduling
  level: api
  priority: P0
  spec: "Given a linked family member medical record, When A's account books for that record, Then the booking succeeds and the audit log records the acting account and the record booked."
