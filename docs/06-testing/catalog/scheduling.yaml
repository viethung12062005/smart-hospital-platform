  covers:
  - AC-FS.2
  srs_uc: find-slot
  srs_ref: UC 1
  module: scheduling
  level: api
  priority: P1
  spec: Given khoảng ngày vượt 30 ngày, When tìm, Then chỉ trả slot đến <Hôm nay> + 30 ngày.
- id: TC-AC-FS.3
  title: 'Tìm bác sĩ và khung giờ trống: AC-FS.3'
  covers:
  - AC-FS.3
  srs_uc: find-slot
  srs_ref: UC 1
  module: scheduling
  level: api
  priority: P0
  spec: Given bệnh nhân, When lọc trạng thái “busy”, Then yêu cầu bị từ chối hoặc bỏ qua tham số, không lộ lịch hẹn của người
    khác.
