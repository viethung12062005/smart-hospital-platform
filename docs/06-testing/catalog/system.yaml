# Test cases for module 'system'. Source: acceptance criteria / NFRs in docs/02-requirements/srs. Automation: see automation.yaml
testcases:
- id: TC-AC-SR.1
  title: 'Schedule reminders when an appointment is created: AC-SR.1'
  covers:
  - AC-SR.1
  srs_uc: schedule-reminders
  srs_ref: UC 50
  module: system
  level: integration
  priority: P1
  spec: Given the same "appointment booked" event is delivered twice, Then there is only one set of reminders.
- id: TC-AC-07.2
  title: 'Send appointment reminder: AC-07.2'
  covers:
  - AC-07.2
  srs_uc: send-reminder
  srs_ref: UC 51
  module: system
  level: integration
  priority: P1
  spec: Given the provider fails temporarily twice and then succeeds, Then the patient receives exactly 1 message.
- id: TC-AC-SN.1
  title: 'Send appointment reminder: AC-SN.1'
  covers:
  - AC-SN.1
  srs_uc: send-reminder
  srs_ref: UC 51
  module: system
  level: integration
  priority: P1
  spec: Given a reminder message is sent, Then it contains no visit reason or diagnosis.
- id: TC-AC-07.1-cancel-reminders
  title: 'Cancel reminders when an appointment is cancelled: AC-07.1'
  covers:
  - AC-07.1
  srs_uc: cancel-reminders
  srs_ref: UC 52
  module: system
  level: integration
  priority: P1
  spec: Given the appointment is cancelled before the reminder time, Then no reminder is sent.
- id: TC-AC-15.1
  title: 'Predict no-show risk: AC-15.1'
  covers:
  - AC-15.1
  srs_uc: predict-noshow
  srs_ref: UC 53
  module: system
  level: integration
  priority: P1
  spec: Given the ML service fails, Then the T-24h and T-2h reminders are still created.
- id: TC-AC-15.2
  title: 'Predict no-show risk: AC-15.2'
  covers:
  - AC-15.2
  srs_uc: predict-noshow
  srs_ref: UC 53
  module: system
  level: integration
  priority: P1
  spec: Given a prediction, Then it comes with the model version.
- id: TC-AC-NS.1
  title: 'Mark no-show: AC-NS.1'
  covers:
  - AC-NS.1
  srs_uc: mark-noshow
  srs_ref: UC 54
  module: system
  level: integration
  priority: P1
  spec: Given an 08:00 appointment with no check-in, When the job runs at 08:40, Then the appointment is "noshow".
- id: TC-AC-13.2
  title: 'Extract data from documents: AC-13.2'
  covers:
  - AC-13.2
  srs_uc: extract-document
  srs_ref: UC 55
  module: system
  level: integration
  priority: P1
  spec: Given OCR fails repeatedly, Then the document remains "available" and downloadable; the extraction item is
    "failed".
- id: TC-AC-10.1-break-glass-alert
  title: 'Emergency access alert to the DPO: AC-10.1'
  covers:
  - AC-10.1
  srs_uc: break-glass-alert
  srs_ref: UC 56
  module: system
  level: integration
  priority: P0
  spec: Given emergency access at T, Then the DPO receives an alert before T + 5 minutes.
- id: TC-AC-PG.1
  title: 'Purge data past its retention period: AC-PG.1'
  covers:
  - AC-PG.1
  srs_uc: purge-expired
  srs_ref: UC 57
  module: system
  level: integration
  priority: P0
  spec: Given a conversation created 31 days ago, When the job runs, Then the conversation is deleted; Given an encounter
    31 days ago, Then it is not deleted.
