  covers:
  - NFR-SEC4
  module: nfr
  level: security
  priority: P0
  spec: 'Chỉ số: Không secret trong code/config/image; Key Vault + workload identity; xoay vòng không cần deploy. Cách đo:
    gitleaks + push protection; diễn tập xoay khóa'
- id: TC-NFR-SEC5
  title: NFR-SEC5 Audit
  covers:
  - NFR-SEC5
  module: nfr
  level: integration
  priority: P0
  spec: 'Chỉ số: 100% truy cập dữ liệu bệnh nhân được audit (cả từ chối); tra cứu được ≤ 1 phút; bất biến. Cách đo: Test đối
    chiếu thao tác ↔ bản ghi audit; thử sửa/xóa kho WORM'
- id: TC-NFR-SEC6
