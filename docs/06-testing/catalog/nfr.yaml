# Test cases for module 'nfr'. Source: acceptance criteria / NFRs in docs/02-requirements/srs. Automation: see automation.yaml
testcases:
- id: TC-NFR-P1
  title: NFR-P1 Find free slots
  covers:
  - NFR-P1
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: p95 <= 300 ms at 500 RPS. How to measure: k6, 10 minutes, at the gateway; error rate < 0.1%'
- id: TC-NFR-P2
  title: NFR-P2 Booking
  covers:
  - NFR-P2
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: p95 <= 800 ms at 50 RPS; 5xx errors < 0.1%. How to measure: k6, 10 minutes, with 20% of requests contending for the same slot'
- id: TC-NFR-P3
  title: NFR-P3 Open medical record / timeline
  covers:
  - NFR-P3
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: p95 <= 500 ms. How to measure: k6 + trace, patient with 50 encounters'
- id: TC-NFR-P4
  title: NFR-P4 Issue upload/download links
  covers:
  - NFR-P4
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: p95 <= 300 ms. How to measure: k6'
- id: TC-NFR-P5
  title: NFR-P5 RAG assistant
  covers:
  - NFR-P5
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: First token <= 3 s; complete answer <= 10 s (p95). How to measure: Eval harness + trace, 100 questions'
- id: TC-NFR-P6
  title: NFR-P6 Medical record summary
  covers:
  - NFR-P6
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: <= 15 s (p95). How to measure: Eval harness'
- id: TC-NFR-P7
  title: NFR-P7 Document extraction
  covers:
  - NFR-P7
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: <= 2 minutes from upload (p95). How to measure: Queue latency metric'
- id: TC-NFR-P8
  title: NFR-P8 Send appointment reminders
  covers:
  - NFR-P8
  module: nfr
  level: integration
  priority: P1
  spec: 'Metric: >= 99% sent within 5 minutes after the scheduled send time. How to measure: Notification metric over 1,000 reminders'
- id: TC-NFR-S1
  title: NFR-S1 07:00 load surge
  covers:
  - NFR-S1
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: Auto-scale to meet load within <= 2 minutes, no manual intervention. How to measure: k6 ramp 0 -> 500 RPS in 1 minute; KEDA cron
    + HPA'
- id: TC-NFR-S2
  title: NFR-S2 5x load
  covers:
  - NFR-S2
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: p95 does not exceed 2x the P1/P2 targets. How to measure: k6'
- id: TC-NFR-S3
  title: NFR-S3 10x load
  covers:
  - NFR-S3
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: Controlled degradation (429, queueing) instead of outage. How to measure: k6; no pod restarts due to OOM'
- id: TC-NFR-S4
  title: NFR-S4 Independent scaling
  covers:
  - NFR-S4
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: AI/document load does not push P1/P2 beyond target. How to measure: k6 running AI and booking load in parallel'
- id: TC-NFR-A1
  title: NFR-A1 SLO for booking and medical record APIs
  covers:
  - NFR-A1
  module: nfr
  level: monitoring
  priority: P1
  spec: 'Metric: 99.9%/month (<= 43 minutes). How to measure: SLI from the gateway; error budget dashboard'
- id: TC-NFR-A2
  title: NFR-A2 SLO for AI features
  covers:
  - NFR-A2
  module: nfr
  level: resilience
  priority: P1
  spec: 'Metric: 99.0%/month; AI failures do not break the encounter flow. How to measure: SLI + failure test with the model disabled'
- id: TC-NFR-A3
  title: NFR-A3 Loss of one zone
  covers:
  - NFR-A3
  module: nfr
  level: resilience
  priority: P1
  spec: 'Metric: No loss of committed data; recovery <= 5 minutes. How to measure: Cordon every node in one zone'
- id: TC-NFR-A4
  title: NFR-A4 RPO/RTO for clinical and appointment data
  covers:
  - NFR-A4
  module: nfr
  level: resilience
  priority: P0
  spec: 'Metric: RPO <= 5 minutes; RTO <= 1 hour. How to measure: Documented recovery drill'
- id: TC-NFR-A5
  title: NFR-A5 RPO for documents and audit
  covers:
  - NFR-A5
  module: nfr
  level: resilience
  priority: P0
  spec: 'Metric: RPO = 0 for acknowledged writes. How to measure: Zone-redundant storage; check after failover'
- id: TC-NFR-A6
  title: NFR-A6 External dependency failure
  covers:
  - NFR-A6
  module: nfr
  level: resilience
  priority: P1
  spec: 'Metric: No data loss; retry + dead-letter; fallback available. How to measure: Simulate SMS/LLM/ML failure'
- id: TC-NFR-A7
  title: NFR-A7 Zero-downtime deploy
  covers:
  - NFR-A7
  module: nfr
  level: performance
  priority: P1
  spec: 'Metric: 0 requests fail due to deploy. How to measure: k6 running during rolling/canary'
- id: TC-NFR-SEC1
  title: NFR-SEC1 Authentication
  covers:
  - NFR-SEC1
  module: nfr
  level: integration
  priority: P0
  spec: 'Metric: OIDC + PKCE; MFA required for staff; access token <= 15 minutes; no passwords stored. How to measure: Integration test with
    the IdP; check the MFA claim'
- id: TC-NFR-SEC2
  title: NFR-SEC2 Authorization
  covers:
  - NFR-SEC2
  module: nfr
  level: unit
  priority: P0
  spec: 'Metric: 100% correct authorization matrix; deny by default. How to measure: Tests generated from contracts/authz/matrix.yaml: every
    cell allow and deny; test ''every endpoint has a rule'''
- id: TC-NFR-SEC3
  title: NFR-SEC3 Encryption
  covers:
  - NFR-SEC3
  module: nfr
  level: security
  priority: P0
  spec: 'Metric: TLS 1.2+ on every connection, including inside the cluster; encryption at rest for every data store and backup. How to measure:
    Scan TLS configuration; inspect Terraform configuration'
- id: TC-NFR-SEC4
  title: NFR-SEC4 Secrets
  covers:
  - NFR-SEC4
  module: nfr
  level: security
  priority: P0
  spec: 'Metric: No secrets in code/config/image; Key Vault + workload identity; rotation without redeploy. How to measure: gitleaks + push
    protection; key rotation drill'
- id: TC-NFR-SEC5
  title: NFR-SEC5 Audit
  covers:
  - NFR-SEC5
  module: nfr
  level: integration
  priority: P0
  spec: 'Metric: 100% of patient data access audited (including denials); queryable in <= 1 minute; immutable. How to measure: Test mapping
    operations to audit records; try to modify/delete the WORM store'
- id: TC-NFR-SEC6
  title: NFR-SEC6 Supply chain
  covers:
  - NFR-SEC6
  module: nfr
  level: ci
  priority: P0
  spec: 'Metric: Images scanned for vulnerabilities (block High/Critical with a fix), signed, with SBOM; the cluster only runs signed images.
    How to measure: CI pipeline; Kyverno rejects unsigned images'
- id: TC-NFR-SEC7
  title: NFR-SEC7 Network isolation
  covers:
  - NFR-SEC7
  module: nfr
  level: security
  priority: P0
  spec: 'Metric: Pod-to-pod traffic blocked by default; databases have no public endpoint. How to measure: Inspect NetworkPolicy; attempt
    unauthorized connections'
- id: TC-NFR-SEC8
  title: NFR-SEC8 AI safety
  covers:
  - NFR-SEC8
  module: nfr
  level: ai-eval
  priority: P0
  spec: 'Metric: PII masked before sending to external models; 0 prompt injection escapes; AI only uses the caller''s permissions. How to
    measure: Test blocking requests containing PII; suite of 50 attack samples (NFR-AI3)'
- id: TC-NFR-SEC9
  title: NFR-SEC9 Synthetic data
  covers:
  - NFR-SEC9
  module: nfr
  level: review
  priority: P0
  spec: 'Metric: Synthetic data only in every environment. How to measure: Synthetic data generator; review'
- id: TC-NFR-SEC10
  title: NFR-SEC10 Data minimization
  covers:
  - NFR-SEC10
  module: nfr
  level: api
  priority: P0
  spec: 'Metric: Collect only fields needed for the stated purpose; search results and lists mask phone numbers and contain no diagnoses. How to
    measure: Review API schemas; test search results'
- id: TC-NFR-SEC11
  title: NFR-SEC11 Data processing consent
  covers:
  - NFR-SEC11
  module: nfr
  level: api
  priority: P0
  spec: 'Metric: Consent stored with version and timestamp; withdrawal takes effect immediately for all AI processing. How to measure: Test withdrawing
    consent then calling summary/extraction/prediction'
- id: TC-NFR-SEC12
  title: NFR-SEC12 Data subject rights
  covers:
  - NFR-SEC12
  module: nfr
  level: e2e
  priority: P0
  spec: 'Metric: Patients can view their medical record access history and request a copy of their data; DPO processing is tracked against deadlines. How to
    measure: End-to-end flow test'
- id: TC-NFR-SEC13
  title: NFR-SEC13 No data disclosure
  covers:
  - NFR-SEC13
  module: nfr
  level: integration
  priority: P0
  spec: 'Metric: No PII/PHI in logs, metrics, traces, events, URLs, error messages; errors do not reveal whether a record exists (404).
    How to measure: Tests scan logs/events in integration tests for PII patterns; test 404 for another person resources'
- id: TC-NFR-SEC14
  title: NFR-SEC14 Session
  covers:
  - NFR-SEC14
  module: nfr
  level: e2e
  priority: P0
  spec: 'Metric: Staff auto-logout after 15 minutes idle, patients after 30 minutes; re-login required after at most 12 hours (staff)
    / 24 hours (patients); tokens not stored in localStorage. How to measure: UI E2E tests. Stricter than the maximum of NIST SP
    800-63B-4 AAL2 (1 hour idle, 24 hours total) because clinic machines are shared'
- id: TC-NFR-SEC15
  title: NFR-SEC15 Web application protection
  covers:
  - NFR-SEC15
  module: nfr
  level: security
  priority: P0
  spec: 'Metric: Strict CSP, HSTS, clickjacking protection, Secure/HttpOnly/SameSite cookies; no High findings from OWASP ZAP
    baseline. How to measure: ZAP baseline on UAT in the pipeline'
- id: TC-NFR-SEC16
  title: NFR-SEC16 Anti-abuse
  covers:
  - NFR-SEC16
  module: nfr
  level: api
  priority: P0
  spec: 'Metric: Per-user rate limits; temporary lock after 5 failed logins; patient search does not list everything. How to measure:
    429 tests; minimum search condition test'
- id: TC-NFR-SEC17
  title: NFR-SEC17 Upload file safety
  covers:
  - NFR-SEC17
  module: nfr
  level: integration
  priority: P0
  spec: 'Metric: Content-based type check, <= 20 MB, malware scan before use; infected files quarantined. How to measure: Test with
    EICAR, renamed files, oversized files'
- id: TC-NFR-SEC18
  title: NFR-SEC18 Separation of duties
  covers:
  - NFR-SEC18
  module: nfr
  level: api
  priority: P0
  spec: 'Metric: Administrators/DPO cannot read clinical data; assigning privileged roles and restoring data require a second
    approver. How to measure: Authorization tests + process review'
- id: TC-NFR-SEC19
  title: NFR-SEC19 Retention and deletion
  covers:
  - NFR-SEC19
  module: nfr
  level: integration
  priority: P0
  spec: 'Metric: Retention periods follow the retention table; temporary data is deleted on schedule; medical records are kept
    long-term. How to measure: Test the expired-data deletion job'
- id: TC-NFR-SEC20
  title: NFR-SEC20 Anonymization of analytics/training data
  covers:
  - NFR-SEC20
  module: nfr
  level: unit
  priority: P0
  spec: 'Metric: ML training data and reports contain no direct identifiers; only data from patients who still consent. How to
    measure: Test the training set schema'
- id: TC-NFR-SEC21
  title: NFR-SEC21 Incidents and cross-border data transfer
  covers:
  - NFR-SEC21
  module: nfr
  level: review
  priority: P0
  spec: 'Metric: Breach notification to the competent authority within 72 hours of discovery (Article 23(1), Law 91/2025/QH15);
    data processing impact assessment (Article 21, filed within 60 days of first processing, updated every 6 months per
    Article 22) and cross-border transfer impact assessment (Article 20: cloud regions outside Vietnam, foreign LLM
    providers) before using real data. How to measure: Incident runbook + drill measuring time from detection to notification;
    impact assessment approved'
- id: TC-NFR-O1
  title: NFR-O1 Distributed tracing
  covers:
  - NFR-O1
  module: nfr
  level: integration
  priority: P1
  spec: 'Metric: 100% of requests have a cross-service trace. How to measure: Inspect a sample trace through gateway -> service -> bus'
- id: TC-NFR-O2
  title: NFR-O2 SLO dashboard
  covers:
  - NFR-O2
  module: nfr
  level: review
  priority: P1
  spec: 'Metric: SLI/SLO + error budget dashboards for A1, P1, P2. How to measure: Dashboard review'
- id: TC-NFR-O3
  title: NFR-O3 Alerting
  covers:
  - NFR-O3
  module: nfr
  level: resilience
  priority: P1
  spec: 'Metric: Alerts for burn rate, error queue contents, expiring certificates, emergency access. How to measure: Trigger each alert
    condition'
- id: TC-NFR-O4
  title: NFR-O4 Logs
  covers:
  - NFR-O4
  module: nfr
  level: integration
  priority: P1
  spec: 'Metric: Structured logs with trace-id, no PII. How to measure: Log scanning tests (NFR-SEC13)'
- id: TC-NFR-D1
  title: NFR-D1 Lead time
  covers:
  - NFR-D1
  module: nfr
  level: ci
  priority: P1
  spec: 'Metric: Commit -> signed image <= 15 minutes; -> UAT <= 30 minutes. How to measure: Pipeline statistics'
- id: TC-NFR-D2
  title: NFR-D2 Rollback
  covers:
  - NFR-D2
  module: nfr
  level: resilience
  priority: P1
  spec: 'Metric: <= 5 minutes with a single action (GitOps revert). How to measure: Rollback drill'
- id: TC-NFR-D3
  title: NFR-D3 Infrastructure as code
  covers:
  - NFR-D3
  module: nfr
  level: resilience
  priority: P1
  spec: 'Metric: 100% of infrastructure created with IaC; rebuildable from scratch. How to measure: Provision/destroy the environment with the workflow'
- id: TC-NFR-D4
  title: NFR-D4 Environment isolation
  covers:
  - NFR-D4
  module: nfr
  level: review
  priority: P1
  spec: 'Metric: prod is separated by cluster and resource group from uat; dev runs locally. How to measure: Configuration review'
- id: TC-NFR-C1
  title: NFR-C1 Infrastructure budget
  covers:
  - NFR-C1
  module: nfr
  level: review
  priority: P1
  spec: 'Metric: No always-on cluster; always-on resources <= 10 USD/month; environments provisioned on demand. How to measure: Azure cost
    report by tag'
- id: TC-NFR-C2
  title: NFR-C2 AI cost
  covers:
  - NFR-C2
  module: nfr
  level: monitoring
  priority: P1
  spec: 'Metric: <= 0.005 USD/RAG request; daily token quotas and alerts. How to measure: Token/cost metric'
- id: TC-NFR-C3
  title: NFR-C3 Cost transparency
  covers:
  - NFR-C3
  module: nfr
  level: review
  priority: P1
  spec: 'Metric: Cost tags by environment/service; weekly report. How to measure: Review'
- id: TC-NFR-AI1
  title: NFR-AI1 RAG retrieval
  covers:
  - NFR-AI1
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: Recall@5 >= 0.8; MRR >= 0.6. How to measure: Eval set of >= 100 questions'
- id: TC-NFR-AI2
  title: NFR-AI2 RAG answer
  covers:
  - NFR-AI2
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: Groundedness >= 0.9; citation accuracy >= 0.9; correct refusal when no source >= 0.9. How to measure: Eval harness'
- id: TC-NFR-AI3
  title: NFR-AI3 Prompt injection
  covers:
  - NFR-AI3
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: 0 escapes over >= 50 samples. How to measure: Automated attack suite'
- id: TC-NFR-AI4
  title: NFR-AI4 Extraction
  covers:
  - NFR-AI4
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: Field-level F1 >= 0.85. How to measure: Labeled synthetic document set'
- id: TC-NFR-AI5
  title: NFR-AI5 Booking chatbot
  covers:
  - NFR-AI5
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: Completion >= 85%; 0 unconfirmed actions. How to measure: Automated conversation scenarios'
- id: TC-NFR-AI6
  title: NFR-AI6 No-show model
  covers:
  - NFR-AI6
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: AUC >= 0.75 and above baseline; weekly drift monitoring. How to measure: Offline evaluation + monitoring'
- id: TC-NFR-AI7
  title: NFR-AI7 Fallback
  covers:
  - NFR-AI7
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Metric: Every model in the chain is evaluated. How to measure: Per-model report'
- id: TC-NFR-I1
  title: NFR-I1 Data standards
  covers:
  - NFR-I1
  module: nfr
  level: contract
  priority: P1
  spec: 'Metric: FHIR R4 APIs for in-scope resources. How to measure: FHIR validator in contract tests'
- id: TC-NFR-I2
  title: NFR-I2 Client
  covers:
  - NFR-I2
  module: nfr
  level: e2e
  priority: P1
  spec: 'Metric: Web works on desktop and mobile (Chrome, Edge, Safari - 2 latest versions), screens >= 360 px. How to measure: Cross-browser E2E tests'
- id: TC-NFR-I3
  title: NFR-I3 Infrastructure
  covers:
  - NFR-I3
  module: nfr
  level: ci
  priority: P1
  spec: 'Metric: Runs on any Kubernetes (AKS is the target) and locally. How to measure: Run the same chart on kind and AKS'
- id: TC-NFR-U1
  title: NFR-U1 Language and accessibility
  covers:
  - NFR-U1
  module: nfr
  level: e2e
  priority: P1
  spec: 'Metric: Vietnamese and English UI; WCAG 2.1 AA on patient screens. How to measure: axe-core in E2E tests'
