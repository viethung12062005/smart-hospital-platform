  covers:
  - NFR-S4
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: Tải AI/tài liệu không làm P1/P2 vượt mục tiêu. Cách đo: k6 chạy song song tải AI và đặt lịch'
- id: TC-NFR-A1
  title: NFR-A1 SLO API đặt lịch và hồ sơ
  covers:
  - NFR-A1
  module: nfr
  level: monitoring
  priority: P1
  spec: 'Chỉ số: 99,9%/tháng (≤ 43 phút). Cách đo: SLI từ gateway; dashboard error budget'
- id: TC-NFR-A2
  title: NFR-A2 SLO tính năng AI
  covers:
  - NFR-A2
  module: nfr
  level: resilience
  priority: P1
  spec: 'Chỉ số: 99,0%/tháng; AI lỗi không làm hỏng luồng khám. Cách đo: SLI + failure test tắt model'
