  covers:
  - NFR-A6
  module: nfr
  level: resilience
  priority: P1
  spec: 'Chỉ số: Không mất dữ liệu; retry + dead-letter; có fallback. Cách đo: Giả lập SMS/LLM/ML lỗi'
- id: TC-NFR-A7
  title: NFR-A7 Deploy không gián đoạn
  covers:
  - NFR-A7
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: 0 request lỗi do deploy. Cách đo: k6 chạy trong lúc rolling/canary'
- id: TC-NFR-SEC1
