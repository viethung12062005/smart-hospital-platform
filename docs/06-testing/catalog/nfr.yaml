  covers:
  - NFR-A3
  module: nfr
  level: resilience
  priority: P1
  spec: 'Chỉ số: Không mất dữ liệu đã commit; phục hồi ≤ 5 phút. Cách đo: Cordon toàn bộ node một zone'
- id: TC-NFR-A4
  title: NFR-A4 RPO/RTO lâm sàng và lịch hẹn
  covers:
  - NFR-A4
  module: nfr
  level: resilience
  priority: P0
  spec: 'Chỉ số: RPO ≤ 5 phút; RTO ≤ 1 giờ. Cách đo: Diễn tập khôi phục có biên bản'
- id: TC-NFR-A5
  title: NFR-A5 RPO tài liệu và audit
  covers:
  - NFR-A5
  module: nfr
  level: resilience
  priority: P0
  spec: 'Chỉ số: RPO = 0 cho dữ liệu đã xác nhận ghi. Cách đo: Lưu trữ dư thừa theo zone; kiểm tra sau failover'
