  covers:
  - NFR-SEC1
  module: nfr
  level: integration
  priority: P0
  spec: 'Chỉ số: OIDC + PKCE; nhân viên bắt buộc MFA; access token ≤ 15 phút; không lưu mật khẩu. Cách đo: Test tích hợp với
    IdP; kiểm tra claim MFA'
- id: TC-NFR-SEC2
  title: NFR-SEC2 Phân quyền
  covers:
  - NFR-SEC2
  module: nfr
  level: unit
  priority: P0
  spec: 'Chỉ số: Đúng 100% ma trận phân quyền; mặc định từ chối. Cách đo: Test sinh từ contracts/authz/matrix.yaml: mỗi ô
    cho phép và từ chối; test ''mọi endpoint có quy tắc'''
- id: TC-NFR-SEC3
  title: NFR-SEC3 Mã hóa
  covers:
  - NFR-SEC3
  module: nfr
  level: security
  priority: P0
  spec: 'Chỉ số: TLS 1.2+ mọi kết nối kể cả nội bộ cụm; mã hóa at-rest mọi kho dữ liệu và bản sao lưu. Cách đo: Quét cấu hình
