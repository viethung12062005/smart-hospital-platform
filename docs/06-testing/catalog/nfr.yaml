# Test case của module 'nfr'. Nguồn: tiêu chí nghiệm thu / NFR trong docs/02-requirements/srs. Tự động hóa: xem automation.yaml
testcases:
- id: TC-NFR-P1
  title: NFR-P1 Tìm slot trống
  covers:
  - NFR-P1
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: p95 ≤ 300 ms tại 500 RPS. Cách đo: k6, 10 phút, tại gateway; tỉ lệ lỗi < 0,1%'
- id: TC-NFR-P2
  title: NFR-P2 Đặt lịch
  covers:
  - NFR-P2
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: p95 ≤ 800 ms tại 50 RPS; lỗi 5xx < 0,1%. Cách đo: k6, 10 phút, kèm 20% yêu cầu tranh chấp cùng slot'
- id: TC-NFR-P3
  title: NFR-P3 Mở hồ sơ / timeline
  covers:
  - NFR-P3
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: p95 ≤ 500 ms. Cách đo: k6 + trace, bệnh nhân có 50 lần khám'
- id: TC-NFR-P4
  title: NFR-P4 Cấp link upload/tải
  covers:
  - NFR-P4
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: p95 ≤ 300 ms. Cách đo: k6'
- id: TC-NFR-P5
  title: NFR-P5 Trợ lý RAG
  covers:
  - NFR-P5
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Chỉ số: Token đầu ≤ 3 s; trả lời đủ ≤ 10 s (p95). Cách đo: Eval harness + trace, 100 câu hỏi'
- id: TC-NFR-P6
  title: NFR-P6 Tóm tắt hồ sơ
  covers:
  - NFR-P6
  module: nfr
  level: ai-eval
  priority: P1
  spec: 'Chỉ số: ≤ 15 s (p95). Cách đo: Eval harness'
- id: TC-NFR-P7
  title: NFR-P7 Trích xuất tài liệu
  covers:
  - NFR-P7
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: ≤ 2 phút từ lúc upload (p95). Cách đo: Metric độ trễ hàng đợi'
- id: TC-NFR-P8
  title: NFR-P8 Gửi nhắc lịch
  covers:
  - NFR-P8
  module: nfr
  level: integration
  priority: P1
  spec: 'Chỉ số: ≥ 99% gửi trong 5 phút sau giờ hẹn gửi. Cách đo: Metric notification trên 1.000 lần nhắc'
- id: TC-NFR-S1
  title: NFR-S1 Đợt tăng tải 07:00
  covers:
  - NFR-S1
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: Tự scale đủ tải trong ≤ 2 phút, không can thiệp tay. Cách đo: k6 ramp 0 → 500 RPS trong 1 phút; KEDA cron
    + HPA'
- id: TC-NFR-S2
  title: NFR-S2 Tải 5×
  covers:
  - NFR-S2
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: p95 không vượt 2× mục tiêu P1/P2. Cách đo: k6'
- id: TC-NFR-S3
  title: NFR-S3 Tải 10×
  covers:
  - NFR-S3
  module: nfr
  level: performance
  priority: P1
  spec: 'Chỉ số: Xuống cấp có kiểm soát (429, hàng chờ) thay vì sập. Cách đo: k6; không có pod restart do OOM'
- id: TC-NFR-S4
