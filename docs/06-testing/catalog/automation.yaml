# Automation status of each test case. Key = test case id (catalog/*.yaml).
#   automated: an automated test already runs in CI and fully covers the test case.
#   partial:   an automated test covers part (state the `gap`); the rest awaits the feature/environment.
#   planned:   no automated test yet; `blocked_by` says what is needed to write it, `owner` is the person responsible.
#   manual:    deliberately checked manually / reviewed (state the reason).
# `refs`: "path/to/file::name" (name is a string present in the file). The traceability tool checks that the file and the name exist.
# E2E tests carry the TC-... code in the title so they are detected automatically; no need to list them here.
