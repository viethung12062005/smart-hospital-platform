# Test cases for module 'documents'. Source: acceptance criteria / NFRs in docs/02-requirements/srs. Automation: see automation.yaml
testcases:
- id: TC-AC-05.1
  title: 'Upload clinical document: AC-05.1'
  covers:
  - AC-05.1
  srs_uc: upload-document
  srs_ref: UC 28
  module: documents
  level: api
  priority: P0
  spec: Given a .exe file renamed to .pdf, When uploading, Then it is rejected after the content signature check.
- id: TC-AC-UD.1
  title: 'Upload clinical document: AC-UD.1'
  covers:
  - AC-UD.1
  srs_uc: upload-document
  srs_ref: UC 28
  module: documents
  level: api
  priority: P0
  spec: Given a 21 MB file, When requesting an upload link, Then it is rejected with "file-too-large".
- id: TC-AC-UD.2
  title: 'Upload clinical document: AC-UD.2'
  covers:
  - AC-UD.2
  srs_uc: upload-document
  srs_ref: UC 28
  module: documents
  level: integration
  priority: P0
  spec: Given a file containing the EICAR pattern, When uploading, Then the document is "quarantined" and no event is
    emitted.
- id: TC-AC-05.3
  title: 'Release document to the patient: AC-05.3'
  covers:
  - AC-05.3
  srs_uc: release-document
  srs_ref: UC 29
  module: documents
  level: api
  priority: P0
  spec: Given a document not yet released, When the patient downloads it, Then the document is not visible (404).
- id: TC-AC-05.2
  title: 'Download document: AC-05.2'
  covers:
  - AC-05.2
  srs_uc: download-document
  srs_ref: UC 30
  module: documents
  level: api
  priority: P0
  spec: Given a link issued 6 minutes ago, When opening it, Then it is rejected (403).
- id: TC-AC-05.3-download-document
  title: 'Download document: AC-05.3'
  covers:
  - AC-05.3
  srs_uc: download-document
  srs_ref: UC 30
  module: documents
  level: api
  priority: P0
  spec: Given patient A, When requesting a link to patient B's document, Then 404 is returned and a "deny" audit record
    exists.
- id: TC-AC-VD.1
  title: 'Mark document as entered by mistake: AC-VD.1'
  covers:
  - AC-VD.1
  srs_uc: void-document
  srs_ref: UC 31
  module: documents
  level: api
  priority: P0
  spec: Given a document marked as entered by mistake, Then it does not appear in the default list but remains traceable
    in the audit log.
