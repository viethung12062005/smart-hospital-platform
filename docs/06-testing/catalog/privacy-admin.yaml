# Test cases for module 'privacy-admin'. Source: acceptance criteria / NFRs in docs/02-requirements/srs. Automation: see automation.yaml
testcases:
- id: TC-AC-AL.1
  title: 'View who accessed my medical record: AC-AL.1'
  covers:
  - AC-AL.1
  srs_uc: view-my-access-log
  srs_ref: UC 38
  module: privacy-admin
  level: api
  priority: P0
  spec: Given a doctor opened the patient's medical record at 09:02, Then the patient sees that access entry within
    <= 1 minute.
- id: TC-AC-CS.1
  title: 'Manage data processing consent: AC-CS.1'
  covers:
  - AC-CS.1
  srs_uc: manage-consent
  srs_ref: UC 39
  module: privacy-admin
  level: api
  priority: P0
  spec: Given the patient withdraws consent at T, When the doctor requests a summary after T, Then it is rejected with
    "consent-required".
- id: TC-AC-EX.1
  title: 'Personal data export request: AC-EX.1'
  covers:
  - AC-EX.1
  srs_uc: export-my-data
  srs_ref: UC 40
  module: privacy-admin
  level: api
  priority: P1
  spec: Given the patient already has a request being processed, When submitting another, Then no new request is created.
- id: TC-AC-NP.1
  title: 'Notification preferences: AC-NP.1'
  covers:
  - AC-NP.1
  srs_uc: notification-preferences
  srs_ref: UC 41
  module: privacy-admin
  level: api
  priority: P1
  spec: Given the patient disables all channels, When saving, Then an error is returned.
- id: TC-AC-09.1
  title: 'Search access audit log: AC-09.1'
  covers:
  - AC-09.1
  srs_uc: search-audit
  srs_ref: UC 42
  module: privacy-admin
  level: api
  priority: P0
  spec: Given every read/write operation on patient data in UC-01, 04, 05, 06, 10, 11-13, Then each operation has one
    audit record (who, when, what, result, from where).
- id: TC-AC-09.2
  title: 'Search access audit log: AC-09.2'
  covers:
  - AC-09.2
  srs_uc: search-audit
  srs_ref: UC 42
  module: privacy-admin
  level: e2e
  priority: P0
  spec: Given an administrator, When trying to modify or delete an audit record (API, UI, storage), Then it cannot be
    done.
- id: TC-AC-EA.1
  title: 'Export audit report: AC-EA.1'
  covers:
  - AC-EA.1
  srs_uc: export-audit
  srs_ref: UC 43
  module: privacy-admin
  level: api
  priority: P0
  spec: Given an audit report export, Then there is an "export" audit record with the entered purpose.
- id: TC-AC-DR.1
  title: 'Process data subject request: AC-DR.1'
  covers:
  - AC-DR.1
  srs_uc: process-data-request
  srs_ref: UC 44
  module: privacy-admin
  level: api
  priority: P1
  spec: Given the data package has been created, Then the link can only be opened by the patient's own account and
    expires after 24 hours.
- id: TC-AC-08.2
  title: 'Invite staff and assign roles: AC-08.2'
  covers:
  - AC-08.2
  srs_uc: invite-staff
  srs_ref: UC 45
  module: privacy-admin
  level: api
  priority: P0
  spec: Given a staff member who has not enrolled MFA, When logging in, Then they cannot access patient data.
- id: TC-AC-IS.1
  title: 'Invite staff and assign roles: AC-IS.1'
  covers:
  - AC-IS.1
  srs_uc: invite-staff
  srs_ref: UC 45
  module: privacy-admin
  level: api
  priority: P0
  spec: Given an administrator assigns the DPO role to themselves, Then it is rejected.
- id: TC-AC-08.1
  title: 'Lock / unlock account: AC-08.1'
  covers:
  - AC-08.1
  srs_uc: lock-account
  srs_ref: UC 46
  module: privacy-admin
  level: api
  priority: P0
  spec: Given the account was locked at T, When using an old token at T + 5 minutes, Then it is rejected.
- id: TC-AC-LP.1
  title: 'Link doctor account to practitioner record: AC-LP.1'
  covers:
  - AC-LP.1
  srs_uc: link-practitioner
  srs_ref: UC 47
  module: privacy-admin
  level: api
  priority: P0
  spec: Given a Practitioner already linked to account A, When linking to account B, Then it is rejected.
- id: TC-AC-DL.1
  title: 'Process failed notification deliveries: AC-DL.1'
  covers:
  - AC-DL.1
  srs_uc: manage-dead-letters
  srs_ref: UC 48
  module: privacy-admin
  level: api
  priority: P1
  spec: Given an appointment has been cancelled, When resending failed items, Then no message is sent.
- id: TC-AC-16.1
  title: 'Backup and restore data: AC-16.1'
  covers:
  - AC-16.1
  srs_uc: backup-restore
  srs_ref: UC 49
  module: privacy-admin
  level: resilience
  priority: P1
  spec: Given data was accidentally deleted at T, When restoring to T - 1 minute, Then appointment and medical record
    data match the state at that moment.
- id: TC-AC-16.2
  title: 'Backup and restore data: AC-16.2'
  covers:
  - AC-16.2
  srs_uc: backup-restore
  srs_ref: UC 49
  module: privacy-admin
  level: resilience
  priority: P1
  spec: Given a restore drill, Then the report records the actual time and compares it to the RTO of 1 hour.
