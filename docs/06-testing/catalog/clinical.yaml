- id: TC-AC-DP.2
  title: 'Create a medical record for a child under 16: AC-DP.2'
  covers:
  - AC-DP.2
  srs_uc: add-dependent
  srs_ref: UC 12
  module: clinical
  level: api
  priority: P1
  spec: "Given valid information for a person under 16 and the declaration has been made, When creating, Then the medical record is created and linked to the guardian."
