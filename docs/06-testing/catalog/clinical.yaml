- id: TC-AC-ID.1
  title: 'Add national ID number at the visit: AC-ID.1'
  covers:
  - AC-ID.1
  srs_uc: supplement-national-id
  srs_ref: UC 19
  module: clinical
  level: api
  priority: P0
  spec: Given a valid national ID number and consent ticked, When saving, Then the number is stored encrypted and
    displayed masked, with only the last 4 digits.
- id: TC-AC-ID.2
  title: 'Add national ID number at the visit: AC-ID.2'
  covers:
  - AC-ID.2
  srs_uc: supplement-national-id
  srs_ref: UC 19
  module: clinical
  level: api
  priority: P0
  spec: Given the national ID number already belongs to another active medical record, When saving, Then it is not saved
    and a duplicate suspicion is reported, without disclosing that other medical record's information to anyone without
    permission.
- id: TC-AC-ID.3
  title: 'Add national ID number at the visit: AC-ID.3'
  covers:
  - AC-ID.3
  srs_uc: supplement-national-id
  srs_ref: UC 19
  module: clinical
  level: api
  priority: P1
  spec: Given an invalid format or consent not ticked, When saving, Then it is rejected.
