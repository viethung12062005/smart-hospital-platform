  title: 'Emergency access (break-glass): AC-BG.2'
  covers:
  - AC-BG.2
  srs_uc: break-glass
  srs_ref: UC 27
  module: clinical
  level: api
  priority: P0
  spec: Given a reason of 5 characters, When confirming, Then an error is shown and no access is granted.
- id: TC-AC-BG.3
  title: 'Emergency access (break-glass): AC-BG.3'
  covers:
  - AC-BG.3
  srs_uc: break-glass
  srs_ref: UC 27
  module: clinical
  level: api
  priority: P0
