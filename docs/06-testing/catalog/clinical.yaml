    the DPO must review within 24 hours.
- id: TC-AC-RG.2
  title: 'Register patient account: AC-RG.2'
  covers:
  - AC-RG.2
  srs_uc: register
  srs_ref: UC 10
  module: clinical
  level: api
  priority: P0
