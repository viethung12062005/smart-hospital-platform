  covers:
  - AC-ID.4
  srs_uc: supplement-national-id
  srs_ref: UC 19
  module: clinical
  level: security
  priority: P0
  spec: Given a stored national ID number, When searching, emitting events or writing logs, Then the number does not
    appear in those places.
- id: TC-AC-RG.3
  title: 'Register patient account: AC-RG.3'
  covers:
  - AC-RG.3
  srs_uc: register
  srs_ref: UC 10
  module: clinical
  level: integration
  priority: P1
  spec: "Given a phone number that uses Zalo but sending via Zalo fails, When requesting a code, Then the same code value is sent by SMS within at most 30 seconds."
- id: TC-AC-RG.4
  title: 'Register patient account: AC-RG.4'
  covers:
  - AC-RG.4
  srs_uc: register
  srs_ref: UC 10
  module: clinical
  level: integration
  priority: P0
  spec: "Given an OTP code already used, expired after 5 minutes or entered incorrectly 5 times, When entering the code, Then it is rejected; Given more than 5 codes in one hour for one number, When requesting more, Then it is rejected."
- id: TC-AC-CL.1
  title: 'Claim an existing hospital medical record: AC-CL.1'
  covers:
  - AC-CL.1
  srs_uc: claim-record
  srs_ref: UC 11
  module: clinical
  level: api
  priority: P0
  spec: "Given the information matches exactly one medical record, When the correct OTP code sent to the number in that medical record is entered, Then the account is linked to that medical record and no new medical record is created."
- id: TC-AC-CL.2
  title: 'Claim an existing hospital medical record: AC-CL.2'
  covers:
  - AC-CL.2
  srs_uc: claim-record
  srs_ref: UC 11
  module: clinical
  level: security
  priority: P0
  spec: "Given the information does not match or matches multiple medical records, When submitting the request, Then the response is identical to the matching case, no code is sent and no medical record data is exposed."
- id: TC-AC-CL.3
  title: 'Claim an existing hospital medical record: AC-CL.3'
  covers:
  - AC-CL.3
  srs_uc: claim-record
  srs_ref: UC 11
  module: clinical
  level: security
  priority: P0
  spec: "Given the OTP code was entered incorrectly 5 times or medical records were claimed more than 5 times in 24 hours, When trying again, Then the account is temporarily locked and an audit record exists."
- id: TC-AC-CL.4
  title: 'Claim an existing hospital medical record: AC-CL.4'
  covers:
  - AC-CL.4
  srs_uc: claim-record
  srs_ref: UC 11
  module: clinical
  level: api
  priority: P0
  spec: "Given the medical record is already linked to another account in a self relationship, When claiming the medical record, Then no link is made and the user is directed to the counter."
