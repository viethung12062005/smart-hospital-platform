  title: 'Create a medical record for a child under 16: AC-DP.3'
  covers:
  - AC-DP.3
  srs_uc: add-dependent
  srs_ref: UC 12
  module: clinical
  level: api
  priority: P1
  spec: "Given the account already manages 10 medical records, When adding an 11th, Then it is rejected."
