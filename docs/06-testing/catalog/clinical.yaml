# Test cases for module 'clinical'. Source: acceptance criteria / NFRs in docs/02-requirements/srs. Automation: see automation.yaml
testcases:
- id: TC-AC-01.2
  title: 'Register patient account: AC-01.2'
  covers:
  - AC-01.2
  srs_uc: register
  srs_ref: UC 10
  module: clinical
  level: api
  priority: P0
  spec: Given a medical record with the same phone number + date of birth exists, When registering, Then no new medical
    record is created and a verification-required message is shown, without exposing the old medical record information.
- id: TC-AC-RG.1
  title: 'Register patient account: AC-RG.1'
