  - AC-LK.2
  srs_uc: link-relative
  srs_ref: UC 13
  module: clinical
  level: api
  priority: P0
  spec: "Given a link with scope Booking, When the authorized person books, cancels, reschedules or views the relative appointments, Then it succeeds and the audit log records the acting account and the medical record accessed."
- id: TC-AC-LK.3
  title: 'Link an adult relative medical record: AC-LK.3'
  covers:
  - AC-LK.3
  srs_uc: link-relative
  srs_ref: UC 13
  module: clinical
  level: api
  priority: P0
  spec: "Given the relative comes to the counter and the Nurse records the authorization after checking the documents, When saving, Then the link takes effect and an audit record exists."
- id: TC-AC-LK.4
  title: 'Link an adult relative medical record: AC-LK.4'
  covers:
  - AC-LK.4
  srs_uc: link-relative
  srs_ref: UC 13
  module: clinical
  level: api
  priority: P0
  spec: "Given the link is more than 12 months old, When the authorized person accesses, Then it is rejected until renewed."
- id: TC-AC-PX.1
  title: 'Link an adult relative medical record: AC-PX.1'
  covers:
  - AC-PX.1
  srs_uc: link-relative
  srs_ref: UC 13
  module: clinical
  level: security
  priority: P0
  spec: "Given a link with scope Booking, When the authorized person views the relative visit results or documents, Then it is rejected and a deny audit record exists."
- id: TC-AC-RV.1
  title: 'Revoke a relative medical record link: AC-RV.1'
  covers:
  - AC-RV.1
  srs_uc: revoke-link
  srs_ref: UC 14
  module: clinical
  level: api
  priority: P0
  spec: "Given the link is active, When the record owner or manager revokes it, Then the authorized person loses access after at most 60 seconds and an audit record exists."
- id: TC-AC-RV.2
  title: 'Revoke a relative medical record link: AC-RV.2'
  covers:
  - AC-RV.2
  srs_uc: revoke-link
  srs_ref: UC 14
  module: clinical
  level: api
  priority: P1
  spec: "Given the medical record has its own account, When a new link is created or revoked, Then the record owner receives a notification."
