# Chapter 3 - Clinical documents module (document service) and AI Assistant (ai service).
modules:
  - key: documents
    name: Clinical documents
    intro: >-
      Lab results, prescriptions, referral letters, photos of paperwork. Files live in object storage and never
      pass through the API; users upload/download only through short-lived links issued for exactly one file.
    sections:
      - name: Internal portal and patient portal - Documents
        use_cases:
          - key: upload-document
            name: Upload a clinical document
            actors: [nurse, doctor]
            trace: [UC-05, AC-05.1, NFR-P4, NFR-SEC3, "API D1, D2", "Event E8"]
            objective: Add a clinical file to the patient record safely.
            trigger: The user clicks "Upload document" on [[SCR:timeline]] or [[SCR:encounter]].
            pre: ["Nurse; or Doctor with a treatment relationship with the patient."]
            post: ["The document is \"pending-scan\"; once the scan is clean it becomes \"available\" and the \"document uploaded\" event is emitted."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Select the document type and file,\nclick \"Upload\""}
              - {n: 2, lane: 1, kind: decision, text: "Authorized, correct type,\n<= 20 MB?", branches: [{to: 3, label: "Yes"}, {to: 7, label: "No"}]}
              - {n: 3, lane: 1, text: "Issue a 10-minute upload link\nfor exactly one file"}
              - {n: 4, lane: 0, text: "The browser uploads the file\ndirectly to storage"}
              - {n: 5, lane: 1, kind: decision, text: "Recheck the file,\nis the malware scan clean?", branches: [{to: 6, label: Clean}, {to: 8, label: "No"}]}
              - {n: 6, lane: 1, text: "Document \"available\",\nemit event, write audit", end: true}
              - {n: 7, lane: 1, text: "Reject, report the error", end: true}
              - {n: 8, lane: 1, text: "Quarantine the file, \"quarantined\",\nnotify the uploader", end: true}
            rules:
              - step: "(2)"
                key: upload-validate
                title: Pre-upload validation rules
                lines:
                  - "File type: PDF, JPEG, PNG (as declared by the client) -> otherwise [[MSG:invalid-file-type]]; size <= 20 MB -> otherwise [[MSG:file-too-large]] (AC-05.1)."
                  - "[Document type] is required, selected from the document type code set."
              - step: "(3)"
                title: Upload link rules
                lines:
                  - "The link allows writing exactly one object with the declared Content-Type, valid for 10 minutes; the file name in storage is generated by the system and contains no patient name."
              - step: "(5)"
                key: upload-verify
                title: Post-upload verification rules
                lines:
                  - "The system rechecks the actual size and content signature (magic bytes) - it does not trust the client declaration; mismatch -> delete the file, [[MSG:invalid-file-type]]."
                  - "The file is malware scanned; if infected -> move to quarantine, [Status] = \"quarantined\", display [[MSG:file-infected]], alert operations. A quarantined file is not used for extraction and can be downloaded only by security administrators."
              - step: "(6)"
                title: Completion rules
                lines:
                  - "Create an \"available\" DocumentReference, not yet released to the patient; emit \"shp.document.document-uploaded.v1\" (containing only the document ID, patient ID and type) to trigger [[UC:extract-document]]; display [[MSG:uploaded]]."
            acceptance:
              - ["AC-05.1", "Given a .exe file renamed to .pdf, When uploading, Then it is rejected after the content signature check step."]
              - ["AC-UD.1", "Given a 21 MB file, When requesting an upload link, Then it is rejected with \"file-too-large\"."]
              - ["AC-UD.2", "Given a file containing the EICAR pattern, When uploading, Then the document is \"quarantined\" and no event is emitted."]

          - key: release-document
            name: Release a document to the patient
            actors: [doctor]
            trace: [UC-05, AC-05.3, "API D6", "Event E9"]
            objective: Allow the patient to view a document after the doctor has reviewed it.
            trigger: The doctor clicks "Release to patient" on the document.
            pre: ["The document is \"available\"; the doctor has a treatment relationship."]
            post: ["The document is marked as released; the patient receives a notification."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Release\""}
              - {n: 2, lane: 1, text: "Display the confirmation dialog"}
              - {n: 3, lane: 0, text: "Confirm"}
              - {n: 4, lane: 1, text: "Mark as released,\nemit event, send notification", end: true}
            rules:
              - step: "(2)"
                title: Confirmation rules
                lines: ["Display [[MSG:confirm-release]]. Release is a one-way operation; to withdraw it, mark it as entered in error ([[UC:void-document]])."]
              - step: "(4)"
                title: Release rules
                lines:
                  - "Store the releaser and timestamp; emit \"shp.document.document-released.v1\"; send [[ET:document-released]] - the content only states that a new document is available, without the type or result."
            acceptance:
              - ["AC-05.3", "Given an unreleased document, When the patient downloads it, Then the document is not visible (404)."]

          - key: download-document
            name: Download a document
            actors: [patient, doctor, nurse]
            trace: [UC-05, AC-05.2, AC-05.3, BR-08, NFR-P4, "API D5"]
            objective: View/download a document through a short-lived link.
            trigger: The user clicks "View" on [[SCR:my-documents]] or [[SCR:timeline]].
            pre: ["The user has permission on the document according to the access control matrix."]
            post: ["A 5-minute download link is issued; the issuance is audited."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"View\""}
              - {n: 2, lane: 1, kind: decision, text: "Allowed?", branches: [{to: 3, label: "Yes"}, {to: 5, label: "No"}]}
              - {n: 3, lane: 1, text: "Issue a 5-minute read link,\nwrite \"download-url\" audit"}
              - {n: 4, lane: 0, text: "The browser opens the file", end: true}
              - {n: 5, lane: 1, text: "Return \"not found\",\nwrite \"deny\" audit", end: true}
            rules:
              - step: "(2)"
                key: download-authz
                title: Download permission rules
                lines:
                  - "Patient: only their own released documents; Doctor: treatment relationship or emergency access; Nurse: all \"available\" documents."
                  - "No permission -> return \"not found\" ([[MSG:not-found]]) so the existence of the document is not disclosed; write a \"deny\" audit."
                  - "Documents that are \"quarantined\" or \"entered-in-error\" do not get a link (except security administrators for quarantined files)."
              - step: "(3)"
                title: Download link rules
                lines:
                  - "The link is read-only for exactly one file, valid for 5 minutes (BR-08), with Content-Disposition attachment; after expiry it returns an error and the interface displays [[MSG:link-expired]] (AC-05.2)."
                  - "The link must not be written to application logs; every issuance is audited (actor, document, timestamp, masked IP)."
            acceptance:
              - ["AC-05.2", "Given a link issued 6 minutes ago, When opening it, Then it is rejected (403)."]
              - ["AC-05.3", "Given patient A, When requesting a link to patient B's document, Then 404 is returned and a \"deny\" audit is recorded."]

          - key: void-document
            name: Mark a document as entered in error
            actors: [doctor]
            trace: [UC-05, "API D7", BR-11]
            objective: Withdraw a document uploaded for the wrong patient or with the wrong content without deleting data.
            trigger: The doctor (the uploader or a doctor with a treatment relationship) clicks "Mark as entered in error".
            pre: ["The document is \"available\"."]
            post: ["The document is \"entered-in-error\"; hidden from default lists; the original file is still retained per archival regulations."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Mark as entered in error\",\nenter a reason"}
              - {n: 2, lane: 1, text: "Display the confirmation dialog"}
              - {n: 3, lane: 0, text: "Confirm"}
              - {n: 4, lane: 1, text: "Change to \"entered-in-error\",\nwrite audit", end: true}
            rules:
              - step: "(2)"
                title: Withdrawal rules
                lines:
                  - "Display [[MSG:confirm-void]]; [Reason] is required. There is no function to delete clinical documents (BR-11: long-term retention)."
                  - "If the document was already released, the patient can no longer see it and receives the notification \"a document has been withdrawn by the doctor\"."
            acceptance:
              - ["AC-VD.1", "Given a document marked as entered in error, Then it does not appear in default lists but remains traceable in the audit."]

  - key: ai
    name: AI assistant
    intro: >-
      Knowledge assistant (RAG), record summary, extraction review, booking chatbot. General principles for every AI feature:
      AI does not diagnose or prescribe in place of a doctor (BR-09); personally identifying data is masked before being sent to the external
      model provider ([[CBR:ai-safety]]); AI accesses data only with the user's own permissions; every AI result is labeled
      "generated by AI, needs review".
    sections:
      - name: Internal portal - AI assistant
        use_cases:
          - key: ask-assistant
            name: Ask the medical knowledge assistant
            actors: [doctor, nurse]
            trace: [UC-11, AC-11.1, AC-11.2, AC-11.3, BR-09, NFR-P5, "API AI1"]
            objective: Answer questions about protocols and internal procedures based on approved documents, always with citations.
            trigger: The user enters a question on [[SCR:assistant]] and clicks "Send".
            pre: ["The user is a Doctor or Nurse; the knowledge base contains approved documents."]
            post: ["An answer with citations, or a notice that there is no information in the documents; the conversation is retained for 30 days."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Enter a question, click \"Send\""}
              - {n: 2, lane: 1, kind: decision, text: "Passes input\nvalidation?", branches: [{to: 3, label: "Yes"}, {to: 8, label: "No"}]}
              - {n: 3, lane: 1, text: "Find document passages the user\nis allowed to view (hybrid)"}
              - {n: 4, lane: 1, kind: decision, text: "Any relevant\npassages?", branches: [{to: 5, label: "Yes"}, {to: 7, label: "No"}]}
              - {n: 5, lane: 1, text: "Generate an answer through the model chain,\ncheck citations and output"}
              - {n: 6, lane: 1, text: "Stream the answer\nwith citations and the AI label", end: true}
              - {n: 7, lane: 1, text: "Return \"no information\nin the documents\"", end: true}
              - {n: 8, lane: 1, text: "Reject, write audit", end: true}
            alternatives:
              - "The primary model fails or times out: switch to the next model in the chain; when the chain is exhausted, return the list of related documents with [[MSG:ai-unavailable]] (AC-11.3)."
              - "The daily AI cost budget is exhausted: return [[MSG:ai-budget]] and the list of related documents."
            rules:
              - step: "(2)"
                key: ai-input-guard
                title: Input validation rules
                lines:
                  - "The question is 3-2,000 characters; exceeded -> [[MSG:max-length]]."
                  - "Known prompt injection patterns are detected (\"ignore the instructions...\", requests to reveal the system prompt) -> reject, write an \"ai-guardrail\" audit."
                  - "Questions containing patient identifying information (name + date of birth, phone number, patient ID) are masked before processing per [[CBR:ai-safety]]; the knowledge assistant does not use patient record data."
              - step: "(3)"
                key: rag-authz
                title: Authorized retrieval rules
                lines:
                  - "Search only in \"approved\" knowledge base documents that the user's role/department is allowed to view; the permission filter is part of the search query, not applied afterwards."
                  - "At most 50 candidate passages, reranked, keeping the 5 best passages."
              - step: "(5)"
                key: rag-output-guard
                title: Answer generation and validation rules
                lines:
                  - "The answer is based only on the retrieved passages; content in documents is treated as data, not instructions (AC-11.2)."
                  - "Every point must have at least one citation pointing to the correct source passage (document, section); a citation that does not match the source passage -> drop that point; if no points remain -> step (7) (AC-11.1)."
                  - "Do not give diagnoses for a specific patient or prescribe treatment (BR-09); such questions receive a refusal answer with guidance to consult the protocol."
              - step: "(6)"
                title: Display rules
                lines:
                  - "First token <= 3 seconds, full answer <= 10 seconds (p95) (NFR-P5); display the label \"Generated by AI, needs review\"; helpful/not helpful rating buttons ([[UC:answer-feedback]])."
                  - "The conversation is retained for 30 days and then automatically deleted ([[UC:purge-expired]]); only the conversation owner can view it."
            acceptance:
              - ["AC-11.1", "Given a question with an answer in the documents, Then the answer has >= 1 citation pointing to the correct source passage; Given none exists, Then it returns \"no information in the documents\"."]
              - ["AC-11.2", "Given a document containing the sentence \"ignore the previous instructions\", When asking, Then behavior is unchanged (the 50-sample prompt injection set scores 100%)."]
              - ["AC-11.3", "Given the primary model fails, Then the answer comes from the fallback model; Given all models fail, Then the list of related documents is returned."]
              - ["AC-AS.1", "Given a nurse in the Internal Medicine department, When asking about a document restricted to Cardiology, Then there are no citations from that document."]

          - key: answer-feedback
            name: Rate an answer
            type: Basic
            actors: [doctor, nurse]
            trace: [UC-11, "API AI2"]
            objective: Record whether an answer was helpful in order to improve the assistant.
            trigger: The user clicks "Helpful" / "Not helpful" below the answer.
            pre: ["The user is the conversation owner."]
            post: ["The rating is saved (one rating per answer, editable)."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Click a rating, enter an\noptional comment"}
              - {n: 2, lane: 1, text: "Save the rating", end: true}
            rules:
              - step: "(2)"
                title: Save rules
                lines: ["Comments are at most 1,000 characters and are masked for identifying information before saving; only the conversation owner can rate."]
            acceptance:
              - ["AC-FB.1", "Given a user other than the conversation owner, When submitting a rating, Then it is rejected (404)."]

          - key: summarize
            name: Summarize a patient record with AI
            actors: [doctor]
            trace: [UC-12, AC-12.1, AC-12.2, AC-12.3, NFR-P6, "API AI4"]
            objective: Summarize comorbidities, allergies, the most recent visit, medications and abnormal results - each point linking to the source record.
            trigger: The doctor clicks "Summarize" on [[SCR:timeline]].
            pre: ["The doctor has a treatment relationship or emergency access; the patient has consented to AI data processing."]
            post: ["A summary with source links and the AI label is displayed (not saved to the record)."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Summarize\""}
              - {n: 2, lane: 1, kind: decision, text: "Authorized and\npatient consent given?", branches: [{to: 3, label: "Yes"}, {to: 6, label: "No"}]}
              - {n: 3, lane: 1, text: "Fetch data using the doctor's\ntoken, mask identifiers"}
              - {n: 4, lane: 1, text: "Generate the summary, drop points\nwithout a valid source"}
              - {n: 5, lane: 1, text: "Display the summary, source\nlinks, AI label", end: true}
              - {n: 6, lane: 1, text: "Reject, display the reason;\noffer the structured timeline", end: true}
            rules:
              - step: "(2)"
                key: ai-consent
                title: Permission and consent rules
                lines:
                  - "Apply [[BR:timeline-authz]] for the doctor."
                  - "The patient has not consented or has withdrawn consent to AI data processing ([[UC:manage-consent]]) -> [[MSG:consent-required]]; the interface still offers the structured timeline."
              - step: "(3)"
                title: Data collection rules
                lines:
                  - "The AI service calls the clinical service using the doctor's token (on-behalf-of) - it has no broader permissions than the doctor (AC-12.1)."
                  - "Before sending to the external model provider: replace full name, phone number, email, address and identifiers with pseudonyms; the reverse map exists only in the request memory ([[CBR:ai-safety]])."
              - step: "(4)"
                title: Result validation rules
                lines:
                  - "Every point must cite a source record ID present in the collected data; a point without a valid source is dropped (AC-12.2)."
                  - "Result <= 15 seconds (p95) (NFR-P6); cache for 10 minutes for the same doctor and the same data version."
              - step: "(5)"
                title: Display rules
                lines: ["The label \"Generated by AI, needs review\" is always displayed (AC-12.3); the summary is not saved to the patient record; every summary is audited."]
            acceptance:
              - ["AC-12.1", "Given the doctor lacks permission to view an encounter, Then the summary contains no information from that encounter."]
              - ["AC-12.2", "Given a summary, Then every point has a link to an openable source record."]
              - ["AC-SM.1", "Given the patient has withdrawn AI consent, When the doctor clicks \"Summarize\", Then it is rejected with \"consent-required\"."]
              - ["AC-SM.2", "Given a request sent to the model provider, Then it contains no patient full name, phone number, email or address (verified by a simulated network interception test)."]

          - key: review-extraction
            name: Review document extraction results
            actors: [nurse, doctor]
            trace: [UC-13, AC-13.1, BR-10, "API AI5, AI6"]
            objective: Confirm, edit or reject each field extracted by AI from a document before it is written to the record.
            trigger: The user opens an item on [[SCR:extraction-review]].
            pre: ["The extraction result is \"needs-review\"; doctors must have a treatment relationship."]
            post: ["Confirmed fields are written to the record (Observation...) with the reviewer's permissions; the result is \"accepted\" or \"rejected\"."]
            lanes: [Reviewer, System]
            steps:
              - {n: 1, lane: 0, text: "Open the item to review"}
              - {n: 2, lane: 1, text: "Display the document, highlighted regions and\nextracted values, confidence"}
              - {n: 3, lane: 0, text: "Confirm / edit / discard each\nfield, click \"Save result\""}
              - {n: 4, lane: 1, kind: decision, text: "Values valid?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
              - {n: 5, lane: 1, text: "Write confirmed fields to the record,\nstore edited fields, write audit", end: true}
            rules:
              - step: "(2)"
                title: Display rules
                lines: ["Fields with confidence below the threshold (0.85 by default) are highlighted with a warning color; every field defaults to \"not confirmed\" - there is no \"accept all\" button (AC-13.1)."]
              - step: "(4)"
                title: Validation rules
                lines: ["Edited values must pass the same validation as manual entry (units, plausible range - [[BR:vital-ranges]])."]
              - step: "(5)"
                title: Record writing rules
                lines:
                  - "Only confirmed fields are written; writing uses the reviewer's token (on-behalf-of), with the source recorded as \"AI extraction, confirmed by <Name>\"; the list of edited fields is retained."
                  - "Reject all -> \"rejected\", nothing is written to the record."
            acceptance:
              - ["AC-13.1", "Given an unconfirmed extraction result, Then no field appears in the patient record."]
              - ["AC-RE.1", "Given a doctor without a treatment relationship, When opening a review item, Then it is rejected."]

          - key: manage-kb
            name: Manage the knowledge base
            type: Basic
            actors: [admin]
            trace: [UC-11, "API AI9"]
            objective: Add, approve, version and remove the assistant's source documents; set the viewing scope by role/department.
            trigger: The administrator opens [[SCR:kb]].
            pre: ["The administrator is logged in (MFA)."]
            post: ["The document is indexed (after approval) or removed from the index."]
            alternatives:
              - "Applies [[CMUC:view-list]], [[CMUC:view-item]], [[CMUC:create-item]], [[CMUC:update-item]], [[CMUC:disable-item]] to the Knowledge base document object."
            rules:
              - step: "(N/A)"
                title: Specific rules
                lines:
                  - "Only \"approved\" documents are indexed; version replacement leaves no index gap (the new version is indexed before the old one is removed)."
                  - "Knowledge base documents must not contain patient data; on upload the system scans for identifying information patterns and rejects the file if found."
                  - "[Viewing scope] is required (role and/or department)."
            acceptance:
              - ["AC-KB.1", "Given a \"draft\" document, When asking the assistant, Then there are no citations from that document."]

      - name: Patient portal - Chatbot
        use_cases:
          - key: chatbot-booking
            name: Booking chatbot
            actors: [patient]
            trace: [UC-14, AC-14.1, AC-14.2, AC-14.3, "API AI7, AI8"]
            objective: Book or cancel by conversation; every action must be explicitly confirmed by the patient.
            trigger: The patient opens [[SCR:chatbot]] and enters a request.
            pre: ["The patient is logged in."]
            post: ["The appointment is booked/cancelled after confirmation, or nothing changes."]
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Enter a request (for example \"cardiology\non Thursday morning\")"}
              - {n: 2, lane: 1, text: "Understand the intent, find slots using\nthe patient's permissions"}
              - {n: 3, lane: 1, text: "Propose an action,\nrequest confirmation"}
              - {n: 4, lane: 0, kind: decision, text: "Confirm?", branches: [{to: 5, label: "Yes"}, {to: 7, label: "No"}]}
              - {n: 5, lane: 1, text: "Perform the booking / cancellation per\nthe rules of the book / cancel use cases"}
              - {n: 6, lane: 1, text: "Report the result", end: true}
              - {n: 7, lane: 1, text: "Discard the proposal, no changes", end: true}
            alternatives: ["If every model fails or the bot does not understand after 3 turns: switch the patient to [[SCR:find-doctor]] with the filters it understood (AC-14.3)."]
            rules:
              - step: "(2)"
                title: Bot limitation rules
                lines:
                  - "The bot has only 4 tools: find slots, view my appointments, propose booking, propose cancellation; at most 6 tool-call rounds, 10 seconds per turn."
                  - "The bot calls APIs using the patient's own token, so it cannot access another patient's data (AC-14.2); it does not answer medical specialty questions."
              - step: "(3)"
                key: bot-confirm
                title: Action confirmation rules
                lines:
                  - "The bot never books/cancels directly: it creates an action awaiting confirmation and displays [[MSG:confirm-bot-action]] with a \"Confirm\" button rendered by the interface (not text generated by the model)."
                  - "The pending action expires after 5 minutes -> [[MSG:confirmation-expired]] (AC-14.1)."
              - step: "(5)"
                title: Execution rules
                lines: ["Apply [[UC:book]] / [[UC:cancel]] unchanged (including BR-02, BR-03 and idempotency) with [Booking channel] = \"chatbot\"."]
            acceptance:
              - ["AC-14.1", "Given the bot proposes a booking, When the patient does not click confirm, Then no appointment is created."]
              - ["AC-14.2", "Given the patient asks about another person's appointments, Then the bot returns no data for that person."]
              - ["AC-14.3", "Given every model fails, Then the interface switches to the booking form."]
