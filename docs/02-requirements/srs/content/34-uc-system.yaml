# Chapter 3 - Automated task module (event-processing worker and scheduled jobs).
modules:
  - key: system
    name: Automated system tasks
    intro: >-
      Use cases triggered by the system itself through events or schedules. Events are delivered at least once, so every
      processing step must be safe to re-run (idempotent) - see [[CBR:event-processing]].
    sections:
      - name: Reminders
        use_cases:
          - key: schedule-reminders
            name: Schedule reminders when an appointment is created
            type: Other
            actors: [system]
            trace: [UC-07, NFR-P8, "Event E1, E3, E10"]
            objective: Create T-24h, T-2h (and T-6h if the no-show risk is high) reminders for each appointment.
            trigger: The "booked", "rescheduled" or "risk scored" event.
            pre: ["The appointment is \"booked\"."]
            post: ["The \"scheduled\" reminders exist and are not duplicated."]
            lanes: [Event queue, System]
            steps:
              - {n: 1, lane: 0, text: "Receive the event"}
              - {n: 2, lane: 1, kind: decision, text: "Has this event\nalready been processed?", branches: [{to: 3, label: "No"}, {to: 5, label: "Yes"}]}
              - {n: 3, lane: 1, text: "Create reminders for the\nremaining time points"}
              - {n: 4, lane: 1, text: "Save, mark as processed", end: true}
              - {n: 5, lane: 1, text: "Skip", end: true}
            rules:
              - step: "(3)"
                title: Reminder time-point rules
                lines:
                  - "Create T-24h and T-2h reminders; skip a point that has already passed (a booking made close to the visit time only gets T-2h, or no reminder)."
                  - "If the no-show risk is >= the threshold, add a T-6h reminder. The default threshold is 0.30, configurable, and calibrated on real data after 4 weeks (see \"Threshold rationale\"); if the risk score is missing (ML failure), still create T-24h and T-2h (AC-15.1)."
                  - "Reschedule: cancel the reminders of the old appointment and create reminders for the new appointment."
                  - "Each reminder is unique per (appointment ID, reminder type)."
            acceptance:
              - ["AC-SR.1", "Given the same \"booked\" event is delivered twice, Then there is only one set of reminders."]

          - key: send-reminder
            name: Send the appointment reminder
            type: Other
            actors: [system]
            trace: [UC-07, AC-07.2, NFR-P8, NFR-A6]
            objective: Send a due reminder through the preferred channel, with retries and a fallback channel.
            trigger: A job every minute picks up due reminders.
            pre: ["The reminder is \"scheduled\" and its send time has arrived."]
            post: ["The reminder is \"sent\" or \"failed\" (into the dead-letter queue with an operations alert)."]
            lanes: [System, Messaging provider]
            steps:
              - {n: 1, lane: 0, text: "Fetch due reminders\n(atomic lock)"}
              - {n: 2, lane: 0, kind: decision, text: "Is the appointment still\n\"booked\"?", branches: [{to: 3, label: "Yes"}, {to: 7, label: "No"}]}
              - {n: 3, lane: 1, text: "Send through the preferred channel"}
              - {n: 4, lane: 0, kind: decision, text: "Success?", branches: [{to: 5, label: "Yes"}, {to: 6, label: "No"}]}
              - {n: 5, lane: 0, text: "Mark as \"sent\"", end: true}
              - {n: 6, lane: 0, text: "Retry / switch to the fallback channel;\nwhen attempts run out, \"failed\"", end: true}
              - {n: 7, lane: 0, text: "Cancel the reminder", end: true}
            rules:
              - step: "(1)"
                title: Claiming rules
                lines: ["Multiple worker replicas run in parallel; each reminder is claimed by only one worker (lease lock) so it is not sent twice."]
              - step: "(3)"
                key: reminder-content
                title: Message content rules
                lines:
                  - "Use [[ET:reminder]]; the content contains only the visit time, doctor name, specialty, location and a link to manage the appointment - no diagnosis, visit reason or results."
                  - "Respect quiet hours (except the T-2h reminder); the language follows the patient's preference."
              - step: "(6)"
                title: Retry rules
                lines:
                  - "At most 5 attempts with a backoff of 10 seconds, 1, 5 and 15 minutes; permanent errors (invalid number) are not retried."
                  - "If the primary channel fails completely, switch to the fallback channel (push -> email -> SMS); when channels run out -> \"failed\", into the dead-letter queue, operations alert ([[UC:manage-dead-letters]])."
                  - ">= 99% of reminders are sent within 5 minutes of the scheduled send time (NFR-P8)."
            acceptance:
              - ["AC-07.2", "Given the provider fails temporarily twice and then succeeds, Then the patient receives exactly 1 message."]
              - ["AC-SN.1", "Given a reminder has been sent, Then it contains no visit reason or diagnosis."]

          - key: cancel-reminders
            name: Cancel reminders when an appointment is cancelled
            type: Other
            actors: [system]
            trace: [UC-07, AC-07.1, "Event E2"]
            objective: Ensure that no reminder is sent for a cancelled appointment.
            trigger: The "appointment cancelled" event.
            pre: ["N/A"]
            post: ["Every \"scheduled\" reminder of the appointment becomes \"cancelled\"."]
            lanes: [Event queue, System]
            steps:
              - {n: 1, lane: 0, text: "Receive the \"cancelled\" event"}
              - {n: 2, lane: 1, text: "Cancel the \"scheduled\"\nreminders", end: true}
            rules:
              - step: "(2)"
                title: Cancellation rules
                lines: ["Safe to re-run; if the cancellation event arrives before the booking event (out of order), the appointment is marked cancelled so the reminder-scheduling step skips it."]
            acceptance:
              - ["AC-07.1", "Given an appointment is cancelled before the reminder time, Then no reminder is sent."]

      - name: No-show prediction and marking
        use_cases:
          - key: predict-noshow
            name: Predict the no-show risk
            type: Other
            actors: [system]
            trace: [UC-15, AC-15.1, AC-15.2, "Event E1, E10"]
            objective: Calculate the no-show probability for each new appointment.
            trigger: The "booked" event.
            pre: ["The patient has consented to AI processing of their data."]
            post: ["The prediction is stored with the model version; the \"scored\" event is emitted."]
            lanes: [Event queue, System]
            steps:
              - {n: 1, lane: 0, text: "Receive the \"booked\" event"}
              - {n: 2, lane: 1, kind: decision, text: "Does the patient\nconsent to AI?", branches: [{to: 3, label: "Yes"}, {to: 5, label: "No"}]}
              - {n: 3, lane: 1, text: "Compute features, run the model,\nstore the result + version"}
              - {n: 4, lane: 1, text: "Emit the \"scored\" event", end: true}
              - {n: 5, lane: 1, text: "Skip, do not store a prediction", end: true}
            rules:
              - step: "(3)"
                title: Prediction rules
                lines:
                  - "Features contain only non-identifying data: age band, specialty, booking-to-visit interval in days, visit hour, number of previous no-shows/bookings; no full name, address or diagnosis."
                  - "Store [Model version] with each prediction for traceability (AC-15.2); on failure or more than 2 seconds, skip without blocking reminders (AC-15.1)."
                  - "The training set uses anonymized data and only from patients who still consent."
            acceptance:
              - ["AC-15.1", "Given the ML service fails, Then the T-24h and T-2h reminders are still created."]
              - ["AC-15.2", "Given a prediction, Then it is accompanied by a model version."]

          - key: mark-noshow
            name: Mark a no-show
            type: Other
            actors: [system]
            trace: [UC-15, BP-2, "Event E5"]
            objective: Move appointments that are past their time without check-in to \"noshow\".
            trigger: A job every 10 minutes.
            pre: ["The appointment is \"booked\" and the visit time is more than 30 minutes past."]
            post: ["The appointment is \"noshow\"; the status-change event is emitted (used for ML and reporting)."]
            lanes: [Scheduled job, System]
            steps:
              - {n: 1, lane: 0, text: "Run on schedule"}
              - {n: 2, lane: 1, text: "Move overdue appointments\nto \"noshow\", emit the event", end: true}
            rules:
              - step: "(2)"
                title: Marking rules
                lines: ["Only \"booked\" appointments with [Start] + 30 minutes < <Now>; safe to re-run; a Nurse can change the status to \"arrived\" on the same day if the patient arrives late (audited)."]
            acceptance:
              - ["AC-NS.1", "Given an 08:00 appointment has not checked in, When the job runs at 08:40, Then the appointment is \"noshow\"."]

      - name: Document processing, alerts and retention
        use_cases:
          - key: extract-document
            name: Extract data from a document
            type: Other
            actors: [system]
            trace: [UC-13, AC-13.1, AC-13.2, BR-10, NFR-P7, "Event E8"]
            objective: OCR the document, classify it and extract fields for user review.
            trigger: The "document uploaded" event.
            pre: ["The document is \"available\"; the patient has consented to AI processing of their data."]
            post: ["The extraction result is \"needs-review\", or \"failed\" after 5 attempts (without affecting the document)."]
            lanes: [Event queue, System, Language model]
            steps:
              - {n: 1, lane: 0, text: "Receive the event"}
              - {n: 2, lane: 1, text: "Obtain a 60-second read link,\nrun OCR in the cluster"}
              - {n: 3, lane: 1, text: "Mask identifiers in\nthe OCR text"}
              - {n: 4, lane: 2, text: "Classify and extract fields\naccording to the schema"}
              - {n: 5, lane: 1, text: "Check values/units,\nconfidence score, \"needs-review\"", end: true}
            rules:
              - step: "(2)"
                title: File access rules
                lines: ["The AI service requests a 60-second read link through an internal endpoint, using its workload identity; OCR runs in the cluster and the OCR text is stored in the internal store."]
              - step: "(3)"
                title: Identifier masking rules
                lines: ["Apply [[CBR:ai-safety]] before sending text to an external model."]
              - step: "(5)"
                title: Result rules
                lines:
                  - "Nothing is written to the record; only a review item is created for [[UC:review-extraction]] (AC-13.1). Complete <= 2 minutes after upload (p95) (NFR-P7)."
                  - "On failure: retry 5 times; when attempts run out -> \"failed\", into the dead-letter queue, without blocking upload or document viewing (AC-13.2)."
            acceptance:
              - ["AC-13.2", "Given OCR keeps failing, Then the document remains \"available\" and downloadable; the extraction item is \"failed\"."]

          - key: break-glass-alert
            name: Emergency access alert to the DPO
            type: Other
            actors: [system]
            trace: [UC-10, AC-10.1, BR-07]
            objective: Notify the DPO of every emergency access for review.
            trigger: An audit entry whose [Purpose] = \"break-glass\".
            pre: ["N/A"]
            post: ["The DPO receives the alert within <= 5 minutes; the review item appears on [[SCR:audit]]."]
            lanes: [System, Data Protection Officer]
            steps:
              - {n: 1, lane: 0, text: "Detect the \"break-glass\"\naudit entry"}
              - {n: 2, lane: 0, text: "Create the review item,\nsend the alert"}
              - {n: 3, lane: 1, text: "Receive the alert", end: true}
            rules:
              - step: "(2)"
                title: Alert rules
                lines:
                  - "Use [[ET:break-glass-alert]]: doctor name, department, time, patient ID (not the patient's name), reason; <= 5 minutes (AC-10.1)."
                  - "A review item still unprocessed after 72 hours is re-notified to the DPO."
            acceptance:
              - ["AC-10.1", "Given emergency access at time T, Then the DPO receives the alert before T + 5 minutes."]

          - key: purge-expired
            name: Purge data past its retention period
            type: Other
            actors: [system]
            trace: [BR-11, NFR-SEC, "Personal Data Protection Law 91/2025/QH15 - time-limited retention"]
            objective: Automatically delete temporary data with a short retention period according to the retention policy.
            trigger: A daily job at 02:00.
            pre: ["N/A"]
            post: ["Expired data is deleted; the number of deletions is recorded in the operations log."]
            lanes: [Scheduled job, System]
            steps:
              - {n: 1, lane: 0, text: "Run on schedule"}
              - {n: 2, lane: 1, text: "Delete expired data per the\nretention table, record the count", end: true}
            rules:
              - step: "(2)"
                key: retention
                title: Retention rules
                lines:
                  - "Assistant conversations: 30 days. Chatbot conversations and pending actions: 7 days. Audit exports and patient data packages: 24 hours. Sent reminders: 90 days. Deduplication records (inbox, idempotency): 7 days."
                  - "Medical records, encounters and clinical documents: this job never deletes them. Retention is configurable per record type; the default minimum is 10 years, and record types with a longer statutory retention follow records-management law (see \"Threshold rationale\"; verify against official texts before using real data). Audit: 90 days for fast search + immutable archive for at least 10 years, matching the retention of the records whose access it proves (replacing the 2-year period in v0.9); the WORM original follows the lock policy."
            acceptance:
              - ["AC-PG.1", "Given a conversation created 31 days ago, When the job runs, Then the conversation is deleted; Given an encounter from 31 days ago, Then it is not deleted."]
