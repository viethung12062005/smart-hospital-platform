# Wireframes for screens not yet present in the web interface (keys = screen keys in 50-screens.yaml).
# Illustration data is synthetic data. Screens already present in the web interface use real screenshots in docs/02-requirements/srs/mockups/.
wireframes:
  register:
    user: "No record yet"
    nav: ["#Register", "Personal information"]
    active: "Personal information"
    blocks:
      - {t: h, text: "Create an account"}
      - {t: p, text: "Enter administrative information to create a patient record. The phone number and email come from the verified account; for an email account, enter and verify the phone number with an OTP code."}
      - t: form
        fields:
          - ["Full name *", text, "Nguyen Thi Lan"]
          - ["Date of birth *", text, "12/04/1988"]
          - ["Gender *", select, "Female"]
          - ["Phone number *", text, "0900 010 001 (OTP verified)"]
          - ["Email", label, "lan.nguyen@example.org (from the account, not editable)"]
      - {t: banner, text: "Personal data processing terms: purpose, retention period, your rights. Read the full text before consenting."}
      - t: form
        cols: 1
        fields:
          - ["Required", check, "I have read and accept the personal data processing terms"]
          - ["Optional", check, "Allow processing my health data with AI (summary, extraction, prediction). Unchecked by default."]
      - {t: buttons, items: [["Create account", primary], ["Cancel", secondary]]}
  claim-record:
    user: "No record yet"
    nav: ["#Register", "Personal information"]
    active: "Personal information"
    blocks:
      - {t: h, text: "I have visited the hospital before"}
      - {t: p, text: "Enter the information exactly as registered at the hospital. The verification code is sent only to the phone number stored in the record."}
      - t: form
        fields:
          - ["Full name *", text, "Nguyen Thi Lan"]
          - ["Date of birth *", text, "12/04/1988"]
          - ["Phone number registered at the hospital *", text, "0900 010 001"]
          - ["Verification code *", text, "6 digits (sent via Zalo, or SMS if Zalo is unavailable)"]
      - {t: banner, text: "If the information matches, the code has been sent. Not received after 30 seconds? Click \"Send by SMS\". No match? Go to the reception desk for assistance."}
      - {t: buttons, items: [["Submit request", primary], ["Send by SMS", secondary]]}
  relatives:
    user: "Nguyen Thi Lan"
    nav: ["#Overview", "Home", "#Booking", "Find a doctor", "Book an appointment", "My appointments", "Relatives' records"]
    active: "Relatives' records"
    blocks:
      - {t: h, text: "Relatives' records"}
      - {t: p, text: "You manage 3 records (maximum 10). You can only view and book within the scope you have consented to."}
      - t: table
        cols: ["Full name", "Relationship", "Scope", "Expires", ""]
        widths: [260, 180, 260, 200, 120]
        rows:
          - ["Nguyen Thi Lan", "Self", "All", "-", ""]
          - ["Tran Minh Khoi (8 years old)", "Guardian", "Full", "until the 16th birthday", "#Revoke"]
          - ["Nguyen Van Hau", "Authorized person", "Booking", "31/10/2027", "#Revoke"]
      - {t: buttons, items: [["Add child", primary], ["Add relative", secondary]]}
  chatbot:
    user: "Nguyen Thi Lan"
    nav: ["#Overview", "Home", "#Booking", "Find a doctor", "Book an appointment", "Booking chatbot", "My appointments"]
    active: "Booking chatbot"
    blocks:
      - {t: h, text: "Booking chatbot"}
      - {t: banner, text: "The AI assistant only helps find and suggest appointments. An appointment is booked or cancelled only after you click \"Confirm\"."}
      - t: chat
        msgs:
          - [bot, "Hello, which specialty would you like to book?"]
          - [me, "I would like a cardiology visit on Thursday morning"]
          - [bot, "There are 3 free slots on Thursday morning 05/11 with Dr. Le Minh Quan: 08:00, 08:30, 09:30."]
          - [me, "Book 08:30 for me"]
      - {t: card, title: "Awaiting confirmation (expires in 04:32)", lines: ["Cardiology visit, Dr. Le Minh Quan, 08:30 on 05/11/2026"]}
      - {t: buttons, items: [["Confirm", primary], ["Cancel the suggestion", secondary]]}
      - {t: form, cols: 1, fields: [["Enter a message (at most 500 characters)", text, "Enter your request..."]]}
  my-documents:
    user: "Nguyen Thi Lan"
    nav: ["#Overview", "Home", "#Booking", "Find a doctor", "Book an appointment", "My appointments", "My documents"]
    active: "My documents"
    blocks:
      - {t: h, text: "My documents"}
      - {t: p, text: "Only documents the doctor has released to you are shown. View links are valid for 5 minutes."}
      - t: table
        cols: ["Document type", "Release date", "Issuing doctor", ""]
        widths: [300, 220, 300, 200]
        rows:
          - ["Laboratory results", "29/10/2026", "Dr. Le Minh Quan", "#View"]
          - ["Referral form", "09/10/2026", "Dr. Do Van Hai", "#View"]
          - ["Prescription", "02/09/2026", "Dr. Le Minh Quan", "#View"]
  my-profile:
    user: "Nguyen Thi Lan"
    nav: ["#Account", "Personal information", "Notifications", "Privacy", "Record access history"]
    active: "Personal information"
    blocks:
      - {t: h, text: "Personal information"}
      - {t: banner, text: "Full name, date of birth and gender can only be changed at the reception desk (with document verification)."}
      - t: form
        fields:
          - ["Patient ID", label, "BN-2026-000001"]
          - ["Full name", label, "Nguyen Thi Lan"]
          - ["Date of birth", label, "12/04/1988"]
          - ["Gender", label, "Female"]
          - ["Phone number", text, "0900 010 001"]
          - ["Emergency contact", text, "Nguyen Van An - 0900 010 002"]
          - ["Address", text, "12 Le Loi, Hue"]
          - ["Preferred language", select, "Vietnamese"]
      - {t: buttons, items: [["Save", primary], ["Cancel", secondary]]}
  notification-preferences:
    user: "Nguyen Thi Lan"
    nav: ["#Account", "Personal information", "Notifications", "Privacy", "Record access history"]
    active: "Notifications"
    blocks:
      - {t: h, text: "Notification settings"}
      - {t: p, text: "Choose how to receive appointment reminders. Message content contains only the visit time, doctor and cancellation method, with no health information."}
      - {t: toggle, label: "Push notification", on: true}
      - {t: toggle, label: "Email", on: true}
      - {t: toggle, label: "SMS message", on: false}
      - t: form
        fields:
          - ["Language", select, "Vietnamese"]
          - ["Quiet hours", select, "22:00 - 06:30 (does not apply to the T-2h reminder)"]
      - {t: buttons, items: [["Save", primary]]}
  privacy:
    user: "Nguyen Thi Lan"
    nav: ["#Account", "Personal information", "Notifications", "Privacy", "Record access history"]
    active: "Privacy"
    blocks:
      - {t: h, text: "Privacy"}
      - {t: card, title: "Processing health data with AI", lines: ["Summarizing the record for the doctor, extracting data from documents, predicting the no-show risk.", "Data sent to the external model provider has full names, phone numbers, email addresses and addresses masked.", "You can withdraw consent at any time; it takes effect immediately."]}
      - {t: toggle, label: "Allow processing my data with AI", on: true}
      - {t: h, text: "Consent history"}
      - t: table
        cols: ["Time", "Terms version", "Action"]
        widths: [340, 340, 340]
        rows:
          - ["30/10/2026 09:12", "v1", "Consented to AI processing"]
          - ["30/10/2026 09:12", "v1", "Accepted the terms"]
      - {t: card, title: "Copy of personal data", lines: ["Request a copy of your record. Reauthentication is required. The Data Protection Officer processes it and sends a download link (valid for 24 hours)."]}
      - {t: buttons, items: [["Request a copy of my data", secondary]]}
  my-access-log:
    user: "Nguyen Thi Lan"
    nav: ["#Account", "Personal information", "Notifications", "Privacy", "Record access history"]
    active: "Record access history"
    blocks:
      - {t: h, text: "Who accessed my record"}
      - {t: p, text: "Last 12 months. The content viewed is not shown."}
      - t: table
        cols: ["Time", "Accessor", "Role / department", "Action", "Purpose"]
        widths: [190, 210, 210, 210, 200]
        rows:
          - ["29/10/2026 09:02", "Dr. Le Minh Quan", "Doctor - Cardiology", "View record", "Treatment"]
          - ["29/10/2026 08:41", "Nurse Tran Thu Ha", "Nurse - Reception", "Check-in", "Treatment"]
          - ["11/10/2026 14:20", "Dr. Pham Van Long", "Doctor - Emergency", "View record", "#Emergency access"]
          - ["09/10/2026 10:50", "Dr. Do Van Hai", "Doctor - General internal medicine", "Download document", "Treatment"]
  patient-form:
    user: "Nurse Tran Thu Ha"
    nav: ["#Overview", "Home", "#Reception", "Today's queue", "Patient records", "#Clinic", "Doctor schedules"]
    active: "Patient records"
    blocks:
      - {t: h, text: "Create a patient record"}
      - {t: banner, kind: warn, text: "Possible duplicate: a record already exists with the same phone number and date of birth - Tran V. B., born 1990, phone 0900 ** *** 12. Check the documents before creating a new record or merging."}
      - t: form
        fields:
          - ["Full name *", text, "Tran Van Binh"]
          - ["Date of birth *", text, "05/03/1990"]
          - ["Gender *", select, "Male"]
          - ["Phone number *", text, "0900 010 012"]
          - ["Address", text, "45 Tran Phu, Da Nang"]
          - ["Emergency contact", text, ""]
      - {t: buttons, items: [["Save the record", primary], ["Merge into an existing record", secondary], ["Cancel", secondary]]}
  encounter:
    user: "Dr. Le Minh Quan"
    nav: ["#Overview", "Home", "#Clinic", "Today's queue", "Doctor schedules", "#Clinical", "Patients", "Encounter"]
    active: "Encounter"
    blocks:
      - {t: h, text: "Encounter - Pham Quang Dung (BN-2026-000004)"}
      - {t: tabs, items: ["Vital signs", "History and examination", "Diagnosis", "Addendum"], active: 1}
      - t: form
        fields:
          - ["Blood pressure (mmHg)", text, "135 / 85"]
          - ["Pulse (beats/min)", text, "88"]
          - ["Temperature (C)", text, "36.8"]
          - ["SpO2 (%)", text, "97"]
      - t: form
        cols: 1
        fields:
          - ["Visit reason / history", area, "Palpitations, exertional dyspnea for 2 weeks, worse when climbing stairs..."]
          - ["Primary diagnosis (ICD-10) *", select, "I20.9  Angina pectoris, unspecified"]
      - {t: buttons, items: [["Save", primary], ["Finish the encounter", primary], ["Summarize the record (AI)", secondary]]}
  assistant:
    user: "Dr. Le Minh Quan"
    nav: ["#Overview", "Home", "#Clinical", "Patients", "Encounter", "#AI assistant", "Ask the assistant", "Review extractions"]
    active: "Ask the assistant"
    blocks:
      - {t: h, text: "Ask the medical knowledge assistant"}
      - {t: banner, text: "Answers are based on approved internal protocols, with citations. Do not enter identifying patient information. AI-generated, needs review."}
      - t: chat
        msgs:
          - [me, "What is the management threshold for stage 2 hypertension in adults according to the department protocol?"]
          - [bot, "According to the protocol, stage 2 hypertension is blood pressure >= 160/100 mmHg; combination drug therapy and a follow-up visit after 1 week are required [1][2]."]
      - {t: card, title: "Cited sources", lines: ["[1] Hypertension treatment protocol - section 3.2, page 7", "[2] Chronic disease follow-up procedure - section 2.1"]}
      - {t: buttons, items: [["Helpful", secondary], ["Not helpful", secondary]]}
      - {t: form, cols: 1, fields: [["Question (3-2000 characters)", text, "Enter a question..."]]}
  extraction-review:
    user: "Nurse Tran Thu Ha"
    nav: ["#Clinical", "Patients", "#AI assistant", "Ask the assistant", "Review extractions"]
    active: "Review extractions"
    blocks:
      - {t: h, text: "Review extraction: Blood test results"}
      - {t: banner, kind: warn, text: "Every field defaults to \"not yet confirmed\". Only fields you confirm are written to the record. There is no \"accept all\" button."}
      - t: table
        cols: ["Field", "Extracted value", "Unit", "Confidence", "Decision"]
        widths: [260, 220, 130, 150, 260]
        rows:
          - ["Hemoglobin", "13.2", "g/dL", "0.97", "#Confirm  Edit  Discard"]
          - ["Fasting glucose", "6.9", "mmol/L", "0.91", "#Confirm  Edit  Discard"]
          - ["Creatinine", "1.8", "mg/dL", "0.72 (low)", "Confirm  #Edit  Discard"]
      - {t: buttons, items: [["Save the result", primary], ["Reject all", danger]]}
  kb:
    user: "Pham Quang Huy"
    nav: ["#AI assistant", "Knowledge base", "#Administration", "Users", "Access audit", "Failed notifications"]
    active: "Knowledge base"
    blocks:
      - {t: h, text: "Knowledge base"}
      - {t: buttons, items: [["Add a document", primary]]}
      - t: table
        cols: ["Document", "Version", "Viewing scope", "Status", ""]
        widths: [330, 120, 250, 150, 170]
        rows:
          - ["Hypertension treatment protocol", "v3", "Cardiology department doctors", "#approved", "Replace the version"]
          - ["Chronic disease follow-up procedure", "v2", "Doctors, Nurses", "#approved", "Replace the version"]
          - ["Antibiotic use guidance", "v1", "Doctors", "draft", "Approve"]
      - {t: banner, text: "Knowledge base documents must not contain patient data. The system scans for identifying information patterns on upload."}
  users:
    user: "Pham Quang Huy"
    nav: ["#AI assistant", "Knowledge base", "#Administration", "Users", "Access audit", "Failed notifications"]
    active: "Users"
    blocks:
      - {t: h, text: "Users"}
      - {t: buttons, items: [["Invite staff", primary]]}
      - t: table
        cols: ["Full name", "Role", "Linked doctor", "MFA", "Status", ""]
        widths: [250, 150, 220, 100, 140, 160]
        rows:
          - ["Dr. Le Minh Quan", "Doctor", "Practitioner pr-001", "Enabled", "#Active", "Lock"]
          - ["Nurse Tran Thu Ha", "Nurse", "", "Enabled", "#Active", "Lock"]
          - ["Vu Hai Yen", "DPO", "", "Enabled", "#Active", "Lock"]
          - ["Dr. Pham Van Long", "Doctor", "Practitioner pr-004", "Not registered", "Pending activation", "Resend invitation"]
      - {t: banner, text: "Assigning the Administrator or DPO role requires approval by another administrator. Locking an account takes effect within at most 5 minutes."}
  audit:
    user: "Vu Hai Yen"
    nav: ["#Data protection", "Access audit", "Patient requests"]
    active: "Access audit"
    blocks:
      - {t: h, text: "Access audit"}
      - {t: tabs, items: ["Search", "Needs review (2)", "Patient requests (1)"], active: 1}
      - t: form
        cols: 4
        fields:
          - ["Patient ID", text, ""]
          - ["Accessor", text, ""]
          - ["Purpose", select, "Emergency access"]
          - ["Time range (at most 92 days)", text, "Last 24 hours"]
      - t: table
        cols: ["Time", "Doctor / department", "Patient ID", "Reason", "Flag", ""]
        widths: [170, 200, 150, 280, 110, 110]
        rows:
          - ["29/10 14:20", "Dr. Pham Van Long / Emergency", "BN-2026-000007", "Cardiac arrest, no record yet", "#Abnormal", "Reviewed"]
          - ["29/10 09:45", "Dr. Do Van Hai / Internal medicine", "BN-2026-000012", "Patient transferred from another department during an emergency", "", "Reviewed"]
      - {t: buttons, items: [["Export CSV (enter a purpose)", secondary]]}
  dead-letters:
    user: "Pham Quang Huy"
    nav: ["#Administration", "Users", "Access audit", "Failed notifications"]
    active: "Failed notifications"
    blocks:
      - {t: h, text: "Failed notifications"}
      - {t: p, text: "Only the appointment ID, channel and error are shown; there is no message content, phone number or email."}
      - t: table
        cols: ["Appointment ID", "Reminder type", "Channel", "Error", "Attempts", ""]
        widths: [200, 140, 120, 300, 110, 150]
        rows:
          - ["LH-20261103-0042", "T-24h", "SMS", "Provider rejected: number unavailable", "5", "#Resend"]
          - ["LH-20261103-0057", "T-2h", "Email", "Provider timeout", "5", "#Resend"]
      - {t: banner, text: "Do not resend if the appointment has been cancelled or the visit time has passed."}
