# Chapter 3 - Patient records and clinical examination module (clinical service, FHIR R4 on MongoDB).
modules:
  - key: clinical
    name: Patient records and clinical examination
    intro: >-
      Administrative records, reception, visit recording, lookup and emergency access. This is health data - sensitive personal
      data: every read and write is checked for permissions by role and treatment relationship, and is audited.
    sections:
      - name: Patient portal - Records
        use_cases:
          - key: register
            name: Register a patient account
            actors: [patient]
            trace: [UC-01, AC-01.2, AC-RG.1, AC-RG.2, AC-RG.3, AC-RG.4, "API C1, N8, N9", NFR-SEC1]
            objective: Allow a new user to create an account and their own patient record.
            trigger: The user clicks "Register" on the login page.
            pre: ["The user has created an account on the identity provider's registration page, using a phone number (OTP code verified) or an email (verified), but does not yet have a patient record."]
            post: ["An \"active\" patient record is created and linked to the account; or counter verification is requested if a duplicate is suspected."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Create an account with a phone number or\nemail, verify, log in"}
              - {n: 2, lane: 1, text: "Display the registration form\nand the data processing terms"}
              - {n: 3, lane: 0, text: "Enter information, accept the\nterms, click \"Register\""}
              - {n: 4, lane: 1, kind: decision, text: "Valid?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
              - {n: 5, lane: 1, kind: decision, text: "Duplicate phone number +\ndate of birth?", branches: [{to: 6, label: "No"}, {to: 7, label: "Yes"}]}
              - {n: 6, lane: 1, text: "Create the record, link the\naccount, record consent", end: true}
              - {n: 7, lane: 1, text: "Do not create a record, require\ncounter verification", end: true}
            rules:
              - step: "(1)"
                key: otp-delivery
                title: OTP sending and verification rules
                lines:
                  - "The OTP code has 6 digits, expires after 5 minutes and is single-use. Five wrong attempts lock it for 15 minutes; each phone number receives at most 5 codes per hour and each IP address at most 20 codes per hour ([[MSG:otp-rate]], [[MSG:otp-locked]])."
                  - "Delivery channel: prefer Zalo (verification message) when the phone number uses Zalo; if Zalo delivery fails or is unavailable, automatically switch to SMS with the same code within at most 30 seconds. Patients can also actively click \"Send by SMS\" after 30 seconds."
                  - "Codes sent by email (email accounts) follow the same expiry and attempt limits. OTP codes are not the staff second authentication factor: staff use TOTP or WebAuthn keys (NFR-SEC1)."
              - step: "(2)"
                title: Display rules
                lines:
                  - "Load [[SCR:register]]. The personal data processing terms (purpose, retention period, data subject rights) are displayed in full; the consent checkbox is required and must not be pre-checked."
                  - "Consent to AI data processing is a separate choice, not granted by default ([[UC:manage-consent]])."
              - step: "(4)"
                key: patient-validate
                title: Validation rules
                lines:
                  - "Required: [Full name] (2-100 characters), [Date of birth] (not in the future -> [[MSG:dob-future]]), [Sex], [Phone number] (Vietnamese format -> [[MSG:invalid-phone]])."
                  - "[Phone number] is required (used for reminders and duplicate prevention). Account created with a phone number: taken from the account, not editable. Account created with an email: entered here and must be verified with an OTP code before creating the record (AC-RG.2). [Email] is taken from the account if present, not editable here. Missing required field -> [[MSG:required]]."
                  - "No national ID is collected at registration: the national ID number is added when the patient comes for a visit ([[UC:supplement-national-id]]). No health insurance number is collected at this stage (data minimization)."
              - step: "(5)"
                key: duplicate-check
                title: Duplicate record detection rules
                lines:
                  - "If an \"active\" record already exists with the same [Phone number] (normalized) and the same [Date of birth] -> do not create a record, display [[MSG:duplicate-patient]] (AC-01.2)."
                  - "The message does not reveal information about the existing record (does not show the name or patient ID); it only suggests choosing \"I have visited the hospital before\" ([[UC:claim-record]]) or going to the counter."
              - step: "(6)"
                title: Record creation rules
                lines:
                  - "Create the [Patient] with [Patient ID] = \"BN-\" + year + \"-\" + 6 digits, [Status] = \"active\"; link the account subject to the record; write [[CBR:record-trail]]."
                  - "Store the terms consent record (terms version, timestamp)."
            acceptance:
              - ["AC-01.2", "Given a record with the same phone number + date of birth already exists, When registering, Then no new record is created, verification is requested, and no information about the old record is revealed."]
              - ["AC-RG.1", "Given the terms consent checkbox is not checked, When registering, Then it cannot be submitted."]
              - ["AC-RG.2", "Given the phone number has not been verified with an OTP code, When creating the record, Then it is rejected and no record is created."]
              - ["AC-RG.3", "Given the phone number uses Zalo but Zalo delivery fails, When requesting a code, Then the same code value is sent by SMS within at most 30 seconds."]
              - ["AC-RG.4", "Given the OTP code has been used, has expired after 5 minutes or was entered incorrectly 5 times, When entering the code, Then it is rejected; Given more than 5 codes in one hour for one number, When requesting another, Then it is rejected."]

          - key: claim-record
            name: Claim an existing hospital record
            actors: [patient]
            trace: [UC-01, AC-CL.1, AC-CL.2, AC-CL.3, AC-CL.4, "API C27, C28", NFR-SEC1]
            objective: Allow a person who has visited the hospital before (already has a counter record) to link their new account to that record instead of creating a new one.
            trigger: The patient chooses "I have visited the hospital before" on [[SCR:claim-record]].
            pre: ["The user is logged in and does not yet have a patient record attached to the account."]
            post: ["The account is linked to the existing record (relationship \"self\"); the phone number in the record receives a notification that a new account was linked."]
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Enter full name, date of birth,\nphone number registered\nat the hospital"}
              - {n: 2, lane: 1, text: "Find a matching record; if exactly one\nrecord matches, send an OTP code to the\nnumber in the record"}
              - {n: 3, lane: 0, text: "Enter the received OTP code"}
              - {n: 4, lane: 1, kind: decision, text: "Is the code correct and the record\nnot yet linked?", branches: [{to: 5, label: "Yes"}, {to: 6, label: "No"}]}
              - {n: 5, lane: 1, text: "Link the account, write audit,\nnotify the number in the record", end: true}
              - {n: 6, lane: 1, text: "Reject, direct the user to the\ncounter for verification", end: true}
            rules:
              - step: "(2)"
                key: claim-match
                title: Record search and matching rules
                lines:
                  - "A match occurs when [Full name] (ignoring accents and case), [Date of birth] and [Phone number] (normalized) all match one \"active\" record. Shared phone numbers within a family are still distinguished by full name and date of birth."
                  - "The OTP code is sent only to the phone number stored in the record, not to the newly entered number if different. Delivery channel and code rules follow [[BR:otp-delivery]]."
                  - "The response is always identical whether or not a match exists ([[MSG:claim-sent]]); no record data is displayed before OTP verification succeeds, so it is not possible to probe who is a patient of the hospital."
                  - "No match, more than one candidate, or the record has no phone number -> do not send a code; the patient is directed to the counter so a Nurse can link after document verification ([[UC:link-relative]], counter flow)."
              - step: "(4)"
                key: claim-limits
                title: Limit and abuse prevention rules
                lines:
                  - "At most 5 record claim attempts in 24 hours per account and 3 code sends in 24 hours per phone number in the record; exceeded -> [[MSG:otp-rate]]."
                  - "The record is already linked to another account with relationship \"self\" -> do not link, direct to the counter; this is audited."
                  - "On successful linking, the system sends a notification to the phone number in the record (\"A new account has been linked to your record\") so the record owner can detect impersonation."
            acceptance:
              - ["AC-CL.1", "Given the information matches exactly one record, When the correct OTP code sent to the number in the record is entered, Then the account is linked to that record and no new record is created."]
              - ["AC-CL.2", "Given the information does not match or matches multiple records, When submitting the request, Then the response is identical to the match case, no code is sent and no record data is revealed."]
              - ["AC-CL.3", "Given the OTP code was entered incorrectly 5 times or the record was claimed more than 5 times in 24 hours, When trying again, Then it is temporarily locked and an audit entry is recorded."]
              - ["AC-CL.4", "Given the record is already linked to another account with relationship \"self\", When claiming the record, Then it is not linked and the user is directed to the counter."]

          - key: add-dependent
            name: Create a record for a child under 16
            actors: [patient]
            trace: [UC-01, AC-DP.1, AC-DP.2, AC-DP.3, BR-05, "API C22, C23"]
            objective: Allow a parent or guardian to create and manage a patient record for a person under 16 within their own account.
            trigger: The user clicks "Add child" on [[SCR:relatives]].
            pre: ["The user is logged in and already has their own record."]
            post: ["The record of the person under 16 is created and linked to the account with relationship \"guardian\" (full rights)."]
            lanes: [Guardian, System]
            steps:
              - {n: 1, lane: 0, text: "Enter the child's full name, date of birth,\nsex, check the declaration of\nbeing the guardian"}
              - {n: 2, lane: 1, kind: decision, text: "Under 16 and fewer\nthan 10 records?", branches: [{to: 3, label: "Yes"}, {to: 4, label: "No"}]}
              - {n: 3, lane: 1, text: "Create the record, link \"guardian\",\nwrite audit and the declaration record", end: true}
              - {n: 4, lane: 1, text: "Reject, display the message", end: true}
            rules:
              - step: "(2)"
                key: dependent-rules
                title: Rules for records of persons under 16
                lines:
                  - "Can be created only when [Date of birth] shows under 16 as of <Today>; 16 or older -> [[MSG:age-not-dependent]]. Persons 16 or older register themselves or are authorized ([[UC:link-relative]])."
                  - "Checking \"I am the parent or legal guardian of this person\" is required; store the declaration record (declarant, timestamp)."
                  - "The record does not need its own phone number; appointment reminders go to the guardian's contact. The record still goes through duplicate detection per [[BR:duplicate-check]]."
                  - "Each account manages at most 10 records (including their own); exceeded -> [[MSG:profile-limit]]."
                  - "When the managed person turns 16, the system notifies the guardian and proposes transferring rights: guardianship rights are valid only until the 16th birthday, after which [[UC:link-relative]] must be followed."
            acceptance:
              - ["AC-DP.1", "Given the managed person is 16 or older, When creating a record as for a person under 16, Then it is rejected."]
              - ["AC-DP.2", "Given valid information for a person under 16 and the declaration has been made, When creating, Then the record is created and linked to the guardian."]
              - ["AC-DP.3", "Given the account already manages 10 records, When adding an 11th record, Then it is rejected."]

          - key: link-relative
            name: Link an adult relative's record
            actors: [patient, nurse]
            trace: [UC-01, AC-LK.1, AC-LK.2, AC-LK.3, AC-LK.4, AC-PX.1, BR-05, "API C24, C25, C29"]
            objective: Allow a person to manage appointments, and with consent view results, for an adult relative (for example an elderly parent) with that person's explicit consent.
            trigger: The user clicks "Add relative" on [[SCR:relatives]]; or a Nurse clicks "Record authorization" on the patient record when the relative comes to the counter.
            pre: ["The requester is logged in; the relative already has a record at the hospital with a phone number in the record."]
            post: ["An \"authorized representative\" link takes effect with the selected scope, expires after 12 months; the record owner receives a notification."]
            lanes: [Requester, System]
            steps:
              - {n: 1, lane: 0, text: "Enter the relative's full name, date of\nbirth, phone number, select the scope"}
              - {n: 2, lane: 1, text: "If exactly one record matches, send an OTP\ncode with the authorization content to the relative's number"}
              - {n: 3, lane: 0, text: "The relative reads the code, the requester\nenters the code"}
              - {n: 4, lane: 1, kind: decision, text: "Is the code correct and\nwithin the limits?", branches: [{to: 5, label: "Yes"}, {to: 6, label: "No"}]}
              - {n: 5, lane: 1, text: "Create the link, write audit, notify the\nrecord owner", end: true}
              - {n: 6, lane: 1, text: "Reject", end: true}
            rules:
              - step: "(1)"
                key: proxy-scope
                title: Authorization scope rules
                lines:
                  - "Two scopes: \"Booking\" (view, book, cancel and reschedule the relative's appointments) is the default; \"Booking and viewing results\" (additionally examination results and released documents) is available only when the content sent with the OTP code states this scope so the record owner knows before reading the code (AC-PX.1)."
                  - "An authorized representative can never view unreleased clinical notes, cannot edit the relative's full name, date of birth or sex, and cannot enable AI data processing on their behalf."
              - step: "(2)"
                title: Verification rules
                lines:
                  - "The OTP code is sent to the phone number in the relative's record, per [[BR:otp-delivery]]; the response to the requester is always identical whether or not a match exists ([[MSG:claim-sent]])."
                  - "At most 5 link requests in 24 hours per account; each account manages at most 10 records ([[MSG:profile-limit]])."
              - step: "(5)"
                key: proxy-lifecycle
                title: Validity and notification rules
                lines:
                  - "The link expires after 12 months; 30 days before expiry the system reminds the requester to renew with a new OTP code. The record owner can revoke at any time ([[UC:revoke-link]])."
                  - "Every access through the authorization is audited with the acting account and the record accessed (onBehalfOf)."
                  - "At the counter: the relative (especially older adults who do not use smartphones) presents original documents; the Nurse verifies them, enters the authorized representative's account (phone number or email), selects the scope and checks \"The record owner has consented to authorization\"; the link takes effect immediately and is audited."
            acceptance:
              - ["AC-LK.1", "Given the information matches one adult record, When the requester enters the correct OTP code sent to the relative's number, Then the link takes effect with the selected scope."]
              - ["AC-LK.2", "Given a \"Booking\" scope link, When the authorized representative books, cancels, reschedules or views the relative's appointments, Then it succeeds and the audit records the acting account and the record accessed."]
              - ["AC-LK.3", "Given the relative comes to the counter and a Nurse records the authorization after document verification, When saving, Then the link takes effect and an audit entry is recorded."]
              - ["AC-LK.4", "Given the link is more than 12 months old, When the authorized representative accesses, Then it is rejected until renewed."]
              - ["AC-PX.1", "Given a \"Booking\" scope link, When the authorized representative views the relative's examination results or documents, Then it is rejected and a \"deny\" audit entry is recorded."]

          - key: revoke-link
            name: Revoke a relative's record link
            actors: [patient, nurse]
            trace: [UC-01, AC-RV.1, AC-RV.2, BR-05, "API C26"]
            objective: Allow the manager or record owner to end the link; a Nurse can end it on behalf of the record owner at the counter.
            trigger: The user clicks "Revoke" on [[SCR:relatives]], or the record owner with their own account clicks "Stop sharing".
            pre: ["The link is active."]
            post: ["The link is \"revoked\"; the former authorized representative can no longer access; the other party receives a notification."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Select the link, click Revoke,\nconfirm"}
              - {n: 2, lane: 1, text: "Mark as revoked, terminate open\nsessions, write audit", end: false}
              - {n: 3, lane: 1, text: "Send a notification to the other party", end: true}
            rules:
              - step: "(2)"
                title: Revocation rules
                lines:
                  - "The record owner (with their own account), the manager, or a Nurse at the counter can revoke. A guardian of a person under 16 can only transfer rights, not delete the record."
                  - "Takes effect within at most 60 seconds (same permission cache deadline, see [[UC:lock-account]]); appointments already booked are kept."
            acceptance:
              - ["AC-RV.1", "Given the link is active, When the record owner or manager revokes it, Then the authorized representative can no longer access after at most 60 seconds and an audit entry is recorded."]
              - ["AC-RV.2", "Given the record has its own account, When a new link is created or revoked, Then the record owner receives a notification."]

          - key: update-profile
            name: Update administrative information
            actors: [patient]
            trace: [UC-01, AC-01.1, AC-01.3, BR-05, "API C5"]
            objective: Allow a patient to view and edit their own administrative information.
            trigger: The patient clicks "Edit" on [[SCR:my-profile]].
            pre: ["The patient is logged in and has an \"active\" record."]
            post: ["The record is updated to a new version; the old version is retained."]
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Edit\""}
              - {n: 2, lane: 1, text: "Display the form in edit mode"}
              - {n: 3, lane: 0, text: "Edit information, click \"Save\""}
              - {n: 4, lane: 1, kind: decision, text: "Valid and not modified\nby someone else?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
              - {n: 5, lane: 1, text: "Save a new version", end: true}
            rules:
              - step: "(2)"
                title: Editable field rules
                lines:
                  - "A patient can edit only: phone number, address, emergency contact, preferred language. Full name, date of birth and sex can be edited only by a Nurse at the counter (with document verification)."
              - step: "(4)"
                title: Validation and conflict rules
                lines:
                  - "Apply [[BR:patient-validate]] to the edited fields."
                  - "The version being edited must be the latest version; if someone else has already edited it -> [[MSG:version-conflict]]."
              - step: "(5)"
                title: Save rules
                lines: ["Save a new version and keep the old versions (AC-01.3); write [[CBR:record-trail]]; display [[MSG:saved]]."]
            acceptance:
              - ["AC-01.1", "Given a patient is logged in, When viewing records, Then they see only their own record."]
              - ["AC-01.3", "Given the record is edited twice, Then 3 versions can be viewed."]
              - ["AC-UP.1", "Given a patient submits a request to edit the date of birth, Then it is rejected and the data does not change."]

      - name: Internal portal - Reception
        use_cases:
          - key: create-patient
            name: Create and edit patient records at the counter
            actors: [nurse]
            trace: [UC-01, AC-01.2, "API C3, C5"]
            objective: Allow a nurse to create a record for a patient without an account or edit information after document verification.
            trigger: The nurse clicks "Create record" or "Edit" on [[SCR:patient-form]].
            pre: ["The nurse is logged in (MFA)."]
            post: ["The record is created or updated to a new version."]
            lanes: [Nurse, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Create record\""}
              - {n: 2, lane: 1, text: "Display the record form"}
              - {n: 3, lane: 0, text: "Enter information, verify\ndocuments, click \"Save\""}
              - {n: 4, lane: 1, kind: decision, text: "Valid?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
              - {n: 5, lane: 1, kind: decision, text: "Duplicate suspected?", branches: [{to: 6, label: "No"}, {to: 7, label: "Yes"}]}
              - {n: 6, lane: 1, text: "Save the record", end: true}
              - {n: 7, lane: 1, text: "Display the suspected duplicate record,\npropose merging", end: true}
            rules:
              - step: "(4)"
                title: Validation rules
                lines: ["Apply [[BR:patient-validate]]; a Nurse can edit every administrative field."]
              - step: "(5)"
                title: Duplicate record rules
                lines:
                  - "Apply the duplicate criteria of [[BR:duplicate-check]]; unlike patient self-registration, a Nurse can view a summary of the suspected duplicate record (name, year of birth, phone number with the middle 4 digits masked) to decide on merging ([[UC:merge-patient]])."
            acceptance:
              - ["AC-CP.1", "Given a suspected duplicate record, When the nurse saves, Then the system displays the duplicate record instead of creating a new one."]

          - key: merge-patient
            name: Merge duplicate records
            actors: [nurse]
            trace: [UC-01, "API C8", "Event E7"]
            objective: Merge duplicate records of the same person into a single record.
            trigger: The nurse clicks "Merge records" after detecting a duplicate.
            pre: ["The nurse has verified the patient's documents; both records are \"active\"."]
            post: ["The source record is \"merged\" and points to the target record; every service updates its data to the target record."]
            lanes: [Nurse, System]
            steps:
              - {n: 1, lane: 0, text: "Select the source and target records,\nclick \"Merge\""}
              - {n: 2, lane: 1, text: "Display a comparison of the two records\nand a confirmation dialog"}
              - {n: 3, lane: 0, text: "Confirm the merge"}
              - {n: 4, lane: 1, text: "Mark the source as \"merged\",\nemit the \"merged\" event", end: true}
            rules:
              - step: "(2)"
                title: Confirmation rules
                lines: ["Display [[MSG:confirm-merge]]; state clearly on the interface that the operation cannot be undone."]
              - step: "(4)"
                title: Merge rules
                lines:
                  - "Source record: [Status] = \"merged\", linked to the target record; the login account (if any) moves to the target record."
                  - "Emit \"shp.clinical.patient-merged.v1\"; scheduling, notification, ml and document replace the patient ID with a background job that can be safely re-run."
                  - "Audit both records with the action \"merge\"."
            acceptance:
              - ["AC-MG.1", "Given A is merged into B, Then A's appointments and documents appear under B, and opening record A redirects to B."]

          - key: check-in
            name: Patient check-in
            actors: [nurse]
            trace: [UC-04, "API S16", "Event E4"]
            objective: Record that the patient has arrived and create the encounter.
            trigger: The nurse clicks "Check-in" on [[SCR:queue]].
            pre: ["A \"booked\" appointment for today."]
            post: ["The appointment is \"arrived\"; the encounter is created in status \"arrived\"."]
            lanes: [Nurse, System]
            steps:
              - {n: 1, lane: 0, text: "Verify identity,\nclick \"Check-in\""}
              - {n: 2, lane: 1, kind: decision, text: "Appointment today\nand \"booked\"?", branches: [{to: 3, label: "Yes"}, {to: 4, label: "No"}]}
              - {n: 3, lane: 1, text: "Appointment \"arrived\",\ncreate the encounter", end: true}
              - {n: 4, lane: 1, text: "Report a state error", end: true}
            rules:
              - step: "(2)"
                title: Check-in rules
                lines:
                  - "Only a \"booked\" appointment with a visit date = <Today> can be checked in; up to 60 minutes earlier than the visit time is still allowed. Otherwise -> [[MSG:invalid-state]]."
                  - "Emit \"shp.scheduling.appointment-checked-in.v1\"; clinical creates an \"arrived\" encounter linked to the appointment and doctor; display [[MSG:checked-in]]."
                  - "If the record has no national ID number, the interface prompts the nurse to add it ([[UC:supplement-national-id]]); it is optional, can be skipped and check-in still proceeds."
            acceptance:
              - ["AC-CI.1", "Given an appointment tomorrow, When checking in today, Then it is rejected."]

          - key: supplement-national-id
            name: Add the national ID number at visit time
            actors: [nurse]
            trace: [UC-01, "API C5", NFR-SEC10]
            objective: Record the patient's national ID number in the record when the patient comes for a visit, after verifying the original document. It is not required in order to be examined.
            trigger: The nurse clicks "Add national ID" on [[SCR:queue]] or during check-in ([[UC:check-in]]).
            pre: ["The patient is present and presents the original document; the \"active\" record has no national ID number."]
            post: ["The national ID number is stored encrypted in the record; there is a consent record and an audit entry."]
            lanes: [Nurse, System]
            steps:
              - {n: 1, lane: 0, text: "Verify the original document, enter the\nnational ID number, check patient consent"}
              - {n: 2, lane: 1, kind: decision, text: "Correct format\nand consent given?", branches: [{to: 3, label: "Yes"}, {to: 1, label: "No"}]}
              - {n: 3, lane: 1, kind: decision, text: "Already belongs to\nanother record?", branches: [{to: 4, label: "No"}, {to: 5, label: "Yes"}]}
              - {n: 4, lane: 1, text: "Store encrypted, record consent\nand audit", end: true}
              - {n: 5, lane: 1, text: "Do not store, report suspected duplicate,\nsuggest merging records", end: true}
            rules:
              - step: "(2)"
                key: national-id-validate
                title: National ID validation rules
                lines:
                  - "[National ID number] consists of exactly 12 digits. The old 9-digit ID numbers are not accepted at this stage. Wrong format -> [[MSG:invalid-national-id]]."
                  - "Under the national ID number structure, the 4th digit indicates sex and birth century, and the 5th and 6th digits are the last two digits of the birth year. If it does not match the record's [Sex] or [Date of birth], the system warns and allows saving only when the nurse records a reason."
                  - "Checking \"The patient consents to providing the national ID number for identity verification\" is required. Store the consent record (purpose, timestamp, recorder)."
              - step: "(3)"
                key: national-id-duplicate
                title: National ID duplicate detection rules
                lines:
                  - "If the national ID number is already attached to another \"active\" record -> do not store, display [[MSG:national-id-duplicate]] and suggest merging records ([[UC:merge-patient]]). Matching uses a hash value, not a clear-text comparison."
              - step: "(4)"
                key: national-id-storage
                title: National ID storage and display rules
                lines:
                  - "Store encrypted (AES-256-GCM, key in Key Vault) together with a keyed HMAC-SHA-256 hash for duplicate checking without storing the clear-text number."
                  - "Displayed masked by default, showing only the last 4 digits. Only after a Nurse clicks \"Show number\" is the full number visible, and every such action is audited; patients can view their own number; doctors, DPOs and administrators see only the masked version."
                  - "The national ID number does not appear in logs, events, search results, notification messages or text sent to AI."
            acceptance:
              - ["AC-ID.1", "Given a valid national ID number and consent checked, When saving, Then the number is stored encrypted and displayed masked, showing only the last 4 digits."]
              - ["AC-ID.2", "Given the national ID number already belongs to another \"active\" record, When saving, Then it is not stored, a suspected duplicate is reported, and no information about the other record is revealed to unauthorized people."]
              - ["AC-ID.3", "Given a wrong format or consent not checked, When saving, Then it is rejected."]
              - ["AC-ID.4", "Given the national ID number is stored, When searching, emitting events or writing logs, Then the number does not appear in those places."]

      - name: Internal portal - Clinical examination
        use_cases:
          - key: record-vitals
            name: Record vital signs
            actors: [nurse, doctor]
            trace: [UC-04, "API C16", NFR-SEC2]
            objective: Record blood pressure, pulse, temperature, SpO2, weight and height for the encounter.
            trigger: The user clicks "Record vital signs" on [[SCR:encounter]].
            pre: ["The encounter is \"arrived\" or \"in-progress\"; doctors must have a treatment relationship."]
            post: ["Vital sign Observations are saved, linked to the encounter."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Enter the measurements, click \"Save\""}
              - {n: 2, lane: 1, kind: decision, text: "Within the plausible\nrange?", branches: [{to: 3, label: "Yes"}, {to: 4, label: "No"}]}
              - {n: 3, lane: 1, text: "Save the vital signs, write audit", end: true}
              - {n: 4, lane: 1, text: "Report a field error", next: 1}
            rules:
              - step: "(2)"
                key: vital-ranges
                title: Value range rules
                lines:
                  - "Systolic blood pressure 50-260, diastolic 30-160 mmHg; pulse 20-250 beats/minute; temperature 30-43 C; SpO2 50-100 %; weight 0.5-300 kg; height 30-250 cm. Outside the range -> [[MSG:vital-range]]."
                  - "Values within range but abnormal (for example SpO2 < 92 %) are saved and flagged \"abnormal\" to be highlighted on the timeline."
            acceptance:
              - ["AC-VT.1", "Given SpO2 = 120, When saving, Then a field error is reported and nothing is saved."]
              - ["AC-VT.2", "Given a doctor without a treatment relationship, When recording vital signs, Then it is rejected and a \"deny\" audit is written."]

          - key: start-encounter
            name: Open the encounter
            actors: [doctor]
            trace: [UC-04, AC-04.1, "API C11"]
            objective: The doctor starts the examination; the encounter changes to \"in-progress\".
            trigger: The doctor clicks "Start examination" on today's examination list.
            pre: ["The patient's \"arrived\" encounter has an appointment with this doctor."]
            post: ["The encounter is \"in-progress\", recording the examiner and the time."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Start examination\""}
              - {n: 2, lane: 1, kind: decision, text: "Treatment relationship\nexists?", branches: [{to: 3, label: "Yes"}, {to: 4, label: "No"}]}
              - {n: 3, lane: 1, text: "Encounter \"in-progress\",\nopen the encounter screen", end: true}
              - {n: 4, lane: 1, text: "Reject, write \"deny\" audit", end: true}
            rules:
              - step: "(2)"
                key: care-relationship
                title: Treatment relationship rules
                lines:
                  - "A doctor has a treatment relationship with a patient when: there is an appointment or encounter with the patient within the last 12 months, or there is a future appointment (BR-06)."
                  - "No treatment relationship -> [[MSG:no-care]]; the interface offers [[UC:break-glass]] if it is an emergency."
            acceptance:
              - ["AC-04.1", "Given a doctor without a treatment relationship, When recording a diagnosis, Then it is rejected."]

          - key: record-diagnosis
            name: Record history and diagnosis
            actors: [doctor]
            trace: [UC-04, AC-04.1, "API C13, C17, C18"]
            objective: Record the reason for visit, history, clinical examination, ICD-10 diagnosis, comorbidities and allergies.
            trigger: The doctor enters information on [[SCR:encounter]] and clicks "Save".
            pre: ["The encounter is \"in-progress\"; the doctor has a treatment relationship."]
            post: ["The history and Condition are saved; allergies are updated."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Enter the history, select ICD-10\ncodes, click \"Save\""}
              - {n: 2, lane: 1, kind: decision, text: "Valid?", branches: [{to: 3, label: "Yes"}, {to: 4, label: "No"}]}
              - {n: 3, lane: 1, text: "Save, write audit", end: true}
              - {n: 4, lane: 1, text: "Report a field error", next: 1}
            rules:
              - step: "(2)"
                title: Validation rules
                lines:
                  - "The diagnosis code must exist in the system's ICD-10 catalog -> otherwise [[MSG:icd-invalid]]; at least one primary diagnosis is required before finishing the encounter."
                  - "The encounter is already \"finished\" -> [[MSG:invalid-state]] ([[UC:addendum]] must be used)."
                  - "History is at most 10,000 characters; the content must not be written to logs or events."
            acceptance:
              - ["AC-DX.1", "Given the code \"X99.99\" is not in the catalog, When saving, Then a field error is reported."]

          - key: finish-encounter
            name: Finish the encounter
            actors: [doctor]
            trace: [UC-04, AC-04.2, "API C14", "Event E6"]
            objective: Close the encounter; after that it cannot be edited.
            trigger: The doctor clicks "Finish examination" on [[SCR:encounter]].
            pre: ["The encounter is \"in-progress\" and has at least one primary diagnosis."]
            post: ["The encounter is \"finished\"; the appointment is \"fulfilled\"."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Finish examination\""}
              - {n: 2, lane: 1, text: "Display the confirmation\ndialog"}
              - {n: 3, lane: 0, text: "Confirm"}
              - {n: 4, lane: 1, text: "Encounter \"finished\",\nemit event, appointment \"fulfilled\"", end: true}
            rules:
              - step: "(2)"
                title: Confirmation rules
                lines: ["Missing primary diagnosis -> [[MSG:required]] in the diagnosis area; otherwise display [[MSG:confirm-finish]]."]
              - step: "(4)"
                title: Finishing rules
                lines:
                  - "[Status] = \"finished\", [Finished at] = <Now>; from then on every edit request is rejected (AC-04.2)."
                  - "Emit \"shp.clinical.encounter-finished.v1\"; scheduling moves the appointment to \"fulfilled\"."
            acceptance:
              - ["AC-04.2", "Given the encounter is \"finished\", When editing the history, Then it is rejected and the old data is unchanged."]

          - key: addendum
            name: Amend a finished encounter
            actors: [doctor]
            trace: [UC-04, AC-04.2, "API C15"]
            objective: Add an addendum to a finished encounter without modifying the original.
            trigger: The doctor clicks "Add addendum" on a finished encounter.
            pre: ["The encounter is \"finished\"; the doctor has a treatment relationship."]
            post: ["The addendum record is saved with the author, timestamp and reason; the original is unchanged."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Enter the addendum content and\nreason, click \"Save\""}
              - {n: 2, lane: 1, text: "Save the addendum,\nwrite audit", end: true}
            rules:
              - step: "(2)"
                title: Addendum rules
                lines:
                  - "[Content] and [Reason] are required. The addendum appears directly below the encounter, clearly marked \"Addendum\"; there is no edit/delete operation for the addendum."
            acceptance:
              - ["AC-AD.1", "Given the encounter is \"finished\", When adding an addendum, Then the original is unchanged and the addendum is displayed with the author and timestamp."]

      - name: Internal portal - Record lookup
        use_cases:
          - key: search-patient
            name: Search patients
            type: Basic
            actors: [doctor, nurse]
            trace: [UC-06, AC-06.1, AC-06.2, "API C6"]
            objective: Search for a patient by name (without accents), phone number, patient ID or date of birth.
            trigger: The user enters criteria on [[SCR:patient-search]] and clicks "Search".
            pre: ["The user is a Doctor or Nurse (MFA)."]
            post: ["The list of patients matching the criteria is displayed with minimal information."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Enter criteria, click \"Search\""}
              - {n: 2, lane: 1, kind: decision, text: "Minimum criteria\nmet?", branches: [{to: 3, label: "Yes"}, {to: 1, label: "No"}]}
              - {n: 3, lane: 1, text: "Return at most 50 rows,\nwrite query audit", end: true}
            rules:
              - step: "(2)"
                title: Search criteria rules
                lines:
                  - "At least 3 characters of a name, or a full phone number, or a patient ID, or name + year of birth is required; listing all patients is not allowed."
                  - "Name search ignores accents and case (\"nguyen van\" matches \"Nguyen Van\") (AC-06.1)."
              - step: "(3)"
                key: search-minimise
                title: Result minimization rules
                lines:
                  - "Results contain only: full name, year of birth, sex, patient ID, phone number with the middle 4 digits masked. No diagnoses or addresses."
                  - "Doctors can see search results but can open the timeline only of patients with a treatment relationship (AC-06.2)."
                  - "Every search query is audited (searcher, masked criteria, result count)."
            acceptance:
              - ["AC-06.1", "Given the patient \"Nguyen Van An\", When searching \"nguyen van\", Then they appear in the results."]
              - ["AC-SP.1", "Given the criteria \"ng\" (2 characters), When searching, Then it is rejected and no list is returned."]

          - key: view-timeline
            name: View a patient record and timeline
            type: Basic
            actors: [doctor, nurse, patient]
            trace: [UC-06, AC-06.2, BR-05, BR-06, "API C4, C12, C19"]
            objective: View the chronological history of visits, diagnoses, vital signs, allergies and documents.
            trigger: The user selects a patient on [[SCR:patient-search]] (staff) or opens their own record (patient).
            pre: ["The user has permission according to the access control matrix."]
            post: ["The timeline is displayed within the permission scope; the access is audited."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Select a patient"}
              - {n: 2, lane: 1, kind: decision, text: "Access allowed?", branches: [{to: 3, label: "Yes"}, {to: 4, label: "No"}]}
              - {n: 3, lane: 1, text: "Display the timeline,\nwrite \"read\" audit", end: true}
              - {n: 4, lane: 1, text: "Reject, write \"deny\" audit,\noffer emergency access (doctor)", end: true}
            rules:
              - step: "(2)"
                key: timeline-authz
                title: Viewing scope rules
                lines:
                  - "Doctor: only patients with a treatment relationship ([[BR:care-relationship]]) or an active emergency access grant; otherwise -> [[MSG:no-care]] (AC-06.2)."
                  - "Nurse: can view every patient; the default access purpose is \"treatment\"."
                  - "Patient: only their own record, only \"finished\" encounters and released documents (BR-05)."
                  - "Administrators and Data Protection Officers: cannot view the timeline."
              - step: "(3)"
                title: Display rules
                lines:
                  - "Default to the last 12 months, most recent first; filter by data type and time range; abnormal vital signs are highlighted."
                  - "The screen displays the banner \"Emergency access until <Expiry time>\" while emergency access is in use."
                  - "Bulk download or printing the entire record from the interface is not allowed (reduces leakage risk)."
            acceptance:
              - ["AC-06.2", "Given a doctor without a treatment relationship, When opening the timeline, Then it is rejected (except break-glass) and a \"deny\" audit is recorded."]
              - ["AC-TL.1", "Given the patient has an \"in-progress\" encounter, When the patient views the timeline, Then that encounter is not visible."]
              - ["AC-TL.2", "Given an administrator, When calling the timeline API, Then it is rejected."]

          - key: break-glass
            name: Emergency access (break-glass)
            actors: [doctor]
            trace: [UC-10, AC-10.1, BR-06, BR-07, "API C20"]
            objective: Allow a doctor to open the record of a patient without a treatment relationship in an emergency, under controls.
            trigger: The doctor clicks "Emergency access" after being denied in [[UC:view-timeline]].
            pre: ["The user is a Doctor, logged in with MFA within the last 15 minutes."]
            post: ["Permission to view that exact patient's record for 60 minutes; the DPO is alerted."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Emergency access\""}
              - {n: 2, lane: 1, text: "Display the warning,\nrequire a reason"}
              - {n: 3, lane: 0, text: "Enter a reason, confirm"}
              - {n: 4, lane: 1, kind: decision, text: "Reason valid and\nwithin limits?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
              - {n: 5, lane: 1, text: "Grant access for 60 minutes, write audit,\nemit a DPO alert", end: true}
            rules:
              - step: "(2)"
                title: Warning rules
                lines: ["Display [[MSG:confirm-break-glass]]; [Reason] is required."]
              - step: "(4)"
                key: break-glass-limit
                title: Reason and limit rules
                lines:
                  - "[Reason] at least 10 characters -> otherwise [[MSG:reason-min]]."
                  - "No hard limit on the number of uses: in an emergency, denying access could harm the patient (patient safety takes priority). Instead, the DPO is notified immediately every time; from the 3rd use by the same doctor within 24 hours or the 10th within 30 days, the system flags it \"abnormal\", also notifies the head of department, and the DPO must review within 24 hours instead of 72 hours."
                  - "MFA older than 15 minutes -> require reauthentication before granting access."
              - step: "(5)"
                title: Grant rules
                lines:
                  - "The permission applies to exactly one patient, read-only (recording a diagnosis still requires a treatment relationship), expires after 60 minutes and is not automatically renewed."
                  - "Every access during this period is audited with [Purpose] = \"break-glass\" and the [Reason]."
                  - "Trigger [[UC:break-glass-alert]]."
            acceptance:
              - ["AC-10.1", "Given a doctor uses emergency access, Then the DPO receives an alert within <= 5 minutes."]
              - ["AC-BG.1", "Given 60 minutes have passed, When reopening the timeline, Then it is rejected."]
              - ["AC-BG.2", "Given a reason of 5 characters, When confirming, Then an error is reported and access is not granted."]
              - ["AC-BG.3", "Given a doctor has used emergency access 2 times in 24 hours, When using it a 3rd time with a valid reason, Then access is still granted, and that use is flagged \"abnormal\", the head of department is also notified, and the DPO must review within 24 hours."]
