# Appendix A - Threshold rationale and legal basis. Consulted on 31/10/2026.
rationale:
  intro: >-
    This appendix presents the values of the key thresholds in the SRS, why each value was chosen, the sources consulted and the
    confidence level. Principle: where there is clear scientific or legal evidence, the item is marked "Supported"; where there is
    only vendor practice guidance or the team's own reasoning, it is marked "Design decision" or "Needs verification". All thresholds
    are configurable and are reviewed once operational data is available.
  confidence_legend:
    - "Supported: there is a legal text or a study that was directly checked."
    - "Partially supported: there is a reference source but the original was not checked, or the source is secondary."
    - "Design decision: the team set it based on risk; there is no single industry standard."
    - "Needs verification: depends on an official text or on real data before real data is used."
  thresholds:
    - ["Data breach notification", "No later than 72 hours after discovery", "Article 23(1) of the Personal Data Protection Law 91/2025/QH15 (official text): breaches that may harm security, public order, life, health, honor or property must be reported to the competent authority within 72 hours.", "Supported"]
    - ["Data processing impact assessment", "Submitted within 60 days of the first processing; updated every 6 months or immediately when there is a change", "Articles 21 and 22 of Law 91/2025/QH15.", "Supported"]
    - ["Cross-border data transfer", "A transfer impact assessment is required before real data is used", "Article 20(2) of Law 91/2025/QH15: covers storing data on servers outside Vietnam and using foreign platforms to process data collected in Vietnam. Applies to the Azure Southeast Asia region and foreign LLM providers.", "Supported"]
    - ["Consent to health data processing", "Consent is mandatory; withdrawal takes effect immediately", "Articles 9, 10 and 26 of Law 91/2025/QH15 (health information), Article 30 (AI, cloud computing).", "Supported"]
    - ["Medical record retention period", "Never deleted automatically; default minimum of 10 years; some record types 15-20 years; configurable per type", "Article 69 of the Law on Medical Examination and Treatment 2023 (checked): paper and electronic records have equal value and are retained under archival law. The 10/15/20-year figures by record type come from legal summaries, and those summaries disagree on which record types get 20 years.", "Needs verification"]
    - ["Audit retention period", "90 days of fast search + immutable archive matching the medical record retention period", "Design decision: audit proves who accessed a record, so it should not be shorter-lived than that record. Version v0.9 set 2 years; raised for consistency.", "Design decision"]
    - ["Sessions, staff", "15 minutes of inactivity; login again after 12 hours", "NIST SP 800-63B-4 (checked): AAL2 requires reauthentication at most every 24 hours and inactivity of at most 1 hour. The team chose stricter values because of shared machines at the clinic. The 12-hour limit and 15-minute inactivity period of AAL3 appear only in secondary sources.", "Supported (maximum values); the stricter values are a design decision"]
    - ["Sessions, patients", "30 minutes of inactivity; at most 24 hours", "Within the NIST AAL2 limits; balances safety against convenience for individual users.", "Design decision"]
    - ["Emergency access (break-glass) validity", "60 minutes, one patient, read-only, no automatic renewal", "Practice guidance (not research): emergency rights are measured in minutes, not days, expire automatically, and renewal requires re-confirmation. No industry standard was found for a specific number.", "Partially supported"]
    - ["Emergency access review", "The DPO reviews within 72 hours; within 24 hours if flagged as abnormal", "Healthcare practice guidance: review each event within 24-72 hours to confirm clinical necessity and the minimum-necessary principle.", "Partially supported"]
    - ["Emergency access count limits", "No hard block. From the 3rd use within 24 hours, or the 10th use within 30 days by one doctor: flag as abnormal, notify the department head, review within 24 hours", "Design decision. Guidance recommends monitoring frequency as an abnormality signal and alerting when one user repeats it; there is no standard threshold. Version v0.9 hard-blocked after 3 uses per day: removed because denying access during an emergency could harm the patient. The numbers 3 and 10 are only starting points and need tuning with real data.", "Design decision"]
    - ["Reminder time points", "T-24h and T-2h for every appointment", "A 2012 meta-analysis of randomized trials of text-message reminders: no significant difference between reminders 24, 48 or 72 hours before. A 2016 overview (21 trials): text-message reminders reduced no-shows by 25% (relative risk 0.75; 15% versus 21%). Therefore the exact time point matters less than having a reminder; T-2h is kept so patients still have time to cancel within the 2-hour deadline.", "Supported (effectiveness of reminding); the specific time points are a design decision"]
    - ["Reminder message content", "Short, stating the time, doctor and how to cancel clearly; multiple wordings will be tested", "A large A/B experiment showed that wording reduced the no-show rate from 21.1% to 14.2%, more than changing the sending time.", "Partially supported"]
    - ["No-show risk threshold for adding the T-6h reminder", "0.30 (configurable; calibrated after 4 weeks of real data)", "Studies use different thresholds depending on intervention cost: a randomized trial of phone calls used >15%; a study in a community health system used 15% with sensitivity 0.76, specificity 0.55 and positive predictive value 0.30; another trial protocol used 0.50. The intervention here is only one extra message, which is very cheap and harmless, so a low threshold is acceptable. The team chose 0.30 to add the reminder to about a quarter of appointments (assuming an 18% no-show rate). This threshold is not used for overbooking because the cost of an error is higher.", "Design decision"]
    - ["No-show model quality", "AUC >= 0.75 and above the baseline", "The requirement already exists in NFR-AI6; no single industry standard was found. A calibration report is mandatory so that the 0.30 threshold has a probabilistic meaning.", "Design decision"]
    - ["Temporary lock on failed logins", "5 failures, 15-minute lock", "Common practice, implemented at the identity provider; no specific source was checked.", "Design decision"]
    - ["Document download link / upload link", "5 minutes / 10 minutes", "Project BR-08 (an approved business rule); a measure to reduce the window of link exposure.", "Design decision"]
  legal:
    - ["Personal Data Protection Law No. 91/2025/QH15", "Effective from 01/01/2026. Regulates consent, withdrawal of consent, health information, cross-border data transfer, impact assessments, breach notification, AI and cloud computing.", "Articles 9, 10, 20, 21, 22, 23, 26, 30, 39"]
    - ["Decree 356/2025/ND-CP", "Guidance for implementing Law 91/2025/QH15 (issued 31/12/2025).", "Full text not yet read; must be read to determine the list of sensitive data categories and the impact assessment template"]
    - ["Decree 13/2023/ND-CP", "The previous personal data protection decree. Article 39 of Law 91/2025/QH15 allows processing that already had consent under this decree to continue without re-consent. It has not been verified whether this decree is still in force or has been replaced.", "Needs verification"]
    - ["Law on Medical Examination and Treatment 2023", "Article 69: paper and electronic medical records have equal value; retained under archival law. It does not specify a retention period in years.", "Article 69"]
    - ["Law on Archives No. 33/2024/QH15 and Ministry of Health circulars", "The source of the specific retention periods. A draft Ministry of Health circular on retention periods for health-sector records cites this law.", "Official text must be read"]
    - ["Circular 32/2023/TT-BYT", "Guidance on medical record templates.", "Template must be checked"]
  open_items:
    - "Verify the medical record retention period by record type (10, 15 or 20 years) against official Ministry of Health texts and the Law on Archives before configuring the retention policy."
    - "Verify the force status of Decree 13/2023/ND-CP after Law 91/2025/QH15 took effect, and read Decree 356/2025/ND-CP."
    - "Calibrate the no-show risk threshold of 0.30 and the two emergency access thresholds (3 uses/24 hours, 10 uses/30 days) after 4 weeks of operational data."
    - "Consult the Data Protection Officer / legal team on using a foreign LLM provider and an Azure region outside Vietnam for real data."
    - "Check the original studies on appointment reminders and no-show thresholds cited from search results before using the figures in a scientific report."
  sources:
    - ["Personal Data Protection Law 91/2025/QH15 (full text)", "https://hethongphapluat.com/luat-bao-ve-du-lieu-ca-nhan-2025"]
    - ["Law on Medical Examination and Treatment 2023, Article 69", "https://hethongphapluat.com/luat-kham-benh-chua-benh-2023/dieu-69"]
    - ["NIST SP 800-63B-4, authenticator assurance levels", "https://pages.nist.gov/800-63-4/sp800-63b/aal"]
    - ["Overview and meta-analysis: appointment reminders via digital notifications (BMJ Open 2016)", "https://pubmed.ncbi.nlm.nih.gov/27798006/"]
    - ["2012 meta-analysis: timing of text-message reminders", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3419880/"]
    - ["A/B experiment on reminder wording", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7310733"]
    - ["Randomized trial of calling patients by no-show risk (J Gen Intern Med 2016)", "https://link.springer.com/content/pdf/10.1007/s11606-016-3813-0.pdf"]
    - ["Trial protocol using a risk threshold of 0.50 (ISRCTN)", "https://www.isrctn.com/pdf/28960722"]
    - ["Practice guidance on emergency access (not research)", "https://nhimg.org/faq/what-should-teams-get-right-about-break-glass-access-for-patient-data/"]
    - ["Legal summary on medical record retention (secondary source)", "https://thuvienphapluat.vn/hoi-dap-phap-luat/thoi-gian-luu-tru-ho-so-benh-an-tai-benh-vien-la-bao-lau-225860.html"]
