introduction:
  purpose: >-
    Đặc tả yêu cầu phần mềm (SRS) này là tuyên bố chính thức về các yêu cầu chức năng và phi chức năng của Smart Hospital
    Platform. Tài liệu mô tả những khả năng hệ thống phải cung cấp và những ràng buộc hệ thống phải tuân thủ, làm cơ sở
    thống nhất giữa nhóm phát triển, người review và người phê duyệt về cách hệ thống hoạt động.
  purpose_points:
    - Xác định phạm vi mục tiêu nghiệp vụ, chức năng và cấu trúc của hệ thống.
    - Xác định các quy trình nghiệp vụ mà hệ thống hỗ trợ.
    - Tạo hiểu biết chung về yêu cầu chức năng cho mọi bên liên quan.
    - Làm cơ sở để xây dựng kế hoạch kiểm thử và tiêu chí nghiệm thu (mỗi quy tắc nghiệp vụ và tiêu chí nghiệm thu được truy vết sang test case).
  overview:
    - >-
      Smart Hospital Platform là nền tảng cloud-native phục vụ khám ngoại trú của một bệnh viện đa khoa tư nhân quy mô vừa
      (giả định: 300 giường, 40 phòng khám chuyên khoa, 120 bác sĩ, khoảng 1.500 lượt khám/ngày, 50.000 bệnh nhân năm đầu).
      Hệ thống giải quyết 6 vấn đề nghiệp vụ: tổng đài đặt lịch quá tải, tỉ lệ bệnh nhân không đến khám khoảng 18%, hồ sơ
      và kết quả rời rạc, tra cứu phác đồ thủ công, không truy vết được ai đã xem hồ sơ, và nhập tay dữ liệu từ giấy tờ.
    - >-
      Phạm vi gồm: đặt/hủy/đổi lịch khám và quản lý lịch làm việc bác sĩ; hồ sơ bệnh nhân, tiếp đón, ghi nhận lần khám theo
      chuẩn FHIR R4; upload, phát hành và tải tài liệu lâm sàng; nhắc lịch tự động; ghi nhật ký (audit) mọi truy cập dữ liệu
      bệnh nhân và truy cập khẩn cấp; trợ lý tri thức y tế (RAG) có trích dẫn, tóm tắt hồ sơ, trích xuất dữ liệu từ tài liệu,
      chatbot đặt lịch và mô hình dự đoán nguy cơ không đến khám.
    - >-
      Ngoài phạm vi: thanh toán và viện phí, nội trú, kê đơn và cấp phát thuốc, tích hợp với hệ thống của Bộ Y tế/BHXH,
      ứng dụng di động riêng (giao diện web có responsive). Toàn bộ dữ liệu bệnh nhân dùng trong dự án là dữ liệu giả.
  audience:
    - "Nhóm phát triển: thiết kế chi tiết, hiện thực, kiểm thử đơn vị, tích hợp và hệ thống."
    - "Nhóm kiểm thử: xây dựng kế hoạch kiểm thử, test case và tiêu chí nghiệm thu từ các quy tắc nghiệp vụ và tiêu chí Given/When/Then."
    - "Kiến trúc sư / DevOps: đối chiếu yêu cầu phi chức năng với kiến trúc, hạ tầng và kịch bản đo."
    - "Giảng viên và người review: đánh giá phạm vi, mức độ đầy đủ và khả năng kiểm chứng của yêu cầu."
  reading: >-
    Chương 2 cho cái nhìn tổng quan (đối tượng, quy trình, trạng thái, use case, phân quyền, site map). Chương 3 là đặc tả
    chi tiết từng use case: mỗi use case có bảng tóm tắt, activity diagram với các bước đánh số, và bảng quy tắc nghiệp vụ
    tham chiếu đúng số bước. Chương 4 mô tả màn hình. Chương 5 là yêu cầu phi chức năng có chỉ số và cách đo. Phụ lục liệt kê
    thông điệp và mẫu thông báo. Mã trong ngoặc như UC-03, AC-03.1, BR-02, NFR-P1, US-012 trỏ về tài liệu yêu cầu gốc trong repo.
  glossary:
    - ["SRS", "Software Requirements Specification – Đặc tả yêu cầu phần mềm"]
    - ["UC", "Use case"]
    - ["CMUC", "Common use case – use case dùng chung"]
    - ["BR", "Business rule – quy tắc nghiệp vụ (trong use case)"]
    - ["CBR", "Common business rule – quy tắc nghiệp vụ dùng chung"]
    - ["ET", "Mẫu thông báo (email/SMS/push)"]
    - ["EMSG / IEM / CFD / SMSG", "Thông điệp lỗi / lỗi tại trường / hộp thoại xác nhận / thông báo thành công"]
    - ["NFR", "Non-functional requirement – yêu cầu phi chức năng"]
    - ["AC", "Acceptance criteria – tiêu chí nghiệm thu dạng Given/When/Then"]
    - ["FHIR", "Fast Healthcare Interoperability Resources (HL7 FHIR R4) – chuẩn dữ liệu y tế"]
    - ["RAG", "Retrieval-Augmented Generation – sinh câu trả lời dựa trên tài liệu truy xuất được"]
    - ["OIDC / MFA", "OpenID Connect / xác thực nhiều yếu tố"]
    - ["DPO", "Data Protection Officer – cán bộ bảo vệ dữ liệu"]
    - ["Break-glass", "Truy cập khẩn cấp vào hồ sơ khi không có quan hệ điều trị, bắt buộc lý do và bị giám sát"]
    - ["Quan hệ điều trị (Care)", "Bác sĩ có lịch hẹn/lần khám với bệnh nhân trong 12 tháng gần nhất hoặc có lịch hẹn tương lai"]
    - ["Slot", "Khung giờ khám của một bác sĩ (mặc định 15 phút)"]
    - ["No-show", "Bệnh nhân không đến khám theo lịch hẹn"]
    - ["Idempotency-Key", "Khóa do client sinh để gửi lại yêu cầu mà không tạo bản ghi trùng"]
    - ["N/A", "Không áp dụng / không có"]
    - ["TBU", "To be updated – sẽ cập nhật"]
    - ["[Trường]", "Quy ước khi nhắc tới một trường dữ liệu, ví dụ [Trạng thái]"]
    - ["“Giá trị”", "Quy ước khi nhắc tới một giá trị, ví dụ “booked”"]
    - ["<Giá trị đặc biệt>", "Giá trị do hệ thống xác định lúc chạy, ví dụ <Hôm nay>, <Người dùng hiện tại>"]
    - ["<<Trường>>", "Giá trị của trường trong mẫu thông báo"]
