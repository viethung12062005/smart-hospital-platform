introduction:
  purpose: >-
    This Software Requirements Specification (SRS) is the formal statement of the functional and non-functional requirements of the Smart Hospital
    Platform. The document describes the capabilities the system must provide and the constraints the system must comply with, as a basis
    for agreement between the development team, reviewers and the approver on how the system works.
  purpose_points:
    - Define the scope of the business objectives, functions and structure of the system.
    - Define the business processes that the system supports.
    - Create a shared understanding of the functional requirements for all stakeholders.
    - Serve as the basis for building the test plan and acceptance criteria (every business rule and acceptance criterion is traced to a test case).
  overview:
    - >-
      Smart Hospital Platform is a cloud-native platform serving outpatient care at a medium-sized private general hospital
      (assumptions: 300 beds, 40 specialty clinics, 120 doctors, about 1,500 visits/day, 50,000 patients in the first year).
      The system addresses 6 business problems: an overloaded booking hotline, a no-show rate of about 18%, fragmented records
      and results, manual protocol lookup, inability to trace who viewed a record, and manual data entry from paper documents.
    - >-
      The scope includes: booking/cancelling/rescheduling visits and managing doctor schedules; patient records, reception and visit
      recording according to FHIR R4; uploading, releasing and downloading clinical documents; automatic reminders; audit logging of every access
      to patient data and every emergency access; a medical knowledge assistant (RAG) with citations, record summaries, data extraction from documents,
      a booking chatbot and a no-show risk prediction model.
    - >-
      Out of scope: payments and hospital fees, inpatient care, prescribing and dispensing medication, integration with Ministry of Health/social insurance
      systems, a dedicated mobile app (the web interface is responsive). All patient data used in the project is synthetic data.
  audience:
    - "Development team: detailed design, implementation, unit, integration and system testing."
    - "Test team: build the test plan, test cases and acceptance criteria from the business rules and Given/When/Then criteria."
    - "Architect / DevOps: align non-functional requirements with the architecture, infrastructure and measurement scenarios."
    - "Instructors and reviewers: assess the scope, completeness and verifiability of the requirements."
  reading: >-
    Chapter 2 gives an overview (objects, workflows, states, use cases, authorization, site map). Chapter 3 is the detailed specification
    of each use case: every use case has a summary table, an activity diagram with numbered steps, and a business rule table
    referencing the correct step numbers. Chapter 4 describes the screens. Chapter 5 contains the non-functional requirements with metrics and measurement methods. The appendices list
    messages and notification templates. Codes in parentheses such as UC-03, AC-03.1, BR-02, NFR-P1, US-012 refer to the original requirements documents in the repo.
  glossary:
    - ["SRS", "Software Requirements Specification"]
    - ["UC", "Use case"]
    - ["CMUC", "Common use case - shared use case"]
    - ["BR", "Business rule (within a use case)"]
    - ["CBR", "Common business rule - shared business rule"]
    - ["ET", "Notification template (email/SMS/push)"]
    - ["EMSG / IEM / CFD / SMSG", "Error message / field-level error / confirmation dialog / success message"]
    - ["NFR", "Non-functional requirement"]
    - ["AC", "Acceptance criteria in Given/When/Then form"]
    - ["FHIR", "Fast Healthcare Interoperability Resources (HL7 FHIR R4) - the healthcare data standard"]
    - ["RAG", "Retrieval-Augmented Generation - generating answers grounded in retrieved documents"]
    - ["OIDC / MFA", "OpenID Connect / multi-factor authentication"]
    - ["DPO", "Data Protection Officer"]
    - ["Break-glass", "Emergency access to a record when there is no treatment relationship; a reason is mandatory and access is monitored"]
    - ["Treatment relationship (Care)", "The doctor has an appointment/encounter with the patient within the last 12 months or has a future appointment"]
    - ["Slot", "A doctor's examination time slot (15 minutes by default)"]
    - ["No-show", "A patient who does not attend the scheduled appointment"]
    - ["Idempotency-Key", "A key generated by the client so a retried request does not create a duplicate record"]
    - ["N/A", "Not applicable / none"]
    - ["TBU", "To be updated"]
    - ["[Field]", "Convention when referring to a data field, for example [Status]"]
    - ["\"Value\"", "Convention when referring to a value, for example \"booked\""]
    - ["<Special value>", "A value determined by the system at runtime, for example <Today>, <Current user>"]
    - ["<<Field>>", "The value of the field in a notification template"]
  references:
    - ["Business analysis (G1)", "docs/01-business-analysis/business-analysis.md", "Context, problems BP-1..6, stakeholders, as-is/to-be processes, rules BR-01..11"]
    - ["Functional requirements (G2)", "docs/02-requirements/functional-requirements.md", "16 business use cases UC-01..16 with acceptance criteria"]
    - ["Non-functional requirements (G2)", "docs/02-requirements/non-functional-requirements.md", "49 NFRs with metrics and measurement methods"]
    - ["User stories", "docs/02-requirements/user-stories.md", "74 user stories US-001..074"]
    - ["Access control matrix", "docs/02-requirements/access-control-matrix.md; contracts/authz/matrix.yaml", "Permissions by role and treatment relationship; the machine-readable version is used in code and tests"]
    - ["Detailed design", "docs/03-architecture/detailed-design/", "Data model, per-service APIs, event catalog, detailed authorization"]
    - ["API contracts", "contracts/openapi/*.yaml", "OpenAPI 3 for 7 services"]
    - ["HL7 FHIR R4", "https://hl7.org/fhir/R4/", "Standard for Patient, Appointment, Slot, Encounter, Observation, DocumentReference resources..."]
    - ["Personal Data Protection Law", "Law No. 91/2025/QH15, effective 01/01/2026", "Health data is sensitive personal data - the basis for consent, audit, DPO, PII masking, 72-hour breach notification (Article 23), cross-border data transfer (Article 20), impact assessments (Articles 21-22), AI and cloud computing (Article 30), health information (Article 26)"]
    - ["Implementing decree", "Decree 356/2025/ND-CP", "Guidance for implementing Law 91/2025/QH15"]
    - ["Medical Examination and Treatment Law", "Law 2023, Article 69", "Paper or electronic medical records have equal legal validity; retention follows archival law"]
    - ["NIST SP 800-63B-4", "https://pages.nist.gov/800-63-4/sp800-63b/aal", "Authenticator Assurance Level AAL2: reauthentication and inactivity timeouts"]
    - ["Threshold rationale and legal basis", "Chapter 9, section \"Threshold rationale and legal basis\"", "Value of each threshold, source, confidence level, open questions to verify"]
