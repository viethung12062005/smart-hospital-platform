# Chapter 3 - Privacy, audit and administration module (audit, notification, clinical/admin services; operations).
modules:
  - key: privacy-admin
    name: Privacy, audit and administration
    intro: >-
      Patient rights over their own data (Personal Data Protection Law No. 91/2025/QH15), immutable access logs, staff account
      management, failed notification handling, backup and restore.
    sections:
      - name: Patient portal - Privacy and notifications
        use_cases:
          - key: view-my-access-log
            name: View who accessed my record
            type: Basic
            actors: [patient]
            trace: [UC-09, AC-09.1, NFR-SEC5, "Personal Data Protection Law 91/2025/QH15 - right to know"]
            objective: Show the patient who (role, department), when, and for what purpose their record was accessed.
            trigger: The patient opens [[SCR:my-access-log]].
            pre: ["The patient is logged in."]
            post: ["The list of accesses in the last 12 months is displayed."]
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Open \"Record access history\""}
              - {n: 2, lane: 1, text: "Fetch audit entries with\n[Patient] = self", end: true}
            rules:
              - step: "(2)"
                title: Display rules
                lines:
                  - "Each row: timestamp, role and department of the accessor, name of the clinical staff member, action (view, edit, download document), purpose (\"treatment\", \"emergency access\")."
                  - "Do not display IP, device or content viewed; emergency access is highlighted with the DPO review status."
                  - "The [Patient] filter is always forced to <Current user>."
            acceptance:
              - ["AC-AL.1", "Given a doctor opened the patient's record at 09:02, Then the patient sees that access row within <= 1 minute."]

          - key: manage-consent
            name: Manage data processing consent
            actors: [patient]
            trace: [NFR-SEC, "Personal Data Protection Law 91/2025/QH15 - consent and withdrawal of consent", UC-12, UC-13, UC-15]
            objective: The patient grants or withdraws consent for processing health data with AI (summary, extraction, prediction).
            trigger: The patient toggles the option on [[SCR:privacy]].
            pre: ["The patient is logged in."]
            post: ["The new consent status takes effect immediately; consent history is retained."]
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Turn on / off \"Allow processing\ndata with AI\""}
              - {n: 2, lane: 1, text: "Display an explanation of the scope\nand confirmation (when withdrawing)"}
              - {n: 3, lane: 0, text: "Confirm"}
              - {n: 4, lane: 1, text: "Save the new consent, emit event,\nwrite audit", end: true}
            rules:
              - step: "(2)"
                title: Explanation rules
                lines:
                  - "Clearly display: which AI uses what data, whether data is sent to an external provider (yes, after masking identifiers), and for how long it is retained; withdrawal uses [[MSG:confirm-withdraw-consent]]."
              - step: "(4)"
                title: Effect rules
                lines:
                  - "Consent is stored with the terms version and timestamp; withdrawal takes effect for every new AI request immediately."
                  - "On withdrawal: the patient's data is not used for new summaries, extractions or predictions; the data is not added to the next training set."
                  - "It does not affect features that do not use AI (booking, examination, reminders at fixed times)."
            acceptance:
              - ["AC-CS.1", "Given the patient withdraws consent at time T, When the doctor requests a summary after T, Then it is rejected with \"consent-required\"."]

          - key: export-my-data
            name: Request a personal data export
            actors: [patient]
            trace: ["Personal Data Protection Law 91/2025/QH15 - right of access, right to request a copy of data"]
            objective: The patient requests a copy of their personal and health data.
            trigger: The patient clicks "Request a copy of my data" on [[SCR:privacy]].
            pre: ["The patient is logged in and reauthenticated within the last 15 minutes."]
            post: ["The request is recorded and forwarded to the Data Protection Officer ([[UC:process-data-request]])."]
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Request a copy\nof my data\""}
              - {n: 2, lane: 1, kind: decision, text: "Is there already a\npending request?", branches: [{to: 3, label: "No"}, {to: 4, label: "Yes"}]}
              - {n: 3, lane: 1, text: "Record the request,\nnotify the DPO", end: true}
              - {n: 4, lane: 1, text: "Display the pending\nrequest", end: true}
            rules:
              - step: "(3)"
                title: Recording rules
                lines: ["At most one pending request per patient; display [[MSG:request-received]]; write audit."]
            acceptance:
              - ["AC-EX.1", "Given the patient already has a pending request, When submitting another, Then no new request is created."]

          - key: notification-preferences
            name: Notification preferences
            type: Basic
            actors: [patient]
            trace: [UC-07, "API N3, N4"]
            objective: Choose reminder channels (push, email, SMS), language and quiet hours.
            trigger: The patient opens [[SCR:notification-preferences]].
            pre: ["The patient is logged in."]
            post: ["The new preferences apply to reminders scheduled afterwards."]
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Select channels, language,\nquiet hours, click \"Save\""}
              - {n: 2, lane: 1, text: "Save the preferences", end: true}
            rules:
              - step: "(2)"
                title: Preference rules
                lines:
                  - "At least one channel must be kept; quiet hours do not apply to the T-2h reminder."
                  - "The SMS channel uses only the phone number in the record; changing the phone number must go through [[UC:update-profile]]."
            acceptance:
              - ["AC-NP.1", "Given the patient turns off every channel, When saving, Then an error is reported."]

      - name: Internal portal - Audit and data protection
        use_cases:
          - key: search-audit
            name: Search the access audit
            type: Basic
            actors: [dpo, admin]
            trace: [UC-09, AC-09.1, AC-09.2, BR-07, NFR-SEC5, "API audit"]
            objective: Filter audit entries by patient, accessor, time, action, result and purpose.
            trigger: The user opens [[SCR:audit]] and clicks "Search".
            pre: ["The user is a DPO or Administrator (MFA)."]
            post: ["The list of audit entries matching the criteria; this query itself is also audited."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Enter filter criteria, click \"Search\""}
              - {n: 2, lane: 1, text: "Query the audit store,\naudit the query"}
              - {n: 3, lane: 1, text: "Display the results", end: true}
            rules:
              - step: "(2)"
                key: audit-query
                title: Query rules
                lines:
                  - "Time range at most 92 days per query; entries appear in the search store within <= 1 minute of the event (NFR-SEC5)."
                  - "The audit store is append-only; there is no API or interface to edit/delete, even for Administrators (AC-09.2)."
                  - "DPO/Admin queries are also audited (who searched which patient)."
              - step: "(3)"
                title: Display rules
                lines:
                  - "Administrators see metadata (who, when, action, resource, result) but not clinical content; IPs are displayed with the last octet masked."
                  - "Emergency access has a review status column; the DPO marks it \"reviewed\" with a note."
            acceptance:
              - ["AC-09.1", "Given every read/write of patient data in UC-01, 04, 05, 06, 10, 11-13, Then each operation has an audit entry (who, when, what, result, from where)."]
              - ["AC-09.2", "Given an administrator, When attempting to edit or delete an audit entry (API, interface, storage), Then it cannot be done."]

          - key: export-audit
            name: Export an audit report
            actors: [dpo, admin]
            trace: [UC-09]
            objective: Export audit search results to a CSV file for reporting.
            trigger: The user clicks "Export CSV" on [[SCR:audit]].
            pre: ["Search results are available."]
            post: ["The CSV file is created and downloaded through a 5-minute link; the export is audited."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Export CSV\", enter\nthe export purpose"}
              - {n: 2, lane: 1, text: "Create the file, issue a 5-minute link,\nwrite \"export\" audit", end: true}
            rules:
              - step: "(2)"
                title: Export rules
                lines:
                  - "[Export purpose] is required; at most 100,000 rows per export; the file contains no clinical content; the file self-deletes after 24 hours."
            acceptance:
              - ["AC-EA.1", "Given an audit report export, Then there is an \"export\" audit entry with the entered purpose."]

          - key: process-data-request
            name: Process a data subject request
            actors: [dpo]
            trace: ["Personal Data Protection Law 91/2025/QH15", UC-17]
            objective: The DPO verifies and processes the patient's request for a copy of their data.
            trigger: The DPO opens a request on [[SCR:audit]] (the "Patient requests" tab).
            pre: ["There is a pending request."]
            post: ["The patient receives a download link for the data copy, or the request is rejected with a reason."]
            lanes: [Data Protection Officer, System]
            steps:
              - {n: 1, lane: 0, text: "Open the request, verify"}
              - {n: 2, lane: 0, kind: decision, text: "Accept?", branches: [{to: 3, label: "Yes"}, {to: 5, label: "No"}]}
              - {n: 3, lane: 1, text: "Create the data package (FHIR JSON\n+ summary PDF), encrypt it"}
              - {n: 4, lane: 1, text: "Send a 24-hour download link\nto the patient, write audit", end: true}
              - {n: 5, lane: 1, text: "Record the rejection reason,\nnotify the patient", end: true}
            rules:
              - step: "(3)"
                title: Data package rules
                lines:
                  - "Includes administrative record, appointments, finished encounters, vital signs, diagnoses, released documents, consent history and access history; excludes unreleased internal notes."
                  - "The package is encrypted with a one-time password sent via a separate channel (SMS); the link can be opened only by the patient after logging in."
              - step: "(4)"
                title: Deadline rules
                lines: ["Processing deadlines follow current regulations; the system reminds the DPO when a request has been pending for more than 48 hours."]
            acceptance:
              - ["AC-DR.1", "Given the data package has been created, Then the link can be opened only by the patient's own account and expires after 24 hours."]

      - name: Internal portal - Administration
        use_cases:
          - key: invite-staff
            name: Invite staff and assign roles
            actors: [admin]
            trace: [UC-08, AC-08.2, NFR-SEC1, "API C21"]
            objective: Create staff accounts with the role Doctor, Nurse, Administrator or Data Protection Officer.
            trigger: The administrator clicks "Invite staff" on [[SCR:users]].
            pre: ["The administrator is logged in (MFA)."]
            post: ["The invitation is sent; the account becomes active only after the staff member registers MFA."]
            lanes: [Administrator, System]
            steps:
              - {n: 1, lane: 0, text: "Enter email, full name, role,\nclick \"Invite\""}
              - {n: 2, lane: 1, kind: decision, text: "Valid?", branches: [{to: 3, label: "Yes"}, {to: 1, label: "No"}]}
              - {n: 3, lane: 1, text: "Create an account pending activation,\nsend the invitation, write audit", end: true}
            rules:
              - step: "(2)"
                key: staff-validate
                title: Validation rules
                lines:
                  - "The email belongs to the hospital domain; each account has one primary role; users cannot assign roles to themselves."
                  - "Assigning the Administrator or DPO role requires two people: a second person (another Administrator) approves."
              - step: "(3)"
                title: Activation rules
                lines: ["The invitation expires after 72 hours; the staff member must register MFA (TOTP authenticator app or WebAuthn key, not SMS) at first login, otherwise the account cannot access data (AC-08.2)."]
            acceptance:
              - ["AC-08.2", "Given a staff member has not registered MFA, When logging in, Then they cannot access patient data."]
              - ["AC-IS.1", "Given an administrator assigns themselves the DPO role, Then it is rejected."]

          - key: lock-account
            name: Lock / unlock an account
            actors: [admin]
            trace: [UC-08, AC-08.1, "API C21"]
            objective: Lock the account of a staff member who has left or is suspected of compromise; unlock it when needed.
            trigger: The administrator clicks "Lock" on [[SCR:users]].
            pre: ["The target account is not the acting administrator."]
            post: ["The account is locked; the current token is rejected within <= 5 minutes."]
            lanes: [Administrator, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Lock\", enter a reason"}
              - {n: 2, lane: 1, text: "Display the confirmation dialog"}
              - {n: 3, lane: 0, text: "Confirm"}
              - {n: 4, lane: 1, text: "Lock in the system and at the\nidentity provider, write audit", end: true}
            rules:
              - step: "(2)"
                title: Confirmation rules
                lines: ["Display [[MSG:confirm-lock]]; [Reason] is required."]
              - step: "(4)"
                key: lock-effect
                title: Effect rules
                lines:
                  - "Mark the account \"disabled\"; every service checks this status through a cache of at most 60 seconds, so a valid token is rejected within <= 5 minutes (AC-08.1)."
                  - "Invalidate sessions at the identity provider; the user sees [[MSG:account-locked]]."
                  - "The last active Administrator account cannot be locked."
            acceptance:
              - ["AC-08.1", "Given the account is locked at time T, When using the old token at T + 5 minutes, Then it is rejected."]

          - key: link-practitioner
            name: Link a doctor account to a doctor record
            actors: [admin]
            trace: [UC-08, "API C10, C21"]
            objective: Attach a doctor's login account to a Practitioner record and specialty for authorization by treatment relationship.
            trigger: The administrator clicks "Link" on [[SCR:users]].
            pre: ["The account has the Doctor role; the Practitioner record exists."]
            post: ["The account is linked to exactly one Practitioner."]
            lanes: [Administrator, System]
            steps:
              - {n: 1, lane: 0, text: "Select the doctor record,\nclick \"Link\""}
              - {n: 2, lane: 1, text: "Save the link, clear the identity\ncache, write audit", end: true}
            rules:
              - step: "(2)"
                title: Linking rules
                lines: ["A Practitioner is linked to only one account and vice versa; changing the link takes effect within <= 60 seconds."]
            acceptance:
              - ["AC-LP.1", "Given the Practitioner is already linked to account A, When linking it to account B, Then it is rejected."]

          - key: manage-dead-letters
            name: Handle failed notifications
            type: Basic
            actors: [admin]
            trace: [UC-07, AC-07.2, OBS-03, "API N6, N7"]
            objective: View permanently failed reminders and requeue them after remediation.
            trigger: The administrator opens [[SCR:dead-letters]] or receives a dead-letter queue alert.
            pre: ["The administrator is logged in (MFA)."]
            post: ["The reminder is requeued or closed."]
            lanes: [Administrator, System]
            steps:
              - {n: 1, lane: 0, text: "Select the failed item, click \"Resend\""}
              - {n: 2, lane: 1, kind: decision, text: "Is the appointment\nstill valid?", branches: [{to: 3, label: "Yes"}, {to: 4, label: "No"}]}
              - {n: 3, lane: 1, text: "Requeue the item", end: true}
              - {n: 4, lane: 1, text: "Close the item, do not send", end: true}
            rules:
              - step: "(1)"
                title: Display rules
                lines: ["The list shows only the appointment ID, channel, error and attempt count; it does not show the message content, phone number or full email."]
              - step: "(2)"
                title: Resend rules
                lines: ["Do not resend if the appointment has been cancelled or the visit time has passed; still ensure no duplicate is sent for the same reminder (AC-07.2)."]
            acceptance:
              - ["AC-DL.1", "Given the appointment has been cancelled, When resending the failed item, Then no message is sent."]

          - key: backup-restore
            name: Back up and restore data
            actors: [admin]
            trace: [UC-16, AC-16.1, AC-16.2, NFR-A4, NFR-A5]
            objective: Ensure appointment, record and document data can be restored to a point in time within the last 7 days.
            trigger: A data loss/corruption incident, or a scheduled drill.
            pre: ["The restore process is approved by a second person; it runs through the operations pipeline, not by manual actions on the database."]
            post: ["Data is restored; the actual time is recorded against the RTO."]
            lanes: [Administrator, System]
            steps:
              - {n: 1, lane: 0, text: "Select the restore point,\nsubmit the request"}
              - {n: 2, lane: 0, kind: decision, text: "Second person\napproves?", branches: [{to: 3, label: "Yes"}, {to: 5, label: "No"}]}
              - {n: 3, lane: 1, text: "Restore into a new environment,\ncheck integrity"}
              - {n: 4, lane: 1, text: "Switch traffic, record the time\nand result, write audit", end: true}
              - {n: 5, lane: 1, text: "Cancel the request", end: true}
            rules:
              - step: "(3)"
                title: Restore rules
                lines:
                  - "PostgreSQL and MongoDB restore to a point in time (PITR) within 7 days; document files have versioning and soft delete for 14 days; backups are encrypted and zone-redundant."
                  - "RPO <= 5 minutes, RTO <= 1 hour for appointments and clinical data (NFR-A4); RPO = 0 for documents and audit whose write is confirmed (NFR-A5)."
                  - "Audit (WORM) is not overwritten during a restore."
            acceptance:
              - ["AC-16.1", "Given data was accidentally deleted at time T, When restoring to T - 1 minute, Then appointment and record data match the state at that time."]
              - ["AC-16.2", "Given a restore drill, Then the report records the actual time and compares it with the 1-hour RTO."]
