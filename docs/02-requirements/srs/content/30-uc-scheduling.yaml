# Chapter 3 - Appointment and schedule module (scheduling service).
use_case_intro: >-
  This chapter specifies the functional requirements: what the system must do in terms of input data, behavior and results. Each use case consists of a summary
  table, an activity flow (numbered steps), alternative flows, business rules referencing the correct step numbers, and acceptance criteria
  in Given/When/Then form. Unless stated otherwise, every use case applies [[CBR:authz]], [[CBR:audit]] and [[CBR:no-pii]].

modules:
  - key: scheduling
    name: Appointments and schedules
    intro: Book, cancel and reschedule visits; doctor schedules and slots. Data belongs to the scheduling service (PostgreSQL).
    sections:
      - name: Patient portal - Appointments
        use_cases:
          - key: find-slot
            name: Find a doctor and a free time slot
            type: Basic
            actors: [patient, nurse, doctor, admin]
            trace: [UC-03, BR-04, NFR-P1, "API S8, C9"]
            objective: Allow a user to find free time slots by specialty, doctor and date range.
            trigger: The user selects "Book an appointment" on the home page or opens [[SCR:find-doctor]].
            pre: ["The user is logged in with one of the roles above."]
            post: ["The list of free time slots matching the filters is displayed."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Open the find a doctor screen"}
              - {n: 2, lane: 1, text: "Display the filters and\nthe specialty list"}
              - {n: 3, lane: 0, text: "Select a specialty / doctor /\ndate range, click \"Search\""}
              - {n: 4, lane: 1, kind: decision, text: "Are the conditions\nvalid?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
              - {n: 5, lane: 1, text: "Return the \"free\" slots\nwithin the 30-day window", end: true}
            rules:
              - step: "(2)"
                title: Screen display rules
                lines:
                  - "The system loads [[SCR:find-doctor]]; [From date] defaults to <Today>, [To date] defaults to <Today> + 7 days."
                  - "The specialty list comes from the specialty code set; the doctor list is filtered by the selected specialty."
              - step: "(4)"
                key: slot-search-validate
                title: Condition validation rules
                lines:
                  - "[Specialty] or [Doctor] is required; if missing, display [[MSG:required]] under the [Specialty] field."
                  - "The date range is at most 31 days and must not exceed <Today> + 30 days (BR-04); if exceeded, clamp it to the limit and display a note."
              - step: "(5)"
                title: Result rules
                lines:
                  - "Return only slots with [Status] = \"free\", [Start] > <Now>, belonging to an active schedule."
                  - "Sort by [Start] ascending; paginate 20 slots/page per [[CBR:pagination]]."
                  - "Patients see only \"free\" slots; Nurses/Administrators/Doctors may also filter \"busy\", \"busy-unavailable\" but do not see the patient name of a busy slot unless they have permission to view that appointment."
                  - "Results are cached for at most 5 seconds and refreshed immediately on a booking/cancellation event (ensuring NFR-P1: p95 <= 300 ms at 500 RPS)."
            acceptance:
              - ["AC-FS.1", "Given the schedule has 14 free slots tomorrow, When a patient searches by that specialty, Then they see exactly 14 slots in time order."]
              - ["AC-FS.2", "Given a date range exceeding 30 days, When searching, Then only slots up to <Today> + 30 days are returned."]
              - ["AC-FS.3", "Given a patient, When filtering by status \"busy\", Then the request is rejected or the parameter is ignored, without exposing another person's appointment."]

          - key: book
            name: Book an appointment
            actors: [patient, nurse]
            trace: [UC-03, AC-03.1, AC-03.2, AC-03.3, AC-03.4, AC-03.6, AC-03.7, BR-01, BR-03, BR-04, NFR-P2, "API S11"]
            objective: Allow a patient to book for themselves, or a nurse to book on a patient's behalf, into a free time slot.
            trigger: The user selects a slot on [[SCR:find-doctor]] and clicks "Book".
            pre:
              - "The user is logged in; the patient already has a record (is registered)."
              - "The slot is \"free\" and within the next 30 days."
            post: ["The appointment is in status \"booked\"; the slot becomes \"busy\"; a \"booked\" event is emitted (triggering reminders, no-show prediction and audit)."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Select a slot, click \"Book\""}
              - {n: 2, lane: 1, text: "Display the booking\nconfirmation screen"}
              - {n: 3, lane: 0, text: "Enter the reason for the visit,\nclick \"Confirm\""}
              - {n: 4, lane: 1, kind: decision, text: "Valid and\neligible?", branches: [{to: 5, label: "Yes"}, {to: 7, label: "No"}]}
              - {n: 5, lane: 1, text: "Create the \"booked\" appointment,\nslot \"busy\", emit the event"}
              - {n: 6, lane: 1, text: "Display the success message\nand the appointment ID", end: true}
              - {n: 7, lane: 1, text: "Display the error; if the slot was\nalready booked, suggest the 3 nearest slots", next: 1}
            alternatives:
              - "The user clicks \"Confirm\" multiple times or an unstable network makes the browser resend: the system returns the appointment created on the first attempt and does not create a duplicate ([[BR:book-idempotency]])."
              - "Two people book the same slot: exactly one succeeds, the other receives [[MSG:slot-unavailable]] with 3 suggested slots ([[BR:book-concurrency]])."
            rules:
              - step: "(2)"
                title: Screen display rules
                lines:
                  - "The system loads [[SCR:book]] with the slot information (doctor, specialty, date and time) in read-only mode."
                  - "If the user is a Nurse: display the required [Patient] field, searching via [[UC:search-patient]]. If the user is a Patient: [Patient] = <Current user>, not editable."
                  - "The browser generates an [Idempotency-Key] (UUID) when the screen opens and keeps it for every resend of the same operation."
              - step: "(4)"
                key: book-validate
                title: Validation rules
                lines:
                  - "[Reason for visit] is optional, at most 500 characters; if exceeded, display [[MSG:max-length]]."
                  - "A patient can book only for themselves or for a record linked to their account (children under 16, authorized relatives, [[UC:link-relative]]); another [Patient] -> deny [[MSG:forbidden]] and write an audit \"deny\" (AC-03.6). Booking on behalf is audited together with the acting account (AC-03.7)."
                  - "The slot must be within <Today> + 30 days (BR-04), otherwise -> [[MSG:outside-window]]."
                  - "A patient may not have more than 3 future \"booked\" appointments (BR-03), otherwise -> [[MSG:max-future]]. The rule also applies when a Nurse books on their behalf."
                  - "Limit of 10 booking requests/minute/user; exceeded -> [[MSG:rate-limited]]."
              - step: "(5)"
                key: book-concurrency
                title: Appointment creation and duplicate-booking rules
                lines:
                  - "Create the [Appointment] with [Status] = \"booked\", [Booking channel] = \"web\" (Patient) or \"counter\" (Nurse), [Appointment ID] = \"LH-\" + yyyyMMdd + \"-\" + a 4-digit sequence number for the day."
                  - "Update the slot to \"busy\" in the same transaction; a unique database constraint ensures a slot has only one active appointment (BR-01). If the slot is already taken -> [[MSG:slot-unavailable]] with at most 3 nearest free slots for the same doctor or the same specialty."
                  - "Write the event \"shp.scheduling.appointment-booked.v1\" to the outbox in the same transaction (containing no name, phone number or reason for visit)."
                  - "Write audit per [[CBR:audit]]."
              - step: "(5)"
                key: book-idempotency
                title: Safe resend (idempotency) rules
                lines:
                  - "Missing [Idempotency-Key] -> reject (technical error 428; clients always send the key)."
                  - "Same key and same content within 24 hours -> return the appointment already created, do not create a new record (AC-03.2)."
                  - "Same key but different content -> reject, without changing data (AC-03.3)."
              - step: "(6)"
                title: Result notification rules
                lines:
                  - "Display [[MSG:booked]]; navigate to [[SCR:my-appointments]] (Patient) or [[SCR:queue]] (Nurse)."
                  - "Send [[ET:booking-confirmation]] according to the patient's notification preferences."
            acceptance:
              - ["AC-03.1", "Given 1 free slot and 50 concurrent booking requests from 50 patients, When processing completes, Then exactly 1 request succeeds and 49 receive the \"slot-unavailable\" error."]
              - ["AC-03.2", "Given the same Idempotency-Key sent twice with the same content, Then both receive the same appointment and only 1 appointment exists."]
              - ["AC-03.3", "Given the same Idempotency-Key but different content, When sent, Then it is rejected and nothing changes."]
              - ["AC-03.4", "Given a patient already has 3 future appointments, When booking another, Then it is rejected with \"max-future-appointments\"."]
              - ["AC-03.6", "Given patient A, When booking for a record not linked to A's account, Then it is rejected and a \"deny\" audit entry is recorded."]
              - ["AC-03.7", "Given a linked relative's record, When A's account books for that record, Then booking succeeds and the audit records the acting account and the record booked."]
              - ["AC-BK.1", "Given a successful booking, Then the emitted event contains no full name, phone number, email or reason for visit."]

          - key: cancel
            name: Cancel an appointment
            actors: [patient, nurse]
            trace: [UC-03, AC-03.5, AC-07.1, BR-02, "API S14"]
            objective: Allow a patient to cancel their appointment at least 2 hours before the visit, or a nurse to cancel at any time before check-in.
            trigger: The user clicks "Cancel appointment" on [[SCR:my-appointments]] or [[SCR:queue]].
            pre: ["The appointment is in status \"booked\"."]
            post: ["The appointment is \"cancelled\"; the slot returns to \"free\"; unsent reminders are cancelled."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Cancel appointment\""}
              - {n: 2, lane: 1, text: "Display the confirmation dialog\nand select a cancellation reason"}
              - {n: 3, lane: 0, text: "Select a reason, click \"Agree\""}
              - {n: 4, lane: 1, kind: decision, text: "Cancellation allowed?", branches: [{to: 5, label: "Yes"}, {to: 6, label: "No"}]}
              - {n: 5, lane: 1, text: "Cancel the appointment, free the slot,\nemit the \"cancelled\" event", end: true}
              - {n: 6, lane: 1, text: "Display the error, keep the\nappointment unchanged", end: true}
            rules:
              - step: "(2)"
                title: Confirmation rules
                lines:
                  - "Display [[MSG:confirm-cancel]] with the list of [Cancellation reasons] (a set of 6 reasons). Clicking \"No\" closes the dialog without changes."
              - step: "(4)"
                key: cancel-window
                title: Cancellation deadline rules
                lines:
                  - "A patient can cancel only their own appointment and only when [Start] - <Now> >= 2 hours (BR-02); otherwise -> [[MSG:cancel-too-late]]."
                  - "A nurse can cancel any \"booked\" appointment. An appointment not in \"booked\" -> [[MSG:invalid-state]]."
              - step: "(5)"
                title: Cancellation rules
                lines:
                  - "Update [Status] = \"cancelled\", store [Cancellation reason], the canceller and the time; the slot returns to \"free\" in the same transaction."
                  - "Emit the event \"shp.scheduling.appointment-cancelled.v1\"; the notification service cancels every \"scheduled\" reminder ([[UC:cancel-reminders]])."
                  - "Display [[MSG:cancelled]]; send [[ET:cancellation]]."
            acceptance:
              - ["AC-03.5", "Given 1 hour remains until the visit, When the patient cancels, Then it is rejected with \"cancellation-too-late\"; When a nurse cancels, Then it succeeds."]
              - ["AC-07.1", "Given the appointment is cancelled before the reminder time, Then no reminder is sent."]
              - ["AC-CN.1", "Given a successful cancellation, Then the slot returns to \"free\" and appears in search results within <= 5 seconds."]

          - key: reschedule
            name: Reschedule an appointment
            actors: [patient, nurse]
            trace: [UC-03, BR-01..04, "API S15"]
            objective: Allow an appointment to be moved to another time slot as a single operation; on failure the old appointment is kept.
            trigger: The user clicks "Reschedule" on [[SCR:my-appointments]] or [[SCR:queue]].
            pre: ["The old appointment is \"booked\"; for patients, at least 2 hours remain until the old visit time."]
            post: ["The old appointment is \"cancelled\" and the new appointment is \"booked\" - or nothing changes."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Reschedule\""}
              - {n: 2, lane: 1, text: "Open slot search, pre-filtered for\nthe same doctor / specialty"}
              - {n: 3, lane: 0, text: "Select a new slot, confirm"}
              - {n: 4, lane: 1, kind: decision, text: "Can the new slot be booked and\nthe old one cancelled?", branches: [{to: 5, label: "Yes"}, {to: 6, label: "No"}]}
              - {n: 5, lane: 1, text: "Complete the reschedule,\nemit the \"rescheduled\" event", end: true}
              - {n: 6, lane: 1, text: "Roll back all changes,\nkeep the old appointment, report the error", end: true}
            rules:
              - step: "(3)"
                title: Confirmation rules
                lines: ["Display [[MSG:confirm-reschedule]]."]
              - step: "(4)"
                title: Atomic reschedule rules
                lines:
                  - "Apply all rules of [[UC:book]] to the new slot and of [[UC:cancel]] to the old appointment, in a single transaction."
                  - "Rescheduling does not increase the number of future appointments (the old appointment is subtracted when checking BR-03)."
              - step: "(5)"
                title: Result rules
                lines:
                  - "Emit a single event \"shp.scheduling.appointment-rescheduled.v1\" (not separate book and cancel events) so the notification service cancels the old reminders and creates new ones."
                  - "Display [[MSG:rescheduled]]."
            acceptance:
              - ["AC-RS.1", "Given the new slot was just booked by someone else, When rescheduling, Then the old appointment remains \"booked\" and there is no new appointment."]
              - ["AC-RS.2", "Given a patient has 3 future appointments, When rescheduling one, Then it succeeds (BR-03 does not block it)."]

          - key: my-appointments
            name: View my appointments
            type: Basic
            actors: [patient]
            trace: [UC-03, BR-05, "API S13"]
            objective: Allow a patient to view the list and details of their own appointments.
            trigger: The patient opens [[SCR:my-appointments]].
            pre: ["The patient is logged in."]
            post: ["The patient's appointment list is displayed."]
            rules: []
            lanes: [Patient, System]
            steps:
              - {n: 1, lane: 0, text: "Open \"My appointments\""}
              - {n: 2, lane: 1, text: "Fetch the appointments of\n<Current user>", end: true}
            alternatives: ["Applies [[CMUC:view-list]] and [[CMUC:view-item]]; specific rule: the [Patient] filter is always forced to <Current user> on the server side and other parameters are ignored (BR-05)."]
            acceptance:
              - ["AC-MA.1", "Given patient A sends a request to filter patient B's appointments, Then only A's appointments are returned."]

      - name: Internal portal - Schedules
        use_cases:
          - key: schedule-template
            name: Create a schedule and weekly template
            actors: [nurse, admin]
            trace: [UC-02, "API S1, S5"]
            objective: Allow a schedule to be created for a doctor by specialty and a weekly template to be set.
            trigger: The user clicks "Create schedule" on [[SCR:schedule]].
            pre: ["The doctor already has a Practitioner record with the corresponding specialty."]
            post: ["The active schedule and weekly template are saved; slots have not yet been generated."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Click \"Create schedule\""}
              - {n: 2, lane: 1, text: "Display the schedule form\nand weekly template"}
              - {n: 3, lane: 0, text: "Select a doctor and specialty,\nenter the weekly template, click \"Save\""}
              - {n: 4, lane: 1, kind: decision, text: "Valid?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
              - {n: 5, lane: 1, text: "Save the schedule and weekly template,\nwrite audit", end: true}
            rules:
              - step: "(4)"
                key: template-validate
                title: Weekly template validation rules
                lines:
                  - "Each template row consists of [Day], [Start time], [End time], [Slot length] in {10, 15, 20, 30} minutes; all are required."
                  - "[Start time] < [End time], otherwise -> [[MSG:time-range]]; the interval must be divisible by [Slot length] -> otherwise [[MSG:slot-length]]."
                  - "Two rows for the same day must not overlap in time."
                  - "Each doctor has only one active schedule per specialty; duplicate -> [[MSG:duplicate-schedule]]."
              - step: "(5)"
                title: Save rules
                lines: ["Save per [[CMUC:create-item]]; [Scheduling window] = <Today> -> <Today> + 30 days. Editing the template does not automatically delete slots already generated."]
            acceptance:
              - ["AC-ST.1", "Given a template 08:00-11:30 with 15-minute slots, When saving, Then it is valid; Given 08:00-11:20 with 15-minute slots, Then a non-divisible error is reported."]

          - key: generate-slots
            name: Generate slots from a template
            actors: [nurse, admin]
            trace: [UC-02, AC-02.1, BR-04, "API S7"]
            objective: Generate slots for a date range from the weekly schedule template.
            trigger: The user clicks "Generate slots" on [[SCR:schedule]]; or a daily job generates the 30th day automatically.
            pre: ["The schedule is active and has a weekly template."]
            post: ["\"free\" slots are created; existing slots are not duplicated."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Select a date range,\nclick \"Generate slots\""}
              - {n: 2, lane: 1, text: "Generate slots from the template,\nskip existing slots"}
              - {n: 3, lane: 1, text: "Display the number of slots\ncreated", end: true}
            rules:
              - step: "(2)"
                title: Slot generation rules
                lines:
                  - "Generate only within the window <Today> -> <Today> + 30 days (BR-04); dates outside the window are skipped."
                  - "The operation is safely repeatable: a slot with the same doctor and start time is not created twice."
                  - "Holidays in the hospital's holiday calendar do not generate slots."
            acceptance:
              - ["AC-02.1", "Given a template 08:00-11:30 with 15-minute slots, When generating slots for one day, Then there are exactly 14 \"free\" slots."]
              - ["AC-GS.1", "Given slots have been generated for day D, When generating again for day D, Then the total number of slots for day D does not change."]

          - key: block-slot
            name: Block / unblock a slot
            actors: [nurse, admin]
            trace: [UC-02, AC-02.2, "API S9, S10"]
            objective: Block a time slot when the doctor is on leave or busy; unblock it when needed.
            trigger: The user selects a slot on [[SCR:schedule]] and clicks "Block" or "Unblock".
            pre: ["The slot belongs to an active schedule."]
            post: ["The slot is \"busy-unavailable\" (blocked) or \"free\" (unblocked)."]
            lanes: [User, System]
            steps:
              - {n: 1, lane: 0, text: "Select a slot, click \"Block\",\nenter a reason"}
              - {n: 2, lane: 1, kind: decision, text: "Does the slot have\nan appointment?", branches: [{to: 3, label: "No"}, {to: 4, label: "Yes"}]}
              - {n: 3, lane: 1, text: "Change to \"busy-unavailable\",\nsave the reason", end: true}
              - {n: 4, lane: 1, text: "Reject, require cancelling / rescheduling\nthe appointment first", end: true}
            rules:
              - step: "(1)"
                title: Confirmation rules
                lines: ["Display [[MSG:confirm-block]]; [Reason] is required, at most 200 characters, and must not contain patient information."]
              - step: "(2)"
                title: Blocking rules
                lines:
                  - "A slot that is \"busy\" due to an active appointment -> [[MSG:slot-has-appointment]] (AC-02.2)."
                  - "Unblocking applies only to \"busy-unavailable\" slots; past slots cannot be changed."
            acceptance:
              - ["AC-02.2", "Given the slot has been booked, When blocking the slot, Then the error \"slot-has-appointment\" is returned."]

          - key: view-own-schedule
            name: Doctor views their own schedule and appointments
            type: Basic
            actors: [doctor]
            trace: [UC-02, AC-02.3, "API S3, S13"]
            objective: Allow a doctor to view their own schedule, slots and appointments (without editing).
            trigger: The doctor opens [[SCR:schedule]].
            pre: ["The doctor's account is linked to a Practitioner."]
            post: ["The doctor's schedule is displayed in read-only mode."]
            lanes: [Doctor, System]
            steps:
              - {n: 1, lane: 0, text: "Open \"Schedule\""}
              - {n: 2, lane: 1, text: "Fetch the schedule of\n<Current Practitioner>", end: true}
            rules:
              - step: "(2)"
                title: Data scope rules
                lines:
                  - "The [Doctor] filter is always forced to the <Current user>'s Practitioner; edit/block/generate buttons are hidden and every edit request is rejected (AC-02.3)."
                  - "Appointments show the patient's full name and reason for visit because these are patients with a treatment relationship."
            acceptance:
              - ["AC-02.3", "Given doctor A, When viewing doctor B's schedule or editing their own schedule, Then it is rejected and audited."]
