# Appendix - Message catalog and notification templates. The corresponding API code is noted in the "When" column.
messages:
  - name: Error messages
    prefix: EMSG
    intro: "Shown in an alert box:"
    format: ["Title: \"Could not complete\".", "Body: <Message> and a reference code.", "Button: \"Close\"."]
    items:
      - {key: forbidden, text: "You do not have permission to perform this action.", when: "403 forbidden"}
      - {key: not-found, text: "Data not found, or you do not have permission to view it.", when: "404 not-found - also used when you have no permission for another person's data"}
      - {key: no-care, text: "You do not have a treatment relationship with this patient. In an emergency, use emergency access.", when: "403 no-care-relationship"}
      - {key: slot-unavailable, text: "This time slot has just been taken. Please choose one of the suggested slots below.", when: "409 slot-unavailable"}
      - {key: slot-has-appointment, text: "This time slot already has an appointment. Cancel or reschedule the appointment before blocking it.", when: "409 slot-has-appointment"}
      - {key: invalid-state, text: "This action is not valid for the current state.", when: "409 invalid-state-transition"}
      - {key: version-conflict, text: "The data has just been updated by someone else. Please reload and try again.", when: "412 version-conflict"}
      - {key: max-future, text: "You already have 3 upcoming appointments. Please cancel some before booking more.", when: "422 max-future-appointments (BR-03)"}
      - {key: outside-window, text: "Appointments can only be booked within the next 30 days.", when: "422 outside-booking-window (BR-04)"}
      - {key: cancel-too-late, text: "The cancellation deadline has passed (2 hours before the visit time). Please contact the reception desk.", when: "422 cancellation-too-late (BR-02)"}
      - {key: national-id-duplicate, text: "This national ID number is already linked to another record. Please check and merge the duplicate records.", when: "422 duplicate-patient-suspected (by national ID)"}
      - {key: claim-sent, text: "If the information matches a hospital record, a verification code has been sent to the phone number of that record.", when: "200 (identical whether or not it matches)"}
      - {key: otp-invalid, text: "The verification code is incorrect or has expired.", when: "422 otp-invalid"}
      - {key: otp-locked, text: "You have entered the wrong code too many times. Please try again after 15 minutes.", when: "429 otp-locked"}
      - {key: otp-rate, text: "You have requested a code too many times. Please try again later.", when: "429 otp-rate-limited"}
      - {key: profile-limit, text: "Each account can manage at most 10 records.", when: "422 profile-limit"}
      - {key: age-not-dependent, text: "This record does not belong to a person under 16. People aged 16 or older must register themselves or be authorized.", when: "422 not-a-dependent"}
      - {key: duplicate-patient, text: "The information matches an existing record. Please go to the reception desk for verification.", when: "422 duplicate-patient-suspected"}
      - {key: duplicate-schedule, text: "The doctor already has an active schedule for this specialty.", when: "409"}
      - {key: file-too-large, text: "The file exceeds 20 MB.", when: "413 file-too-large"}
      - {key: invalid-file-type, text: "Only PDF, JPEG or PNG files are accepted.", when: "415 invalid-file-type"}
      - {key: file-infected, text: "The file is unsafe and has been quarantined. Please check the original file.", when: "Malware scan result"}
      - {key: link-expired, text: "The link has expired. Please reopen the document.", when: "403 from the storage store"}
      - {key: consent-required, text: "The patient has not consented to AI processing of their data.", when: "403 consent-required"}
      - {key: confirmation-expired, text: "The confirmation request has expired. Please try again.", when: "422 confirmation-expired"}
      - {key: rate-limited, text: "You are acting too quickly. Please try again in a few minutes.", when: "429 rate-limited"}
      - {key: ai-unavailable, text: "The AI assistant is temporarily unavailable. Related documents are listed below.", when: "503 ai-unavailable"}
      - {key: ai-budget, text: "Today's AI usage quota has been exhausted. Related documents are listed below.", when: "503 ai-budget-exceeded"}
      - {key: account-locked, text: "The account has been locked. Please contact an administrator.", when: "401/403 account disabled"}
      - {key: mfa-required, text: "Staff accounts require multi-factor authentication. Please log in again.", when: "403 missing MFA"}
      - {key: session-expired, text: "Your session has expired. Please log in again.", when: "Session expired / 401"}
  - name: Field errors
    prefix: IEM
    intro: "Shown in red directly below the invalid field."
    items:
      - {key: required, text: "Please fill in this field."}
      - {key: max-length, text: "Exceeds the allowed number of characters."}
      - {key: dob-future, text: "The date of birth cannot be in the future."}
      - {key: invalid-phone, text: "Invalid phone number."}
      - {key: invalid-national-id, text: "The national ID number must be exactly 12 digits."}
      - {key: time-range, text: "The start time must be before the end time."}
      - {key: slot-length, text: "The time span must be divisible by the slot length."}
      - {key: vital-range, text: "The value is outside the allowed range."}
      - {key: icd-invalid, text: "The diagnosis code is not in the ICD-10 catalog."}
      - {key: reason-min, text: "The reason must be at least 10 characters."}
  - name: Confirmation dialogs
    prefix: CFD
    intro: "Title \"Confirm\"; the primary button performs the action, and the \"Cancel\" button closes the dialog without changing anything."
    items:
      - {key: confirm-cancel, text: "Are you sure you want to cancel appointment <<Appointment ID>> at <<Time>> on <<Date>>?"}
      - {key: confirm-reschedule, text: "Reschedule to <<New time>> on <<New date>>? The old appointment is cancelled when the reschedule succeeds."}
      - {key: confirm-block, text: "Block the <<Count>> selected time slots?"}
      - {key: confirm-merge, text: "Merge record <<Source ID>> into <<Target ID>>? This action cannot be undone."}
      - {key: confirm-finish, text: "Finish the encounter? After finishing, you can only add an addendum."}
      - {key: confirm-break-glass, text: "You are using emergency access to a record outside your treatment relationship. Every action is recorded and reported to the Data Protection Officer. Enter a reason to continue."}
      - {key: confirm-release, text: "Release the document to the patient? The patient will be able to view this document."}
      - {key: confirm-void, text: "Mark the document as entered in error? The document is hidden but not deleted."}
      - {key: confirm-bot-action, text: "The assistant suggests: <<Action>>. Do you confirm?"}
      - {key: confirm-withdraw-consent, text: "Withdraw consent? AI features will no longer process your data."}
      - {key: confirm-lock, text: "Lock the account of <<Name>>? The user will be signed out within at most 5 minutes."}
  - name: Success messages
    prefix: SMSG
    intro: "Shown in the corner of the screen and closes automatically after 5 seconds."
    items:
      - {key: booked, text: "Appointment booked successfully. Appointment ID: <<Appointment ID>>."}
      - {key: cancelled, text: "The appointment has been cancelled."}
      - {key: rescheduled, text: "The appointment has been rescheduled."}
      - {key: saved, text: "Changes saved."}
      - {key: checked-in, text: "Checked in."}
      - {key: uploaded, text: "Uploaded. The document becomes available after the safety check."}
      - {key: request-received, text: "Request received. The Data Protection Officer will process it and notify you."}

email_intro: >-
  Notification templates are written in the past tense, politely and concisely. Common security rule: notifications sent via
  email/SMS/push contain no diagnosis, visit reason, results or document type; they contain only the minimum administrative
  information and a link that requires login.
email_templates:
  - key: booking-confirmation
    name: Booking confirmation
    channel: "Email / push (per preference)"
    to: "The patient of the appointment"
    trigger: "[[UC:book]] succeeded"
    subject: "[Hospital] Visit confirmation <<Appointment ID>>"
    body: "Dear <<Salutation>>, your visit has been booked for <<Time>> on <<Date>> with <<Doctor>> - <<Specialty>>, at <<Clinic>>. Manage your appointment: <<Link>>."
    notes: ["<<Salutation>> is a short form of address (for example \"Ms Lan\"), not the full name.", "The link requires login and does not contain the appointment ID in the URL."]
  - key: reminder
    name: Appointment reminder
    channel: "Push / email / SMS"
    to: "The patient of the appointment"
    trigger: "[[UC:send-reminder]] (T-24h, T-6h, T-2h)"
    subject: "[Hospital] Visit reminder for <<Date>>"
    body: "You have a visit at <<Time>> on <<Date>> with <<Doctor>>. Please arrive 15 minutes early. Cancel or reschedule at least 2 hours in advance at <<Link>>."
    notes: ["SMS is at most 160 characters, without diacritics if the carrier requires it."]
  - key: cancellation
    name: Cancellation confirmation
    channel: "Email / push"
    to: "The patient of the appointment"
    trigger: "[[UC:cancel]] succeeded"
    subject: "[Hospital] Visit <<Appointment ID>> has been cancelled"
    body: "The visit at <<Time>> on <<Date>> has been cancelled. If you did not do this, please contact the hospital."
  - key: document-released
    name: New document available
    channel: "Push / email"
    to: "The patient who owns the document"
    trigger: "[[UC:release-document]]"
    subject: "[Hospital] You have a new document"
    body: "The hospital has just sent you a new document. Log in to view it: <<Link>>."
    notes: ["Does not state the document type or the result content."]
  - key: break-glass-alert
    name: Emergency access alert
    channel: "Email + in-system notification"
    to: "Data Protection Officer"
    trigger: "[[UC:break-glass-alert]]"
    subject: "[SHP] Emergency access requires review"
    body: "<<Doctor>> (<<Department>>) used emergency access to record <<Patient ID>> at <<Time>>. Reason: <<Reason>>. Review at: <<Link>>."
    notes: ["The email does not contain the patient's full name."]
