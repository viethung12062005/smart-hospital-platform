# Chapter 6 (Other requirements), 7 (Integration), 8 (Data migration).
other:
  - name: Common input field conventions
    intro: The interface uses the Mantine component library; the table below gives the common conventions, and individual screens state only what differs.
    table:
      header: ["Field type", "Convention"]
      widths: [4.0, 12.5]
      rows:
        - ["Single-line text", "Trim leading/trailing whitespace; show a character counter when 20 characters or fewer remain."]
        - ["Multi-line text", "Preserve line breaks; HTML is not allowed; output is encoded."]
        - ["Date", "Shown as DD/MM/YYYY; stored as ISO 8601; dates outside the valid range cannot be selected."]
        - ["Date and time", "Shown as HH:mm DD/MM/YYYY in the Asia/Ho_Chi_Minh time zone; stored in UTC."]
        - ["Phone number", "Normalized to the +84 form; shown with the 4 middle digits masked in staff-facing lists."]
        - ["Select lists", "Values come from the system code sets (contracts/terminology); labels are shown in the user's language."]
        - ["Submit buttons", "Disabled while awaiting the response; create operations always carry an Idempotency-Key."]
  - name: Message configuration
    table:
      header: ["Message type", "Display"]
      widths: [4.0, 12.5]
      rows:
        - ["Field-level error (IEM)", "Red text directly below the failing field, with a red field border; readable by screen readers (aria-describedby)."]
        - ["Error message (EMSG)", "An alert box with a \"Close\" button; it does not close automatically; it contains no technical details; it includes a reference code (shortened trace-id) for support."]
        - ["Confirmation dialog (CFD)", "Title \"Confirm\", a primary button and a \"Cancel\" button; clicking outside does not close it; destructive actions use a warning-colored button."]
        - ["Success message (SMSG)", "A corner toast that closes automatically after 5 seconds."]
  - name: Lists and pagination
    bullets:
      - "Per [[CBR:pagination]]; show the total number of records when it can be computed cheaply, otherwise show \"Next page\"."
      - "Long columns are truncated with \"...\" and a tooltip; sortable column headers show an arrow icon."
      - "In-list search uses \"contains\" logic, ignoring diacritics and letter case; an empty search box restores the defaults."
      - "No bulk actions on clinical data (no bulk deletion or export of records)."
  - name: Language, formatting and accessibility
    bullets:
      - "Vietnamese by default, English optional; every interface string and API error message has a translation."
      - "Meets WCAG 2.1 AA on the patient portal (contrast, keyboard navigation, field labels) - NFR-U1."
      - "The interface is responsive from 360 px; the main patient actions work on a phone."

integration:
  intro: >-
    The system integrates with the following external systems. Every integration uses an encrypted connection, authentication
    with a managed identity (no passwords stored in code), and sends no more data than necessary.
  rows:
    - ["Identity provider (Keycloak)", "Inbound", "OIDC, Authorization Code + PKCE; JWT tokens with roles, fhirUser, amr", "Cannot log in: show a message; there is no fallback login mode that bypasses MFA."]
    - ["Messaging provider", "Outbound", "HTTPS API for email/SMS/push; content follows message templates and contains no clinical data", "Retry 5 times, fallback channel, dead-letter queue + alert."]
    - ["Language model providers (DeepSeek, Gemini)", "Outbound", "OpenAI-compatible HTTPS API; text with identifiers masked", "Fallback model chain, local model (Ollama), and finally a response that does not use AI."]
    - ["Malware scanning (Defender for Storage / ClamAV)", "Outbound/Inbound", "Scan-result events through a queue", "Until a scan result exists, the document is \"pending-scan\" and cannot be used."]
    - ["Azure Service Bus / RabbitMQ", "Internal", "CloudEvents between services (topic shp-events)", "Outbox/inbox, retry, dead-letter."]
    - ["Azure Monitor / Application Insights", "Outbound", "OpenTelemetry (traces, metrics, logs without PII)", "A connection loss does not affect business operations."]

migration:
  intro: >-
    Data migration from a legacy system is not applicable within the project scope. The system starts with synthetic data generated
    according to docs/00-synthetic-data.md; the data loader (DAT-03) calls public APIs, so every business rule, authorization check and
    audit applies.
  scope:
    - "Synthetic data: patients, doctors, schedules, appointments, encounters, vital signs, diagnoses, sample documents - in Vietnamese, at first-year scale."
    - "Code sets: specialties, cancellation reasons, ICD-10, LOINC vital signs, document types (contracts/terminology)."
    - "Before going live: a separate data migration SRS and a data processing impact assessment (NFR-SEC21) are required."
  mapping: "N/A within the current scope."
