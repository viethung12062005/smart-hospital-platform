# Chapter 4 - Screens. components: [Component, Type, Editable, Required, Default, Description]
screens_intro: >-
  This chapter describes the screens and their components, linked to the use cases in Chapter 3 and the site map in Chapter 2.
  Mockup images come from the web interface under development (synthetic-data mode) or from sketches; colors and fonts follow
  the web interface design system. Every screen that displays patient data follows [[CBR:no-pii]] and [[CMUC:session]].

screens:
  - portal: Patient portal
    items:
      - key: register
        name: Create an account
        purpose: A new patient enters administrative information and accepts the data processing terms.
        access: "After creating an account with a phone number or email and verifying it, first login while no record exists."
        uc: [register, manage-consent]
        components:
          - ["Full name", "Textbox", "Yes", "Yes", "N/A", "2-100 characters."]
          - ["Date of birth", "Date picker", "Yes", "Yes", "N/A", "Not in the future."]
          - ["Gender", "Dropdown", "Yes", "Yes", "N/A", "Male, Female, Other, Unknown."]
          - ["Phone number", "Textbox", "Yes", "Yes", "From the account if registered by phone", "Not editable when taken from the account; a newly entered number (email account) must be verified with an OTP code."]
          - ["OTP code", "Textbox", "Yes*", "Yes*", "Empty", "*Shown only when the phone number needs verification; 6 digits, expires after 5 minutes."]
          - ["Email", "Label", "No", "N/A", "From the account (if any)", "Not editable."]
          - ["Accept the data processing terms", "Checkbox", "Yes", "Yes", "Unchecked", "Must be checked to submit; link to view the full terms."]
          - ["Allow processing data with AI", "Checkbox", "Yes", "No", "Unchecked", "Separate option, with an explanation."]
          - ["Create account", "Button", "N/A", "N/A", "N/A", "Triggers [[UC:register]]."]
      - key: claim-record
        name: Claim an existing record
        purpose: A person who has visited the hospital links their account to the old record using an OTP code.
        access: "After first login -> \"I have visited the hospital before\"; or from the suggestion when registration finds a duplicate record."
        uc: [claim-record]
        components:
          - ["Full name", "Textbox", "Yes", "Yes", "Empty", "As on the hospital record."]
          - ["Date of birth", "Date picker", "Yes", "Yes", "Empty", "Not in the future."]
          - ["Phone number registered at the hospital", "Textbox", "Yes", "Yes", "Empty", "Vietnamese format; the OTP code is sent only to the number stored in the record."]
          - ["OTP code", "Textbox", "Yes*", "Yes*", "Empty", "*Shown after submitting the request; 6 digits, expires after 5 minutes."]
          - ["Send by SMS", "Link", "Yes*", "N/A", "N/A", "*Shown after 30 seconds if the code has not arrived via Zalo."]
          - ["Submit request", "Button", "N/A", "N/A", "N/A", "Triggers [[UC:claim-record]]."]
      - key: relatives
        name: Relatives' records
        purpose: View, add and revoke the records managed by the account (children, relatives).
        access: "Home -> \"Relatives' records\"."
        uc: [add-dependent, link-relative, revoke-link]
        data_source: "Links of the current account that are \"active\" or \"pending\"."
        sorting: "Self first, then by full name."
        components:
          - ["Record list", "Grid", "No", "N/A", "N/A", "Full name, relationship, scope, expiry date; records nearing expiry carry a renewal reminder label."]
          - ["Add child", "Button", "N/A", "N/A", "N/A", "Opens the record form for a person under 16 ([[UC:add-dependent]])."]
          - ["Add relative", "Button", "N/A", "N/A", "N/A", "Opens the adult-link form: full name, date of birth, phone number, scope ([[UC:link-relative]])."]
          - ["Revoke", "Button", "N/A", "N/A", "N/A", "With confirmation; triggers [[UC:revoke-link]]."]
      - key: find-doctor
        name: Find a doctor and a time slot
        purpose: Find free time slots by specialty, doctor and date.
        access: "Home -> \"Book an appointment\"."
        uc: [find-slot, book]
        data_source: "\"free\" slots of active schedules whose [Start] falls in the selected date range and is <= <Today> + 30 days."
        sorting: "By doctor, then by [Start] ascending."
        components:
          - ["Specialty", "Dropdown", "Yes", "Yes*", "Empty", "*Required if no doctor is selected."]
          - ["Doctor", "Searchable dropdown", "Yes", "No", "All", "Filtered by specialty."]
          - ["From date / To date", "Date picker", "Yes", "Yes", "Today / +7 days", "At most 31 days, and no more than 30 days ahead."]
          - ["Time slot list", "Grid", "No", "N/A", "N/A", "Grouped by doctor and date; each cell is one start time."]
          - ["Book", "Button", "N/A", "N/A", "N/A", "Opens [[SCR:book]] with the selected slot."]
      - key: book
        name: Confirm the booking
        purpose: Confirm the slot and the visit reason.
        access: "Select a time slot on [[SCR:find-doctor]]."
        uc: [book, reschedule]
        components:
          - ["Doctor, specialty, date and time", "Label", "No", "N/A", "From the slot", "Read-only."]
          - ["Patient attending", "Dropdown / Search", "Yes", "Yes", "Self", "The patient chooses among the linked records (self, child, relative); a Nurse searches for the patient."]
          - ["Visit reason", "Textarea", "Yes", "No", "Empty", "At most 500 characters."]
          - ["Confirm", "Button", "N/A", "N/A", "N/A", "Sent with an Idempotency-Key; disabled while awaiting the response."]
      - key: chatbot
        name: Booking chatbot
        purpose: Book or cancel by conversation with confirmation.
        access: "Home -> \"Book an appointment\" -> \"Chat to book\"."
        uc: [chatbot-booking]
        components:
          - ["Conversation pane", "Chat", "No", "N/A", "Greeting", "Bot messages carry an AI label."]
          - ["Pending-action card", "Card", "No", "N/A", "N/A", "The \"Confirm\" / \"Cancel\" buttons are drawn by the interface; 5-minute countdown."]
          - ["Input box", "Textbox", "Yes", "N/A", "Empty", "At most 500 characters."]
      - key: my-appointments
        name: My appointments
        purpose: View, cancel and reschedule the user's own appointments.
        access: "Home -> \"My appointments\"."
        uc: [my-appointments, cancel, reschedule]
        data_source: "Appointments whose [Patient] = <Current user>; tabs \"Upcoming\" (booked) and \"Past\"."
        sorting: "Upcoming: [Start] ascending; Past: descending."
        components:
          - ["Appointment ID, time, doctor, specialty, status", "Grid", "No", "N/A", "N/A", "Status is shown as a colored label."]
          - ["Cancel appointment", "Button", "N/A", "N/A", "N/A", "Enabled only when \"booked\" and at least 2 hours remain; triggers [[UC:cancel]]."]
          - ["Reschedule", "Button", "N/A", "N/A", "N/A", "Same conditions as Cancel appointment; triggers [[UC:reschedule]]."]
      - key: my-documents
        name: My documents
        purpose: View documents released by the doctor.
        access: "Home -> \"My documents\"."
        uc: [download-document]
        data_source: "Documents of <Current user>, \"available\" and released."
        sorting: "Release date descending."
        components:
          - ["Type, date, issuing doctor", "Grid", "No", "N/A", "N/A", ""]
          - ["View", "Button", "N/A", "N/A", "N/A", "Requests a 5-minute link and then opens the file."]
      - key: my-profile
        name: Personal information
        purpose: View and edit the administrative information that may be changed.
        access: "Account -> \"Personal information\"."
        uc: [update-profile]
      - key: notification-preferences
        name: Notification settings
        purpose: Choose channels, language and quiet hours.
        access: "Account -> \"Notifications\"."
        uc: [notification-preferences]
      - key: privacy
        name: Privacy
        purpose: Manage consent to AI processing of data; request a copy of personal data.
        access: "Account -> \"Privacy\"."
        uc: [manage-consent, export-my-data]
        components:
          - ["Allow processing data with AI", "Toggle", "Yes", "N/A", "As chosen at registration", "With an explanation of the scope; turning it off requires confirmation."]
          - ["Consent history", "Grid", "No", "N/A", "N/A", "Time, terms version, action."]
          - ["Request a copy of my data", "Button", "N/A", "N/A", "N/A", "Requires reauthentication; triggers [[UC:export-my-data]]."]
      - key: my-access-log
        name: Record access history
        purpose: See who has accessed the user's own record.
        access: "Account -> \"Record access history\"."
        uc: [view-my-access-log]
        data_source: "Audit entries whose [Patient] = <Current user>, in the last 12 months."
        sorting: "Time descending."
  - portal: Internal portal
    items:
      - key: queue
        name: Today's queue
        purpose: Track appointments for the day, check in, cancel or reschedule on the patient's behalf.
        access: "Reception -> \"Today's queue\"."
        uc: [check-in, supplement-national-id, book, cancel, reschedule]
        data_source: "Appointments with visit date = <Today> for doctors in the departments the user is assigned to."
        sorting: "[Start] ascending."
        components:
          - ["Time, patient, doctor, status", "Grid", "No", "N/A", "N/A", "Patient name + year of birth; phone number with the 4 middle digits masked."]
          - ["No-show risk", "Badge", "No", "N/A", "N/A", "Shown when the risk is >= the threshold; the number is never shown to the patient."]
          - ["Check-in", "Button", "N/A", "N/A", "N/A", "Enabled when \"booked\" and the visit date is today."]
          - ["Add national ID", "Button", "N/A", "N/A", "N/A", "Shown when the record has no national ID number; opens the national ID input with a consent checkbox ([[UC:supplement-national-id]])."]
          - ["Book on behalf", "Button", "N/A", "N/A", "N/A", "Opens [[SCR:find-doctor]] in Nurse mode."]
      - key: schedule
        name: Schedules and slots
        purpose: Create schedules and weekly templates, generate and block slots; doctors view their own schedule.
        access: "Schedules."
        uc: [schedule-template, generate-slots, block-slot, view-own-schedule]
      - key: patient-form
        name: Patient record (reception)
        purpose: Create, edit and merge patient records at the counter.
        access: "Reception -> \"Patient records\"."
        uc: [create-patient, merge-patient]
      - key: patient-search
        name: Patient search
        purpose: Find patients and open their timeline according to permissions.
        access: "Patients -> \"Search\"."
        uc: [search-patient, view-timeline]
        components:
          - ["Keyword", "Textbox", "Yes", "Yes", "Empty", "Name (>= 3 characters, without diacritics), phone number, patient ID."]
          - ["Year of birth", "Number", "Yes", "No", "Empty", "Narrows the results."]
          - ["Results", "Grid", "No", "N/A", "N/A", "At most 50 rows: full name, year of birth, sex, ID, masked phone number."]
      - key: timeline
        name: Patient timeline
        purpose: Visit history, vital signs, diagnoses, allergies, documents.
        access: "Select a patient on [[SCR:patient-search]]."
        uc: [view-timeline, break-glass, summarize, upload-document, download-document, release-document, void-document]
        components:
          - ["Patient card", "Panel", "No", "N/A", "N/A", "Full name, age, sex, allergies, underlying conditions."]
          - ["Emergency access banner", "Banner", "No", "N/A", "Hidden", "Shown when emergency access is in use, with the expiry time."]
          - ["Timeline", "Timeline", "No", "N/A", "12 months", "Filter by type and time; abnormal values are highlighted."]
          - ["AI summary", "Button + Panel", "N/A", "N/A", "N/A", "Doctor only; label \"AI-generated, needs review\"."]
          - ["Upload a document", "Button", "N/A", "N/A", "N/A", "Triggers [[UC:upload-document]]."]
      - key: encounter
        name: Encounter
        purpose: Record vital signs, history and diagnoses; finish and add an addendum to the encounter.
        access: "Today's encounter list -> \"Start the encounter\"."
        uc: [record-vitals, start-encounter, record-diagnosis, finish-encounter, addendum]
        components:
          - ["Vital signs", "Number group", "Yes", "No", "Empty", "Fixed units; range validation."]
          - ["History / examination", "Rich textarea", "When \"in-progress\"", "No", "Empty", "At most 10,000 characters."]
          - ["ICD-10 diagnosis", "Searchable list", "When \"in-progress\"", "Yes (>= 1 primary)", "Empty", "Search by code or name."]
          - ["Finish the encounter", "Button", "N/A", "N/A", "N/A", "With a confirmation dialog."]
          - ["Add an addendum", "Button", "N/A", "N/A", "N/A", "Only when \"finished\"."]
      - key: assistant
        name: Ask the knowledge assistant
        purpose: Question answering with citations from approved internal documents.
        access: "AI assistant -> \"Ask the assistant\"."
        uc: [ask-assistant, answer-feedback]
        components:
          - ["Question box", "Textarea", "Yes", "Yes", "Empty", "3-2000 characters; warning not to enter identifying patient information."]
          - ["Answer", "Stream text", "No", "N/A", "N/A", "Citation numbers [1], [2] open the source passage; AI label."]
          - ["Helpful / Not helpful", "Button", "N/A", "N/A", "N/A", "Triggers [[UC:answer-feedback]]."]
      - key: extraction-review
        name: Review document extraction
        purpose: The queue and the screen for reviewing each extracted field.
        access: "AI assistant -> \"Review extractions\"."
        uc: [review-extraction]
        components:
          - ["Document image", "Viewer", "No", "N/A", "N/A", "Highlights the region of the selected field."]
          - ["Field list", "Editable grid", "Yes", "N/A", "Not yet confirmed", "Value, unit, confidence; per-row Confirm/Edit/Discard status."]
          - ["Save the result / Reject all", "Button", "N/A", "N/A", "N/A", "There is no \"Accept all\"."]
      - key: kb
        name: Knowledge base
        purpose: Manage the assistant's source documents.
        access: "AI assistant -> \"Knowledge base\"."
        uc: [manage-kb]
      - key: users
        name: Users
        purpose: Invite staff, assign roles, lock/unlock accounts, link doctors.
        access: "Administration -> \"Users\"."
        uc: [invite-staff, lock-account, link-practitioner]
      - key: audit
        name: Access audit
        purpose: Search and export audit reports; review emergency access; process patient requests.
        access: "Administration -> \"Audit\"."
        uc: [search-audit, export-audit, process-data-request, break-glass-alert]
        components:
          - ["Filters", "Form", "Yes", "Yes (time range)", "Last 24 hours", "Patient, accessor, action, result, purpose; at most 92 days."]
          - ["Results", "Grid", "No", "N/A", "N/A", "No clinical content columns; IP with the last octet masked."]
          - ["Export CSV", "Button", "N/A", "N/A", "N/A", "Requires entering a purpose."]
          - ["\"Needs review\" tab", "Tab", "N/A", "N/A", "N/A", "Unreviewed emergency access; \"Mark as reviewed\" button."]
      - key: dead-letters
        name: Failed notifications
        purpose: View and resend reminders that failed permanently.
        access: "Administration -> \"Failed notifications\"."
        uc: [manage-dead-letters]
