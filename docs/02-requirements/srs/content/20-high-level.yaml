  workflow_intro: >-
    This section describes each actor's sequence of work to complete a business process, together with the conditions for moving to
    the next step or returning to the previous step.
  workflows:
    - key: outpatient
      name: Outpatient visit process
      lanes: [Patient, Nurse, Doctor, System]
      steps:
        - {n: 1, lane: 0, text: "Find a free time slot and book\n(or a nurse books on their behalf)"}
        - {n: 2, lane: 3, text: "Create a \"booked\" appointment,\nschedule reminders, predict no-show"}
        - {n: 3, lane: 3, kind: decision, text: "Visit time reached?", branches: [{to: 4, label: "Yes, patient arrived"}, {to: 10, label: "Past the time, no-show"}]}
        - {n: 4, lane: 1, text: "Check-in, measure vital signs"}
        - {n: 5, lane: 2, text: "Open the encounter, record history,\ndiagnosis"}
        - {n: 6, lane: 1, text: "Upload results and paperwork"}
        - {n: 7, lane: 2, text: "Finish the encounter,\nrelease the necessary documents"}
        - {n: 8, lane: 3, text: "Encounter \"finished\",\nappointment \"fulfilled\""}
        - {n: 9, lane: 0, text: "View released documents", end: true}
        - {n: 10, lane: 3, text: "Mark \"noshow\", free the\nslot, update ML data", end: true}
      explanation:
        - "The patient books on the patient portal, or a nurse books on their behalf at the counter/by phone. The system checks BR-01..04, creates the appointment and emits a \"booked\" event."
        - "From that event, the system schedules T-24h and T-2h reminders and computes no-show risk; for high risk it adds a T-6h reminder and flags it for the nurse."
        - "The patient can cancel or reschedule until 2 hours before the visit; after that point only a nurse can. Cancelling the appointment also cancels its reminders."
        - "When the patient arrives, the nurse checks in (appointment \"arrived\", encounter created) and measures vital signs; the doctor opens the encounter, records history and diagnosis, and can view the record summary and ask the knowledge assistant."
        - "When the encounter is finished the encounter record is locked for editing; additions require an addendum record. Documents become visible to the patient only after the doctor releases them."
        - "If 30 minutes past the visit time have elapsed without check-in, a scheduled job marks the appointment \"noshow\"."
    - key: documents
      name: Document and data extraction process
      lanes: [Nurse / Doctor, System, Approver (DD / BS), Patient]
      steps:
        - {n: 1, lane: 0, text: "Select a file, request upload permission"}
        - {n: 2, lane: 1, text: "Check permission, issue a\nshort-lived upload link"}
        - {n: 3, lane: 0, text: "Upload the file directly\nto storage"}
        - {n: 4, lane: 1, kind: decision, text: "Correct type, <= 20 MB,\nmalware-free?", branches: [{to: 5, label: "Yes"}, {to: 9, label: "No"}]}
        - {n: 5, lane: 1, text: "Document \"available\";\nOCR, classification, field extraction"}
        - {n: 6, lane: 2, text: "Confirm / edit / reject\neach extracted field"}
        - {n: 7, lane: 1, text: "Write confirmed fields to the record,\nwrite audit"}
        - {n: 8, lane: 3, text: "Download released documents\nthrough a 5-minute link", end: true}
        - {n: 9, lane: 1, text: "Reject or quarantine the file,\nnotify the uploader", end: true}
      explanation:
        - "The uploader does not send the file through the API; they receive an upload link that can write exactly one file and is valid for 10 minutes."
        - "A file of the wrong type, over 20 MB or infected with malware is rejected/quarantined and is never used for extraction or display."
        - "Extraction results are never written to the record automatically: an authorized person must confirm each field (BR-10)."
        - "Patients see only their own documents that the doctor has released; every download link issued is audited."
    - key: break-glass
      name: Emergency access and monitoring process
      lanes: [Doctor, System, Data Protection Officer]
      steps:
        - {n: 1, lane: 0, text: "Open a patient record\nwithout a treatment relationship"}
        - {n: 2, lane: 1, text: "Deny, offer\nemergency access"}
        - {n: 3, lane: 0, text: "Enter a reason, confirm"}
        - {n: 4, lane: 1, text: "Grant access for 60 minutes,\naudit with purpose \"break-glass\""}
        - {n: 5, lane: 2, text: "Receive an alert within <= 5 minutes,\nreview the reason", end: true}
      explanation:
        - "Emergency access is available only to doctors, requires a reason of at least 10 characters, and grants access for 60 minutes to exactly one patient."
        - "Every action during this period is audited with purpose \"break-glass\"; the DPO receives an alert and must review it."

  state_intro: >-
    This section describes system behavior through changes in the state of data objects. Rounded boxes are states; an arrow
    connecting two states is the action that causes the transition, usually triggered by an actor. A transition not present
    in the diagram is rejected with the error "invalid-state-transition".
  state_machines:
    - key: appointment
      name: Appointment states
      initial: booked
      finals: [fulfilled, cancelled, noshow]
      states:
        - {key: booked, label: booked, col: 1, row: 0, meaning: "Booked, the slot is occupied"}
        - {key: arrived, label: arrived, col: 1, row: 1, meaning: "Patient has checked in, the encounter has been created"}
        - {key: fulfilled, label: fulfilled, col: 1, row: 2, meaning: The encounter has finished}
        - {key: cancelled, label: cancelled, col: 0, row: 1, meaning: Cancelled; the slot returns to free; reminders are cancelled}
        - {key: noshow, label: noshow, col: 2, row: 1, meaning: 30 minutes past the time without check-in}
      transitions:
        - {from: booked, to: arrived, label: "Check-in (DD)"}
        - {from: arrived, to: fulfilled, label: "Finish the encounter (BS)"}
        - {from: booked, to: cancelled, label: "Cancel (patient >= 2h / nurse)\nor reschedule"}
        - {from: booked, to: noshow, label: "Job: 30 minutes past the time"}
    - key: slot
      name: Slot states
      initial: free
      finals: []
      states:
        - {key: free, label: free, col: 0, row: 0, meaning: "Available, can be booked"}
        - {key: busy, label: busy, col: 2, row: 0, meaning: Has an active appointment}
        - {key: blocked, label: busy-unavailable, col: 1, row: 1, meaning: "Blocked (leave, meeting); cannot be booked"}
      transitions:
        - {from: free, to: busy, label: Book}
        - {from: busy, to: free, label: "Cancel / reschedule"}
        - {from: free, to: blocked, label: Block slot}
        - {from: blocked, to: free, label: Unblock}
    - key: encounter
      name: Encounter states
      initial: arrived
      finals: [finished]
      states:
        - {key: arrived, label: arrived, col: 0, row: 0, meaning: "Checked in, waiting for examination"}
        - {key: in-progress, label: in-progress, col: 1, row: 0, meaning: Doctor is examining; history and diagnosis can be edited}
        - {key: finished, label: finished, col: 2, row: 0, meaning: "Finished; read-only, only addendum records can be added"}
      transitions:
        - {from: arrived, to: in-progress, label: "Open the encounter (BS)"}
        - {from: in-progress, to: finished, label: "Finish (BS)"}
    - key: document
      name: Document states
      initial: pending
      finals: [entered-in-error]
      states:
        - {key: pending, label: pending-scan, col: 0, row: 0, meaning: "Uploaded, malware scanning in progress"}
        - {key: available, label: available, col: 1, row: 0, meaning: "Clean, usable; not yet visible to the patient"}
        - {key: released, label: "available + released", col: 2, row: 0, meaning: Released to the patient}
        - {key: quarantined, label: quarantined, col: 0, row: 1, meaning: Malware infected; visible only to security administrators}
        - {key: entered-in-error, label: entered-in-error, col: 1, row: 1, meaning: "Marked as entered in error; hidden by default, not deleted"}
      transitions:
        - {from: pending, to: available, label: Scan clean}
        - {from: pending, to: quarantined, label: Malware detected}
        - {from: available, to: released, label: "Release (BS)"}
        - {from: available, to: entered-in-error, label: "Mark as entered in error"}
        - {from: released, to: entered-in-error, label: "Mark as entered in error"}
    - key: extraction
      name: Document extraction states
      initial: queued
      finals: [accepted, rejected, failed]
      states:
        - {key: queued, label: queued, col: 0, row: 0, meaning: Waiting for processing}
        - {key: processing, label: processing, col: 1, row: 0, meaning: "OCR, classification, field extraction"}
        - {key: review, label: needs-review, col: 2, row: 0, meaning: Waiting for human confirmation}
        - {key: accepted, label: accepted, col: 2, row: 1, meaning: Confirmed fields have been written to the record}
        - {key: rejected, label: rejected, col: 3, row: 1, meaning: The approver rejected everything}
        - {key: failed, label: failed (dead-letter), col: 1, row: 1, meaning: Failed after 5 attempts; does not block the upload}
      transitions:
        - {from: queued, to: processing, label: Worker picks up the job}
        - {from: processing, to: review, label: Extraction complete}
        - {from: processing, to: failed, label: "Failed more than 5 times"}
        - {from: review, to: accepted, label: "Confirm"}
        - {from: review, to: rejected, label: "Reject"}
    - key: reminder
      name: Appointment reminder states
      initial: scheduled
      finals: [sent, cancelled, failed]
      states:
        - {key: scheduled, label: scheduled, col: 1, row: 0, meaning: Scheduled for sending}
        - {key: sent, label: sent, col: 0, row: 1, meaning: Accepted by the provider}
        - {key: cancelled, label: cancelled, col: 1, row: 1, meaning: Appointment cancelled/rescheduled before the reminder time}
        - {key: failed, label: failed (dead-letter), col: 2, row: 1, meaning: Failed after 5 attempts and all fallback channels}
      transitions:
        - {from: scheduled, to: sent, label: Sent successfully}
        - {from: scheduled, to: cancelled, label: "Appointment cancelled / rescheduled"}
        - {from: scheduled, to: failed, label: "Retries exhausted"}
        - {from: failed, to: scheduled, label: "Admin resends"}

  uc_intro: >-
    The use case diagram (UML) shows what goal an actor interacts with the system to achieve. An ellipse inside the system
    boundary is a use case; a stick figure is an actor; a connecting line means the actor can perform that use case. The specific data scope (own
    data only, only patients with a treatment relationship) is defined in the access control matrix.

  site_maps:
    - key: patient
      name: Patient portal site map
      tree:
        label: Patient home
        children:
          - label: Book an appointment
            children: [{label: Find a doctor & time slot}, {label: Confirm booking}, {label: Booking chatbot}]
          - label: My appointments
            children: [{label: Appointment details}, {label: Reschedule}]
          - label: My documents
          - label: Account
            children: [{label: Personal information}, {label: Notifications}, {label: Privacy}, {label: Record access history}]
      pages:
        - ["Patient home", "Upcoming appointments, booking shortcut, newly released documents.", "Patient"]
        - ["Find a doctor & time slot", "Filter by specialty, doctor, date; view free time slots. Link [[SCR:find-doctor]].", "Patient, Nurse"]
        - ["Confirm booking", "Confirm the slot and reason for visit. Link [[SCR:book]].", "Patient, Nurse"]
        - ["Booking chatbot", "Book by conversation. Link [[SCR:chatbot]].", "Patient"]
        - ["My appointments", "Appointment list, cancel and reschedule. Link [[SCR:my-appointments]].", "Patient"]
        - ["My documents", "Released documents, download. Link [[SCR:my-documents]].", "Patient"]
        - ["Personal information", "Update administrative information. Link [[SCR:my-profile]].", "Patient"]
        - ["Notifications", "Reminder channels, quiet hours. Link [[SCR:notification-preferences]].", "Patient"]
        - ["Privacy", "Consent to AI data processing, data export requests. Link [[SCR:privacy]].", "Patient"]
        - ["Record access history", "Who viewed my record, when, and for what purpose. Link [[SCR:my-access-log]].", "Patient"]
    - key: internal
      name: Internal portal site map
      tree:
        label: Staff home
        children:
          - label: Reception
            children: [{label: Today's queue}, {label: Book on behalf}, {label: Patient records}]
          - label: Schedules
            children: [{label: Schedules & weekly templates}, {label: Slot}]
          - label: Patients
            children: [{label: Search}, {label: Timeline}, {label: Encounter}, {label: Documents}]
          - label: AI assistant
            children: [{label: Ask the assistant}, {label: Review extractions}, {label: Knowledge base}]
          - label: Administration
            children: [{label: Users}, {label: Audit}, {label: Error notifications}]
      pages:
        - ["Staff home", "Role-specific content: queue (nurse), today's schedule (doctor), alerts (admin/DPO).", "All staff"]
        - ["Today's queue", "Appointments for the day, check-in, flag no-show risk. Link [[SCR:queue]].", "Nurse"]
        - ["Schedules & weekly templates, Slot", "Create schedules, weekly templates, generate and block slots. Link [[SCR:schedule]].", "Nurse, Administrator; Doctors view only their own schedule"]
        - ["Patient records", "Create/edit/merge records. Link [[SCR:patient-form]].", "Nurse"]
        - ["Patient search", "Search by unaccented name, phone number, ID, date of birth. Link [[SCR:patient-search]].", "Doctor, Nurse"]
        - ["Timeline, Encounter, Documents", "Visit history, vital signs, diagnoses, documents. Link [[SCR:timeline]], [[SCR:encounter]].", "Doctor (treatment relationship / emergency), Nurse"]
        - ["Ask the assistant", "Q&A with citations. Link [[SCR:assistant]].", "Doctor, Nurse"]
        - ["Review extractions", "Review queue and review screen. Link [[SCR:extraction-review]].", "Doctor (treatment relationship), Nurse"]
        - ["Knowledge base", "Manage the assistant's source documents. Link [[SCR:kb]].", "Administrator"]
        - ["Users", "Invite, assign roles, lock, link doctors. Link [[SCR:users]].", "Administrator"]
        - ["Audit", "Search and export access reports. Link [[SCR:audit]].", "Data Protection Officer, Administrator"]
        - ["Error notifications", "Permanently failed reminders, resend. Link [[SCR:dead-letters]].", "Administrator"]

