# Chapter 2 - High-level requirements.
high_level:
  intro: >-
    This chapter gives an overview of the functions and business processes through diagrams: user types, their permissions on each
    function, and the sequence of steps required to complete a process. This is the overview level; the detailed specification is in Chapter 3.
  ord:
    intro: >-
      The diagram shows the static relationships between actors and data objects, between the objects themselves, and with external systems.
      An object is a data entity in the system; each service owns its own data and is the only place that decides
      permissions on that data.
    nodes:
      - {key: a-dpo, label: Data Protection Officer, kind: actor, col: 0, row: 0}
      - {key: a-nurse, label: Nurse, kind: actor, col: 1, row: 0}
      - {key: a-patient, label: Patient, kind: actor, col: 2, row: 0}
      - {key: a-doctor, label: Doctor, kind: actor, col: 3, row: 1}
      - {key: a-admin, label: Administrator, kind: actor, col: 7, row: 2}
      - {key: audit, label: Audit entry, kind: object, col: 0, row: 1}
      - {key: patient, label: Patient (Patient), kind: object, col: 1, row: 1}
      - {key: appointment, label: Appointment, kind: object, col: 2, row: 1}
      - {key: slot, label: Slot, kind: object, col: 4, row: 1}
      - {key: schedule, label: Schedule, kind: object, col: 5, row: 1}
      - {key: practitioner, label: Doctor (Practitioner), kind: object, col: 6, row: 1}
      - {key: consent, label: Data processing consent, kind: object, col: 0, row: 2}
      - {key: reminder, label: Appointment reminder, kind: object, col: 1, row: 2}
      - {key: encounter, label: Encounter, kind: object, col: 2, row: 2}
      - {key: prediction, label: No-show prediction, kind: object, col: 3, row: 2}
      - {key: account, label: Account, kind: object, col: 6, row: 2}
      - {key: messaging, label: Messaging provider, kind: external, col: 0, row: 3}
      - {key: observation, label: Vital signs / results, kind: object, col: 1, row: 3}
      - {key: document, label: Clinical document, kind: object, col: 2, row: 3}
      - {key: condition, label: Diagnosis / allergy, kind: object, col: 3, row: 3}
      - {key: idp, label: Identity provider, kind: external, col: 6, row: 3}
      - {key: malware, label: Malware scanning, kind: external, col: 1, row: 4}
      - {key: extraction, label: Extraction result, kind: object, col: 2, row: 4}
      - {key: llm, label: Language model, kind: external, col: 3, row: 4}
      - {key: conversation, label: Assistant conversation, kind: object, col: 4, row: 4}
      - {key: kb, label: Knowledge base, kind: object, col: 5, row: 4}
    links:
      - {from: a-patient, to: appointment, label: "book / cancel"}
      - {from: a-nurse, to: patient, label: "create / merge"}
      - {from: a-doctor, to: encounter, label: record}
      - {from: a-admin, to: account, label: manage}
      - {from: a-dpo, to: audit, label: search}
      - {from: appointment, to: patient, label: of}
      - {from: appointment, to: slot, label: occupies}
      - {from: slot, to: schedule, label: belongs to}
      - {from: schedule, to: practitioner, label: of}
      - {from: consent, to: patient, label: of}
      - {from: encounter, to: appointment, label: from}
      - {from: observation, to: encounter, label: belongs to}
      - {from: condition, to: encounter, label: belongs to}
      - {from: account, to: practitioner, label: links}
      - {from: account, to: idp, label: identifies}
      - {from: reminder, to: appointment, label: reminds}
      - {from: reminder, to: messaging, label: sent via}
      - {from: document, to: encounter, label: attached to}
      - {from: document, to: malware, label: scanned by}
      - {from: extraction, to: document, label: extracted from}
