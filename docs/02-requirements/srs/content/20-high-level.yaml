permissions:
  intro: >-
    The matrix maps functions to roles. Permissions are checked at the service that owns the data, default deny; the machine-readable
    version of the matrix (contracts/authz/matrix.yaml) is the single source for code and automated tests - each cell has at least one test.
  legend:
    - '"O": has permission. See the corresponding use case for detailed behavior.'
    - '"O*": only on one''s own data and records linked within the correct scope (patient: their own record, appointments, documents or those of a linked relative; doctor: their own schedule).'
    - '"Care": only for patients with a treatment relationship (appointment/encounter within 12 months or a future appointment).'
    - '"Care/BG": as Care, or through an active emergency access grant.'
    - '"X": no permission. The request is denied and audited.'
  rows:
    - {function: Register a patient account, uc: [register], grant: {patient: O}}
    - {function: Claim an existing record, uc: [claim-record], grant: {patient: O}}
    - {function: "Create a child record, link and revoke relative records", uc: [add-dependent, link-relative, revoke-link], grant: {patient: "O*", nurse: O}}
    - {function: View / edit administrative information, uc: [update-profile, create-patient], grant: {patient: "O*", nurse: O}}
    - {function: Merge duplicate records, uc: [merge-patient], grant: {nurse: O}}
    - {function: Find doctors and free slots, uc: [find-slot], grant: {patient: O, doctor: O, nurse: O, admin: O}}
    - {function: Book an appointment, uc: [book], grant: {patient: "O*", nurse: O}}
    - {function: Cancel / reschedule an appointment, uc: [cancel, reschedule], grant: {patient: "O* (>= 2h)", nurse: O}}
    - {function: View appointments, uc: [my-appointments, view-own-schedule], grant: {patient: "O*", doctor: "O*", nurse: O}}
    - {function: "Create schedules, weekly templates, generate / block slots", uc: [schedule-template, generate-slots, block-slot], grant: {nurse: O, admin: O}}
    - {function: Add the national ID number at visit time, uc: [supplement-national-id], grant: {nurse: O}}
    - {function: Check-in, uc: [check-in], grant: {nurse: O}}
    - {function: Record vital signs, uc: [record-vitals], grant: {doctor: Care, nurse: O}}
    - {function: "Open the encounter, record history and diagnosis, finish, addendum", uc: [start-encounter, record-diagnosis, finish-encounter, addendum], grant: {doctor: Care}}
    - {function: "Search patients (name, year of birth)", uc: [search-patient], grant: {doctor: O, nurse: O}}
    - {function: View patient records / timeline, uc: [view-timeline], grant: {patient: "O* (finished)", doctor: Care/BG, nurse: O}}
    - {function: Emergency access, uc: [break-glass], grant: {doctor: "O (reason, 60 minutes)"}}
    - {function: Upload documents, uc: [upload-document], grant: {doctor: Care, nurse: O}}
    - {function: Download documents, uc: [download-document], grant: {patient: "O* (released)", doctor: Care/BG, nurse: O}}
    - {function: "Release / mark documents as entered in error", uc: [release-document, void-document], grant: {doctor: Care}}
    - {function: Ask the knowledge assistant, uc: [ask-assistant, answer-feedback], grant: {doctor: O, nurse: O}}
    - {function: AI record summary, uc: [summarize], grant: {doctor: Care/BG}}
    - {function: Approve extraction results, uc: [review-extraction], grant: {doctor: Care, nurse: O}}
    - {function: Manage the knowledge base, uc: [manage-kb], grant: {admin: O}}
    - {function: Booking chatbot, uc: [chatbot-booking], grant: {patient: "O*"}}
    - {function: "Notification preferences, data processing consent, view one's own record access history", uc: [notification-preferences, manage-consent, view-my-access-log], grant: {patient: "O*"}}
    - {function: Request a personal data export, uc: [export-my-data, process-data-request], grant: {patient: "O* (submit request)", dpo: "O (process)"}}
    - {function: "Manage users, roles, doctor links", uc: [invite-staff, lock-account, link-practitioner], grant: {admin: O}}
    - {function: View / export audit, uc: [search-audit, export-audit], grant: {admin: "O (no clinical content)", dpo: O}}
    - {function: Modify / delete audit, uc: [], grant: {}}
    - {function: Handle failed notification delivery, uc: [manage-dead-letters], grant: {admin: O}}
    - {function: Backup / restore, uc: [backup-restore], grant: {admin: "O (through an approved process)"}}
  notes:
    - "No role can modify or delete audit entries, including the Administrator (the \"Modify / delete audit\" row is all X)."
    - "Administrators and Data Protection Officers cannot read clinical content (diagnoses, vital signs, documents)."
    - "AI features call other services using the user's own token (on-behalf-of), so they never have broader permissions than the user."
    - "Access to another patient's data without permission returns \"does not exist\" (404) instead of \"forbidden\", so the existence of the record is not disclosed; the decision is still audited as \"deny\"."
