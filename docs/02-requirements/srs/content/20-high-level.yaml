permissions:
  intro: >-
    Ma trận ánh xạ chức năng với vai trò. Quyền được kiểm tra tại service sở hữu dữ liệu, mặc định từ chối; bản máy đọc
    được của ma trận (contracts/authz/matrix.yaml) là nguồn duy nhất cho code và test tự động – mỗi ô có ít nhất một test.
  legend:
    - "“O”: có quyền. Chi tiết hành vi xem use case tương ứng."
    - "“O*”: chỉ trên dữ liệu của chính mình (bệnh nhân: hồ sơ, lịch hẹn, tài liệu của mình; bác sĩ: lịch của mình)."
    - "“Care”: chỉ với bệnh nhân có quan hệ điều trị (lịch hẹn/lần khám trong 12 tháng hoặc lịch hẹn tương lai)."
    - "“Care/BG”: như Care, hoặc qua truy cập khẩn cấp đang hiệu lực."
    - "“X”: không có quyền. Yêu cầu bị từ chối và được ghi audit."
  rows:
    - {function: Đăng ký tài khoản bệnh nhân, uc: [register], grant: {patient: O}}
    - {function: Xem / sửa thông tin hành chính, uc: [update-profile, create-patient], grant: {patient: "O*", nurse: O}}
    - {function: Gộp hồ sơ trùng, uc: [merge-patient], grant: {nurse: O}}
    - {function: Tìm bác sĩ và slot trống, uc: [find-slot], grant: {patient: O, doctor: O, nurse: O, admin: O}}
    - {function: Đặt lịch khám, uc: [book], grant: {patient: "O*", nurse: O}}
    - {function: Hủy / đổi lịch khám, uc: [cancel, reschedule], grant: {patient: "O* (≥ 2h)", nurse: O}}
    - {function: Xem lịch hẹn, uc: [my-appointments, view-own-schedule], grant: {patient: "O*", doctor: "O*", nurse: O}}
    - {function: "Tạo lịch, mẫu tuần, sinh / chặn slot", uc: [schedule-template, generate-slots, block-slot], grant: {nurse: O, admin: O}}
    - {function: Check-in, uc: [check-in], grant: {nurse: O}}
    - {function: Ghi sinh hiệu, uc: [record-vitals], grant: {doctor: Care, nurse: O}}
    - {function: "Mở lần khám, ghi bệnh sử và chẩn đoán, kết thúc, bổ sung", uc: [start-encounter, record-diagnosis, finish-encounter, addendum], grant: {doctor: Care}}
    - {function: Tìm kiếm bệnh nhân (tên, năm sinh), uc: [search-patient], grant: {doctor: O, nurse: O}}
    - {function: Xem hồ sơ / timeline bệnh nhân, uc: [view-timeline], grant: {patient: "O* (đã kết thúc)", doctor: Care/BG, nurse: O}}
    - {function: Truy cập khẩn cấp, uc: [break-glass], grant: {doctor: "O (lý do, 60 phút)"}}
    - {function: Upload tài liệu, uc: [upload-document], grant: {doctor: Care, nurse: O}}
    - {function: Tải tài liệu, uc: [download-document], grant: {patient: "O* (đã phát hành)", doctor: Care/BG, nurse: O}}
    - {function: "Phát hành / đánh dấu nhập nhầm tài liệu", uc: [release-document, void-document], grant: {doctor: Care}}
    - {function: Hỏi trợ lý tri thức, uc: [ask-assistant, answer-feedback], grant: {doctor: O, nurse: O}}
    - {function: Tóm tắt hồ sơ bằng AI, uc: [summarize], grant: {doctor: Care/BG}}
    - {function: Duyệt kết quả trích xuất, uc: [review-extraction], grant: {doctor: Care, nurse: O}}
    - {function: Quản lý kho tri thức, uc: [manage-kb], grant: {admin: O}}
    - {function: Chatbot đặt lịch, uc: [chatbot-booking], grant: {patient: "O*"}}
    - {function: "Tùy chọn thông báo, đồng ý xử lý dữ liệu, xem lịch sử truy cập hồ sơ của mình", uc: [notification-preferences, manage-consent, view-my-access-log], grant: {patient: "O*"}}
    - {function: Yêu cầu trích xuất dữ liệu cá nhân, uc: [export-my-data, process-data-request], grant: {patient: "O* (gửi yêu cầu)", dpo: "O (xử lý)"}}
    - {function: "Quản lý người dùng, vai trò, liên kết bác sĩ", uc: [invite-staff, lock-account, link-practitioner], grant: {admin: O}}
    - {function: Xem / xuất audit, uc: [search-audit, export-audit], grant: {admin: "O (không nội dung lâm sàng)", dpo: O}}
    - {function: Sửa / xóa audit, uc: [], grant: {}}
    - {function: Xử lý thông báo gửi lỗi, uc: [manage-dead-letters], grant: {admin: O}}
    - {function: Sao lưu / khôi phục, uc: [backup-restore], grant: {admin: "O (qua quy trình có duyệt)"}}
  notes:
    - "Không vai trò nào sửa hoặc xóa được bản ghi audit, kể cả Quản trị viên (dòng “Sửa / xóa audit” toàn X)."
    - "Quản trị viên và Cán bộ bảo vệ dữ liệu không đọc được nội dung lâm sàng (chẩn đoán, sinh hiệu, tài liệu)."
    - "Các tính năng AI gọi service khác bằng chính token của người dùng (on-behalf-of), nên không bao giờ có quyền rộng hơn người dùng."
    - "Truy cập tới dữ liệu của bệnh nhân khác mà không có quyền trả về “không tồn tại” (404) thay vì “bị cấm”, để không làm lộ sự tồn tại của hồ sơ; quyết định vẫn được ghi audit là “deny”."
