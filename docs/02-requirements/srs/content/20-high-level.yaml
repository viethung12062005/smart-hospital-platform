# Chương 2 – Yêu cầu mức tổng quan.
high_level:
  intro: >-
    Chương này mô tả tổng quan chức năng và quy trình nghiệp vụ qua các sơ đồ: loại người dùng, quyền của họ trên từng
    chức năng và trình tự các bước để hoàn thành một quy trình. Đây là mức tổng quan; đặc tả chi tiết nằm ở Chương 3.
  ord:
    intro: >-
      Sơ đồ thể hiện quan hệ tĩnh giữa actor và đối tượng dữ liệu, giữa các đối tượng với nhau và với hệ thống bên ngoài.
      Đối tượng là một thực thể dữ liệu trong hệ thống; mỗi service sở hữu dữ liệu của mình và là nơi duy nhất quyết định
      quyền trên dữ liệu đó.
    nodes:
      - {key: a-dpo, label: Cán bộ bảo vệ dữ liệu, kind: actor, col: 0, row: 0}
      - {key: a-nurse, label: Điều dưỡng, kind: actor, col: 1, row: 0}
      - {key: a-patient, label: Bệnh nhân, kind: actor, col: 2, row: 0}
      - {key: a-doctor, label: Bác sĩ, kind: actor, col: 3, row: 1}
      - {key: a-admin, label: Quản trị viên, kind: actor, col: 7, row: 2}
      - {key: audit, label: Bản ghi audit, kind: object, col: 0, row: 1}
      - {key: patient, label: Bệnh nhân (Patient), kind: object, col: 1, row: 1}
      - {key: appointment, label: Lịch hẹn, kind: object, col: 2, row: 1}
      - {key: slot, label: Slot, kind: object, col: 4, row: 1}
      - {key: schedule, label: Lịch làm việc, kind: object, col: 5, row: 1}
      - {key: practitioner, label: Bác sĩ (Practitioner), kind: object, col: 6, row: 1}
      - {key: consent, label: Đồng ý xử lý dữ liệu, kind: object, col: 0, row: 2}
      - {key: reminder, label: Lần nhắc lịch, kind: object, col: 1, row: 2}
      - {key: encounter, label: Lần khám, kind: object, col: 2, row: 2}
      - {key: prediction, label: Dự đoán no-show, kind: object, col: 3, row: 2}
      - {key: account, label: Tài khoản, kind: object, col: 6, row: 2}
      - {key: messaging, label: Nhà cung cấp gửi tin, kind: external, col: 0, row: 3}
      - {key: observation, label: Sinh hiệu / kết quả, kind: object, col: 1, row: 3}
      - {key: document, label: Tài liệu lâm sàng, kind: object, col: 2, row: 3}
      - {key: condition, label: Chẩn đoán / dị ứng, kind: object, col: 3, row: 3}
      - {key: idp, label: Nhà cung cấp định danh, kind: external, col: 6, row: 3}
      - {key: malware, label: Quét mã độc, kind: external, col: 1, row: 4}
      - {key: extraction, label: Kết quả trích xuất, kind: object, col: 2, row: 4}
      - {key: llm, label: Mô hình ngôn ngữ, kind: external, col: 3, row: 4}
      - {key: conversation, label: Hội thoại trợ lý, kind: object, col: 4, row: 4}
      - {key: kb, label: Kho tri thức, kind: object, col: 5, row: 4}
