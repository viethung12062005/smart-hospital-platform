# Actors, external systems, data objects (Chapter 2.1 and the System Analysis Result file) and the high-level requirements list.
actors:
  - key: patient
    name: Patient
    short: BN
    description: >-
      A person with an account on the patient portal. Books/cancels/reschedules visits for themselves and for linked relatives (children under 16, authorized adults), views appointments, views documents
      released by the doctor, updates administrative information, views who accessed their record, manages consent to data processing
      by AI, and uses the booking chatbot. The system identifies a "Patient" when the OIDC token has the role "patient" and [fhirUser] points to
      a Patient. They see only their own data and the data of linked records within the correct scope (BR-05).
  - key: doctor
    name: Doctor
    short: BS
    description: >-
      A clinical staff member who examines patients. Views their own schedule, opens and records visits, records diagnoses, releases documents
      to patients, asks the knowledge assistant, summarizes records and approves extraction results. Can access only the records of patients with a
      treatment relationship (BR-06); the only exception is emergency access. MFA is mandatory. Role "doctor", [fhirUser] points to a Practitioner.
  - key: nurse
    name: Nurse
    short: DD
    description: >-
      Nurse/reception staff. Creates and edits patient records at the counter, merges duplicate records, books/cancels appointments on behalf of patients,
      manages schedules and slots, performs check-in, measures vital signs, uploads documents, approves extraction results, and asks the knowledge assistant.
      MFA is mandatory. Role "nurse".
  - key: admin
    name: Administrator
    short: QT
    description: >-
      System administrator. Manages staff accounts and roles, links doctor accounts to Practitioner records, manages
      schedules, manages the AI assistant's knowledge base, views audit (without viewing clinical content), handles error notifications, and operates
      backup/restore through an approved process. Has no permission to read clinical records. MFA is mandatory. Role "admin".
  - key: dpo
    name: Data Protection Officer
    short: DPO
    description: >-
      Data Protection Officer. Searches and exports audit reports on patient data access, receives emergency access alerts,
      and handles data subject requests. Cannot read clinical data. MFA is mandatory. Role "dpo".
  - key: system
    name: System
    short: HT
    in_matrix: false
    description: >-
      Automated tasks with no direct user: scheduled jobs (mark no-shows, purge expired data), event consumers
      (reminders, no-show prediction, document extraction). Calls other services using workload identity and may call
      only declared internal endpoints.

external_systems:
  - key: idp
    name: Identity provider (Keycloak)
    description: >-
      OIDC authentication, MFA, issuing tokens with roles, running in the system cluster in every environment. Patient registration by phone
      number (OTP code) or email (verification code). Only the identity provider stores passwords (salted slow hash); business services never receive or store passwords.
  - key: messaging
    name: Messaging provider (email, SMS, push)
    description: Sends reminders and notifications. Content does not contain diagnoses or examination results.
  - key: llm
    name: Language model provider (DeepSeek, Gemini) and locally hosted models (Ollama)
    description: >-
      Generates answers, summaries and document classifications. All data sent to external providers has personally identifiable
      information redacted; embeddings run locally in the cluster.
  - key: malware
    name: Malware scanning service (Microsoft Defender for Storage / ClamAV)
    description: Scans every uploaded file before the document is used.
  - key: cloud
    name: Azure platform
    description: File storage (Blob, WORM for audit), event queue (Service Bus), secret keys (Key Vault), monitoring (Azure Monitor).

objects:
  - key: patient
    name: Patient
    actors: [patient, nurse, doctor]
    description: >-
      The patient's administrative record according to FHIR Patient. Patients register themselves or a nurse creates the record at the counter. Every edit creates a new
      version. A record can be merged into another record when duplicated.
    properties:
      - {name: Patient ID, example: BN-2026-000123, input: System generated, note: Business identifier displayed to users}
      - {name: Full name, example: Nguyen Thi Lan, input: Free Input}
      - {name: Date of birth, example: 12/05/1985, input: Free Input}
      - {name: Sex, example: Female, input: Input in a list, note: "male, female, other, unknown"}
      - {name: Phone number, example: "0912 345 678", input: Free Input, note: Used to detect duplicate records with the same date of birth}
      - {name: Email, example: lan.nguyen@example.org, input: Free Input}
      - {name: National ID number, example: "000123456789", input: Free Input, note: "Optional; a nurse adds it when the patient arrives; stored encrypted, displayed masked"}
      - {name: Address, example: "12 Le Loi, Hue", input: Free Input}
      - {name: Status, example: active, input: System generated, note: "active, merged (merged into another record)"}
  - key: profile-link
    name: Profile link (ProfileLink)
    actors: [patient, nurse]
    description: >-
      The relationship between a login account and a patient record: self, guardian of a person under 16, or an authorized
      representative. It has a scope, is valid for 12 months and can be revoked.
    properties:
      - {name: Relationship, example: Guardian, input: Input in a list, note: "self, guardian, authorized representative"}
      - {name: Scope, example: Booking, input: Input in a list, note: "Booking; Booking and viewing results. A guardian has full rights"}
      - {name: Status, example: active, input: System generated, note: "pending, active, revoked, expired"}
      - {name: Expiry, example: 31/10/2027, input: System generated, note: "12 months from linking, renewed by OTP"}
      - {name: Establishment method, example: Relative's OTP code, input: System generated, note: "Relative's OTP, at the counter with document verification, guardian's declaration"}
  - key: practitioner
    name: Doctor (Practitioner / PractitionerRole)
    actors: [admin]
    description: Doctor information, specialty and link to a login account. Managed by the administrator.
    properties:
      - {name: Full name, example: Dr. Tran Van Minh, input: Free Input}
      - {name: Specialty, example: Cardiology, input: Input in a list, note: The hospital's specialty code set}
      - {name: Linked account, example: (subject OIDC), input: From external system, show: false}
  - key: schedule
    name: Doctor schedule (Schedule) and Weekly template
    actors: [nurse, admin, doctor]
    description: A doctor's schedule for a specialty, together with the weekly template used to generate slots.
    properties:
      - {name: Doctor, example: Dr. Tran Van Minh, input: Input in a list}
      - {name: Specialty, example: Cardiology, input: Input in a list}
      - {name: Weekly template, example: "Mon-Fri 08:00-11:30", input: Free Input}
      - {name: Slot length, example: "15 minutes", input: Input in a list, note: "10, 15, 20, 30"}
      - {name: Status, example: Active, input: Input in a list}
  - key: slot
    name: Time slot (Slot)
    actors: [patient, nurse, admin, doctor]
    description: An examination time slot for a doctor, generated from the schedule template, bookable up to 30 days in advance (BR-04).
    properties:
      - {name: Start / end time, example: "03/12/2026 08:15-08:30", input: System generated}
      - {name: Status, example: free, input: System generated, note: "free, busy, busy-unavailable"}
      - {name: Blocking reason, example: Leave, input: Free Input, note: Only when blocked}
  - key: appointment
    name: Appointment
    actors: [patient, nurse, doctor]
    description: A patient's appointment in a slot. It has its own status lifecycle (Chapter 2.3).
    properties:
      - {name: Appointment ID, example: LH-20261203-0042, input: System generated}
      - {name: Patient, example: Nguyen Thi Lan, input: System generated, note: When a patient books for themselves it is always themselves}
      - {name: Slot, example: "03/12/2026 08:15, Dr. Tran Van Minh", input: Input in a list}
      - {name: Reason for visit, example: Chest pain on exertion, input: Free Input}
      - {name: Status, example: booked, input: System generated, note: "booked, arrived, fulfilled, cancelled, noshow"}
      - {name: Booking channel, example: web, input: System generated, note: "web, counter, chatbot"}
      - {name: Cancellation reason, example: Unexpected personal matter, input: Input in a list}
  - key: encounter
    name: Encounter
    actors: [nurse, doctor]
    description: An outpatient visit, created at check-in. Once finished it cannot be edited, only amended.
    properties:
      - {name: Reason for visit / history, example: "Chest pain for 2 weeks, worse when climbing stairs", input: Free Input}
      - {name: Status, example: in-progress, input: System generated, note: "arrived, in-progress, finished"}
      - {name: Examining doctor, example: Dr. Tran Van Minh, input: System generated}
  - key: observation
    name: Vital signs / results (Observation)
    actors: [nurse, doctor]
    description: Vital signs (blood pressure, pulse, temperature, SpO2, weight, height) and lab results, LOINC coded.
    properties:
      - {name: Type, example: Systolic blood pressure, input: Input in a list, note: LOINC code}
      - {name: Value and unit, example: "135 mmHg", input: Free Input, note: Plausible range validation}
  - key: condition
    name: Diagnosis / comorbidity (Condition) and Allergy
    actors: [doctor]
    description: Diagnosis using ICD-10 codes, comorbidities and patient allergies.
    properties:
      - {name: ICD-10 code, example: "I20.9 Angina pectoris", input: Input in a list}
      - {name: Type, example: Visit diagnosis, input: Input in a list}
  - key: document
    name: Clinical document (DocumentReference)
    actors: [nurse, doctor, patient]
    description: Metadata for a clinical file (lab results, prescription, referral letter...); the file is in storage and can be downloaded only through a short-lived link.
    properties:
      - {name: Document type, example: Lab result, input: Input in a list}
      - {name: File, example: "lab-result.pdf (1.2 MB)", input: Free Input, note: "PDF, JPEG, PNG; <= 20 MB"}
      - {name: Scan status, example: available, input: System generated, note: "pending-scan, available, quarantined"}
      - {name: Released to patient, example: "Yes", input: System generated}
  - key: reminder
    name: Appointment reminder (Reminder) and Notification preferences
    actors: [system, patient]
    description: Reminders at T-24h, T-2h (and T-6h if no-show risk is high) for an appointment; the patient's channel preferences.
    properties:
      - {name: Send time, example: "02/12/2026 08:15", input: System generated}
      - {name: Channel, example: SMS, input: Input in a list, note: "push, email, SMS"}
      - {name: Status, example: scheduled, input: System generated, note: "scheduled, sent, cancelled, failed"}
  - key: audit
    name: Audit entry (AuditEvent)
    actors: [dpo, admin, patient]
    description: Immutable log of every access to patient data and every authorization decision (allow and deny).
    properties:
      - {name: Timestamp, example: "03/12/2026 09:02:11", input: System generated}
      - {name: Actor and role, example: "Dr. Tran Van Minh (doctor)", input: System generated}
      - {name: Action / resource, example: "read Patient/...", input: System generated}
      - {name: Result, example: "allow / deny", input: System generated}
      - {name: Purpose, example: "treatment / break-glass", input: System generated}
      - {name: Reason (break-glass), example: Cardiac arrest emergency, input: Free Input}
  - key: consent
    name: Data processing consent (Consent)
    actors: [patient]
    description: The patient's consent to processing health data with AI (summary, extraction, prediction) and to receiving notifications.
    properties:
      - {name: Scope, example: "ai-processing", input: Input in a list}
      - {name: Status, example: Granted, input: Input in a list}
      - {name: Timestamp and terms version, example: "30/10/2026, v1", input: System generated}
  - key: kb
    name: Knowledge base document (KB document)
    actors: [admin, doctor, nurse]
    description: Approved care protocols and internal procedures used as sources for the knowledge assistant; viewing scope is by role/department.
    properties:
      - {name: Title, example: Hypertension management protocol, input: Free Input}
      - {name: Viewing scope, example: Cardiology doctors, input: Input in a list}
      - {name: Status, example: approved, input: System generated, note: "draft, approved, retired"}
  - key: conversation
    name: Assistant conversation (Conversation / Message)
    actors: [doctor, nurse, patient]
    description: Questions, answers with citations, and ratings; automatically deleted after 30 days.
  - key: extraction
    name: Extraction result (Extraction)
    actors: [nurse, doctor, system]
    description: Data fields extracted by AI from documents (OCR + classification) awaiting human confirmation before being written to the record (BR-10).
  - key: prediction
    name: No-show risk prediction (Prediction)
    actors: [system, nurse]
    description: The no-show probability for an appointment, together with the model version for traceability.
  - key: account
    name: User account
    actors: [admin]
    description: Links an OIDC subject to a role and a profile (Patient/Practitioner); locked/unlocked status.

requirements:
  - {id: UC-01, title: Manage patient records, description: "Patients register themselves and update administrative information; nurses create/edit/merge records at the counter; every edit is versioned.", priority: Must, source: BP-3}
  - {id: UC-02, title: Manage doctor schedules, description: "Create weekly schedule templates, generate 30 days of slots, block/open slots, doctors view their own schedule.", priority: Must, source: BP-1}
  - {id: UC-03, title: "Book / cancel / reschedule an appointment", description: "Find slots, duplicate-safe and retry-safe booking, cancellation with a 2-hour deadline, atomic rescheduling.", priority: Must, source: "BP-1, BR-01..04"}
  - {id: UC-04, title: Record a visit, description: "Check-in, vital signs, history, ICD-10 diagnosis, finish and amend the visit.", priority: Must, source: BP-3}
  - {id: UC-05, title: Clinical documents, description: "Upload with type/size/malware checks, release to the patient, download through an audited 5-minute link.", priority: Must, source: "BP-3, BR-08"}
  - {id: UC-06, title: Search patient history, description: "Search patients without accents, view a timeline of visits/diagnoses/vital signs/documents.", priority: Must, source: BP-3}
  - {id: UC-07, title: Reminders and notifications, description: "T-24h/T-2h reminders, cancel reminders when the appointment is cancelled, retries and fallback channels.", priority: Must, source: BP-2}
  - {id: UC-08, title: Manage users and authorization, description: "Invite staff, assign roles, lock accounts, link doctors, mandatory MFA for staff.", priority: Must, source: BP-5}
  - {id: UC-09, title: Audit data access, description: "Immutable logging of every access; DPO/Admin search and export reports; patients view who accessed their record.", priority: Must, source: "BP-5, BR-07"}
  - {id: UC-10, title: Emergency access, description: "A doctor opens a record outside a treatment relationship in an emergency: reason mandatory, 60 minutes, DPO notified.", priority: Should, source: "BR-06, BR-07"}
  - {id: UC-11, title: Medical knowledge assistant (RAG), description: "Answers with citations from documents the user is allowed to view, prompt injection resistance, fallback models.", priority: Must, source: "BP-4, BR-09"}
  - {id: UC-12, title: AI record summary, description: "Summary with links to source records, AI label, only data the user is allowed to view.", priority: Should, source: BP-3}
  - {id: UC-13, title: Extract data from documents, description: "OCR, classification, field extraction; always requires human confirmation before writing to the record.", priority: Should, source: "BP-6, BR-10"}
  - {id: UC-14, title: Booking chatbot, description: "The bot proposes slots and books/cancels only after explicit patient confirmation; on failure it falls back to the form.", priority: Could, source: BP-1}
  - {id: UC-15, title: No-show risk prediction, description: "Compute probability at booking time; add a reminder for high risk; ML failure does not affect reminders.", priority: Should, source: BP-2}
  - {id: UC-16, title: Backup and restore, description: "Restore to any point within the last 7 days; drills measure time against the RTO.", priority: Must, source: Assignment brief}
  - {id: UC-17, title: Data subject rights, description: "Patients manage consent to AI data processing and request an export of their personal data (Personal Data Protection Law No. 91/2025/QH15).", priority: Should, source: "NFR-SEC, Personal Data Protection Law 91/2025/QH15"}
