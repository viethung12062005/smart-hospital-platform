# Common use cases and common business rules (Chapter 3).
common_use_cases:
  - key: login
    name: Log in
    actor: Any user
    objective: Authenticate the user through the identity provider (OIDC, PKCE) and establish a session.
    trigger: The user opens the system while not logged in, or the session has expired.
    pre: ["N/A"]
    post: ["The user has a valid session with the role from the token; they are redirected to the home page for their role."]
    lanes: [User, System, Identity provider]
    steps:
      - {n: 1, lane: 0, text: "Click \"Log in\""}
      - {n: 2, lane: 1, text: "Redirect to the identity\nprovider (PKCE)"}
      - {n: 3, lane: 2, kind: decision, text: "Authentication succeeded\n(MFA for staff)?", branches: [{to: 4, label: "Yes"}, {to: 6, label: "No"}]}
      - {n: 4, lane: 1, kind: decision, text: "Token valid and account\nnot locked?", branches: [{to: 5, label: "Yes"}, {to: 6, label: "No"}]}
      - {n: 5, lane: 1, text: "Create the session, redirect to the\nhome page for the role", end: true}
      - {n: 6, lane: 1, text: "Reject, show the error,\naudit the failed login", end: true}
    rules:
      - step: "(2)"
        key: login-flow
        title: Login rules
        lines:
          - "Use the Authorization Code + PKCE flow; the system never receives or stores passwords."
          - "Access tokens expire in <= 15 minutes (NFR-SEC1) and are kept in the browser session memory (not localStorage); refresh with rotating refresh tokens."
      - step: "(3)"
        title: MFA and temporary lock rules
        lines:
          - "Staff (Doctor, Nurse, Administrator, DPO) must use MFA; a token without an MFA claim is rejected when accessing data -> [[MSG:mfa-required]]."
          - "5 consecutive failed logins -> temporary 15-minute lock at the identity provider."
      - step: "(4)"
        title: Token validation rules
        lines:
          - "Validate signature, issuer, audience and expiry; a locked account -> [[MSG:account-locked]]; roles come from the \"roles\" claim, never from client-supplied data."

  - key: session
    name: Log out and session expiry
    actor: Any user
    objective: End the session explicitly or automatically after inactivity.
    trigger: The user clicks \"Log out\", or there is no activity beyond the allowed time.
    pre: ["The user has a session."]
    post: ["The session and tokens are revoked in the browser and at the identity provider; sensitive data on the screen is cleared."]
    rules:
      - step: "(N/A)"
        key: session-timeout
        title: Session expiry rules
        lines:
          - "Staff: automatic logout after 15 minutes of inactivity (shared machines at the clinic) and a new login after at most 12 hours; patients: 30 minutes of inactivity, at most 24 hours. A warning appears 1 minute before; expiry shows [[MSG:session-expired]]."
          - "Logout clears tokens and all data cached in the browser (memory, sessionStorage); the Back button does not show patient data again."

  - key: view-list
    name: View a list
    actor: Refer to the use case that uses this common use case.
    objective: Display a list of records of an object according to the user's permissions.
    trigger: The user opens a list screen.
    pre: ["The user has permission to view the object."]
    post: ["The list is displayed with the default filters."]
    lanes: [User, System]
    steps:
      - {n: 1, lane: 0, text: "Open the list screen"}
      - {n: 2, lane: 1, text: "Fetch records within the permitted\nscope, apply the default filters"}
      - {n: 3, lane: 0, text: "Search / filter / sort /\npaginate"}
      - {n: 4, lane: 1, text: "Refresh the list", end: true}
    rules:
      - step: "(2)"
        title: Scope and display rules
        lines:
          - "The data scope is applied on the server per [[CBR:authz]], not through client-side filters."
          - "Display per [[CBR:pagination]]; long columns are truncated with a tooltip."
  - key: view-item
    name: View details
    actor: Refer to the use case that uses this common use case.
    objective: View the details of a record.
    trigger: The user selects a record.
    pre: ["The user has permission to view the record."]
    post: ["The record is displayed in view mode."]
    rules:
      - step: "(N/A)"
        title: Display rules
        lines: ["No permission -> [[MSG:not-found]]; access to patient data is audited per [[CBR:audit]]."]
  - key: create-item
    name: Create a record
    actor: Refer to the use case that uses this common use case.
    objective: Create a new record.
    trigger: The user clicks \"Create new\".
    pre: ["The user has permission to create."]
    post: ["The new record is saved."]
    lanes: [User, System]
    steps:
      - {n: 1, lane: 0, text: "Click \"Create new\""}
      - {n: 2, lane: 1, text: "Show the form in create mode"}
      - {n: 3, lane: 0, text: "Enter data, click \"Save\""}
      - {n: 4, lane: 1, kind: decision, text: "Valid?", branches: [{to: 5, label: "Yes"}, {to: 2, label: "No"}]}
      - {n: 5, lane: 1, text: "Save, record the trail, return to the\nprevious screen", end: true}
    rules:
      - step: "(4)"
        title: Validation rules
        lines: ["Validate every required field and format on both the client and the server ([[CBR:validation]]); if missing -> [[MSG:required]] below the corresponding field."]
      - step: "(5)"
        title: Creation rules
        lines: ["Save the entered data; record [[CBR:record-trail]]; show [[MSG:saved]]."]
  - key: update-item
    name: Update a record
    actor: Refer to the use case that uses this common use case.
    objective: Edit an existing record.
    trigger: The user clicks \"Edit\".
    pre: ["The user has permission to edit; the record is in an editable state."]
    post: ["The record is updated to a new version."]
    rules:
      - step: "(N/A)"
        title: Update rules
        lines:
          - "Apply the same validation rules as when creating; the version being edited must be the latest -> otherwise [[MSG:version-conflict]]."
          - "Keep the old version; record [[CBR:record-trail]]."
  - key: disable-item
    name: Disable a record
    actor: Refer to the use case that uses this common use case.
    objective: Stop using a catalog record without deleting it (preserving traceability).
    trigger: The user clicks \"Disable\".
    pre: ["The user has permission; the record is active."]
    post: ["The record is \"inactive\" and no longer appears in new selections; existing data that references it is still displayed correctly."]
    rules:
      - step: "(N/A)"
        title: Disable rules
        lines: ["The system never physically deletes business or clinical data; it only disables it or marks it as entered in error."]

common_rules:
  - key: authz
    title: Permission check rules (deny by default)
    lines:
      - "Every API checks permissions at the service that owns the data, according to the authorization matrix (contracts/authz/matrix.yaml): role from the token + relationship to the patient (ownership, treatment relationship, emergency access, released). An action absent from the matrix is denied."
      - "The gateway only validates tokens and does not decide permissions. The interface hides buttons the user may not use, but that does not replace the server-side check."
      - "Data of another patient that the user has no permission for: return \"not found\" (404) instead of \"forbidden\" (403) to avoid revealing existence; if the user already knows the record exists (for example, a doctor saw it in search results), return [[MSG:no-care]]."
      - "Every new endpoint must have a rule in the matrix; automated tests fail if any endpoint is unprotected."
  - key: audit
    title: Audit recording rules
    lines:
      - "Record an audit entry for every read/write of patient data and every authorization decision, both grants and denials: time, actor (subject, role, Practitioner), action, resource type and ID, patient ID, result, purpose (\"treatment\", \"break-glass\", \"patient-access\", \"operations\"), reason (break-glass), trace-id, IP with the last octet masked."
      - "Audit entries never contain clinical data values (no diagnoses, no document contents)."
      - "Audit is written in the same transaction as the operation (outbox); the audit store is immutable (WORM) and appears in the search tool within <= 1 minute (NFR-SEC5)."
  - key: no-pii
    title: Rules for not exposing personal data beyond the required scope
    lines:
      - "Never write full name, phone number, email, address, date of birth, diagnosis or document content into application logs, metrics, traces, events, URLs or error messages; use identifiers only."
      - "Never put personal data in the query string; share/download links are always short-lived and grant access to exactly one resource."
      - "Error messages shown to users contain no stack traces or technical details."
      - "Development and test environments use synthetic data only; copying real data to personal machines is prohibited."
  - key: record-trail
    title: Record change trail rules
    lines:
      - "On create: [Created by] = <Current user>, [Created at] = <Now>. On create or update: [Last modified by], [Modified at], increment [Version]."
      - "Clinical records and patient records keep every old version; version history is viewable according to permissions."
  - key: validation
    title: Input validation rules
    lines:
      - "All input is validated on the server (type, length, format, value set) even if the client already validated it; unknown fields are rejected."
      - "Free text is stored as entered and encoded when displayed (to prevent XSS); queries are never built by string concatenation."
  - key: pagination
    title: Pagination rules
    lines:
      - "Default 20 rows per page (maximum 100); cursor-based pagination for large data; a new search or a change of page size returns to the first page."
  - key: event-processing
    title: Event processing rules
    lines:
      - "Events follow CloudEvents 1.0 and are delivered at least once; the consumer records the event ID in its inbox and skips events already processed."
      - "Ordering is guaranteed per subject; an event with [version] <= the processed version is skipped."
      - "Processing failure: retry at most 5 times (10 seconds, 1, 5, 15 minutes), then move to the dead-letter queue and raise an operations alert."
      - "Events contain no personal data ([[CBR:no-pii]]) and are at most 64 KB."
  - key: ai-safety
    title: AI safety rules
    lines:
      - "Before sending any text to an external model provider: replace full names, phone numbers, email addresses, full addresses and identifiers with pseudonyms; the reverse map exists only in request memory; there is a test that blocks requests containing identifying data."
      - "Use only providers that commit not to use the data for training; embeddings and OCR run in the cluster."
      - "AI accesses data with the user's own token (on-behalf-of) and never has broader permissions of its own; data of patients who have not consented to AI processing is never used."
      - "AI results always carry the label \"AI-generated, needs review\"; AI does not diagnose, does not prescribe treatment and never writes into the record by itself (BR-09, BR-10)."
      - "Daily token/cost quotas; a circuit breaker stops a failing model after 5 failures in 60 seconds; every model call records metrics (never content)."
