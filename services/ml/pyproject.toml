[project]
name = "shp-ml"
version = "0.1.0"
description = "No-show model: prediction serving, drift, automatic retraining"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  # shp_platform (libs/python, copied by tools/pylib/sync.py)
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  # features and prediction (ML-15, ML-07)
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "lightgbm>=4.5,<5",
  "prometheus-client>=0.21,<1",
  # bus and MongoDB (shp_platform.mongo, shp_platform.bus)
  "pymongo>=4.10,<5",
  "pika>=1.3,<2",
  "azure-servicebus>=7.13,<8",
  "azure-identity>=1.19,<2",
]

[project.optional-dependencies]
# training (ML-01..05): separate training image (MLO-02), not included in the serving image
train = [
  "pyarrow>=18,<27",
  "scikit-learn>=1.6,<2",
]
# MLflow tracking + registry (cluster, LOC-08); not needed for tests
mlflow = [
  "mlflow-skinny>=2.17,<4",
]
dev = [
  "shp-ml[train]",
  "pandas-stubs>=2.2,<4",
  "testcontainers>=4.9,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "types-jsonschema>=4.23,<5",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shp_platform = ["schemas/**/*.json", "COPIED_FROM_LIBS.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
strict = true
packages = ["shp_ml"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "pyarrow.*", "lightgbm.*", "mlflow.*", "pika.*", "testcontainers.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["shp_ml"]
