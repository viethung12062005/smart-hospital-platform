[project]
name = "shp-ml"
version = "0.1.0"
description = "Mô hình no-show: phục vụ dự đoán, drift, huấn luyện lại tự động"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  # shp_platform (libs/python, chép bằng tools/pylib/sync.py)
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  # đặc trưng và dự đoán (ML-15, ML-07)
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
# huấn luyện (ML-01..05): image huấn luyện riêng (MLO-02), không vào image phục vụ
train = [
  "pyarrow>=18,<25",
  "scikit-learn>=1.6,<2",
]
dev = [
  "shp-ml[train]",
  "pandas-stubs>=2.2,<4",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "types-jsonschema>=4.23,<5",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shp_platform = ["schemas/**/*.json", "COPIED_FROM_LIBS.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
strict = true
packages = ["shp_ml"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["shp_ml"]
