# Configuration for the clinical service. Sensitive values (passwords) must NOT go here: read from environment variables (local: dev/.local/connection.env
# or a Secret created by dev/scripts/deploy.sh; cloud: Key Vault via CSI).
spring:
  application:
    name: clinical
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27117/?directConnection=true}
    database: clinical
  cloud:
    function:
      definition: appointmentEvents
    stream:
      bindings:
        # 13 §1.1: appointment events (E1, E2, E3, E5) -> care relationships; E4 -> Encounter
        appointmentEvents-in-0:
          destination: shp-events
          group: clinical
shp:
  clinical:
    url: ${SHP_CLINICAL_URL:http://clinical}
server:
  port: 8080
