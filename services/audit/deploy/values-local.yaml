# Audit-specific values when running on kind (make -C dev deploy SVC=audit); loaded after dev/chart/app-values-local.yaml.
image:
  repository: localhost/shp-audit
  tag: dev
env:
  OTEL_SERVICE_NAME: audit
  SPRING_MONGODB_URI: mongodb://mongodb.shp-deps.svc.cluster.local:27017/?directConnection=true
  # Log Analytics query table disabled locally (05-storage-audit-blob §1.3); AUD-02 wires it in the
  # cloud. Empty values keep the sink off so the worker still starts against a bare cluster.
  SHP_AUDIT_SINK_WORKSPACE_ID: ""
  SHP_AUDIT_SINK_ENDPOINT: ""
  # WORM audit container (05-storage-audit-blob §1.2). Azurite starts empty, so create the container;
  # the connection string comes from dev/chart/app-values-local.yaml. Azurite has no immutability.
  SHP_AUDIT_BLOB_CONTAINER: audit
  SHP_AUDIT_BLOB_CREATE_CONTAINER: "true"
