# Configuration for the audit service. Sensitive values (passwords) must NOT go here: read from environment variables (local: dev/.local/connection.env
# or a Secret created by dev/scripts/deploy.sh; cloud: Key Vault via CSI).
spring:
  application:
    name: audit
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27117/?directConnection=true}
    database: audit
shp:
  clinical:
    url: ${SHP_CLINICAL_URL:http://clinical}
  audit-sink:
    # Log Analytics query table (05-storage-audit-blob §1.3). Empty = disabled; AUD-02 wires the
    # Logs Ingestion API (Data Collection Rule) on top of these settings.
    workspace-id: ${SHP_AUDIT_SINK_WORKSPACE_ID:}
    endpoint: ${SHP_AUDIT_SINK_ENDPOINT:}
  audit-blob:
    # WORM audit container (05-storage-audit-blob §1.2). Local: connection string for Azurite.
    # Cloud: leave the connection string empty and set the account URL; the pod's managed identity
    # (Storage Blob Data Contributor) is used, so no secret is needed.
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    account-url: ${SHP_AUDIT_BLOB_ACCOUNT_URL:}
    container: ${SHP_AUDIT_BLOB_CONTAINER:audit}
    instance: ${SHP_AUDIT_BLOB_INSTANCE:${HOSTNAME:audit-0}}
    create-container-if-missing: ${SHP_AUDIT_BLOB_CREATE_CONTAINER:false}
server:
  port: 8080
