[project]
name = "shp-ai"
version = "0.1.0"
description = "Trợ lý RAG, tóm tắt hồ sơ, trích xuất tài liệu, chatbot đặt lịch; LLM router có fallback"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  # shp_platform (libs/python, chép bằng tools/pylib/sync.py)
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "prometheus-client>=0.21,<1",
  "pymongo>=4.10,<5",
  "pika>=1.3,<2",
  "azure-servicebus>=7.13,<8",
  "azure-identity>=1.19,<2",
  # kho tri thức và trích xuất
  "azure-storage-blob>=12.24,<13",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6.0.2,<7",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "types-jsonschema>=4.23,<5",
  "testcontainers>=4.9,<5",
  "types-PyYAML>=6.0,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shp_platform = ["schemas/**/*.json", "COPIED_FROM_LIBS.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
strict = true
packages = ["shp_ai"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pika.*", "testcontainers.*", "docker.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["shp_ai"]
