# Configuration for the scheduling service. Sensitive values (passwords) must NOT go here: read from environment variables (local: dev/.local/connection.env
# or a Secret created by dev/scripts/deploy.sh; cloud: Key Vault via CSI).
spring:
  application:
    name: scheduling
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/scheduling}
    username: ${SPRING_DATASOURCE_USERNAME:shp}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-init-sql: SET search_path TO scheduling, public
  flyway:
    # Platform tables (outbox, inbox, idempotency_key) come from shp-data-postgres; the service's migrations live in db/migration (V1+).
    # Keep the history table in public (not the search_path's `scheduling`) so a redeploy does not hit
    # "Found non-empty schema 'scheduling' without schema history table" (verified workaround, LOC-05).
    default-schema: public
    locations: classpath:db/migration,classpath:db/shp-messaging/postgres
  cloud:
    function:
      definition: encounterEvents
    stream:
      bindings:
        # 13 §2: E6 encounter-finished -> Appointment arrived -> fulfilled (emits E5)
        encounterEvents-in-0:
          destination: shp-events
          group: scheduling
shp:
  clinical:
    url: ${SHP_CLINICAL_URL:http://clinical}
  paging:
    # HMAC key of the opaque _page_token (07 section 4), at least 32 bytes. Read from the environment, never committed.
    # Unset: the service generates a random per-process key (tokens do not survive a restart or cross replicas).
    token-key: ${SHP_PAGE_TOKEN_KEY:}
server:
  port: 8080
