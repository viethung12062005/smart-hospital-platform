# Configuration for the scheduling service. Sensitive values (passwords) must NOT go here: read from environment variables (local: dev/.local/connection.env
# or a Secret created by dev/scripts/deploy.sh; cloud: Key Vault via CSI).
spring:
  application:
    name: scheduling
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/scheduling}
    username: ${SPRING_DATASOURCE_USERNAME:shp}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-init-sql: SET search_path TO scheduling, public
  flyway:
    # Platform tables (outbox, inbox, idempotency_key) come from shp-data-postgres; the service's migrations live in db/migration (V1+).
    locations: classpath:db/migration,classpath:db/shp-messaging/postgres
shp:
  clinical:
    url: ${SHP_CLINICAL_URL:http://clinical}
server:
  port: 8080
