# Configuration for the document service. Sensitive values (passwords) must NOT go here: read from environment variables (local: dev/.local/connection.env
# or a Secret created by dev/scripts/deploy.sh; cloud: Key Vault via CSI).
spring:
  application:
    name: document
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27117/?directConnection=true}
    database: document
shp:
  clinical:
    url: ${SHP_CLINICAL_URL:http://clinical}
server:
  port: 8080
