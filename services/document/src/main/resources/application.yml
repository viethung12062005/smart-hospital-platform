# Configuration for the document service. Sensitive values (passwords) must NOT go here: read from environment variables (local: dev/.local/connection.env
# or a Secret created by dev/scripts/deploy.sh; cloud: Key Vault via CSI).
spring:
  application:
    name: document
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27117/?directConnection=true}
    database: document
shp:
  clinical:
    url: ${SHP_CLINICAL_URL:http://clinical}
  blob:
    # Connection string comes from the chart secret in the cloud (dev/chart/app-values-local.yaml
    # for local Azurite). Container names follow 05-storage-audit-blob §2.
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    documents-container: ${SHP_BLOB_DOCUMENTS_CONTAINER:documents}
    quarantine-container: ${SHP_BLOB_QUARANTINE_CONTAINER:quarantine}
    kb-container: ${SHP_BLOB_KB_CONTAINER:kb}
server:
  port: 8080
