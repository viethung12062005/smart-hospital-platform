# Notification-specific values when running on kind (make -C dev deploy SVC=notification); loaded after dev/chart/app-values-local.yaml.
image:
  repository: localhost/shp-notification
  tag: dev
env:
  # Audience isolation (ADR-0017): this service accepts tokens issued for svc-notification (service tokens) and shp-api (user tokens).
  OIDC_AUDIENCE: svc-notification
  OTEL_SERVICE_NAME: notification
  SPRING_MONGODB_URI: mongodb://mongodb.shp-deps.svc.cluster.local:27017/?directConnection=true
