# Cụm Kubernetes cục bộ cho dev: 1 node. Cổng của phụ thuộc được mở ra localhost (chỉ 127.0.0.1)
# để chạy service từ IDE hoặc `mvn spring-boot:run`/`uvicorn` trên máy mà vẫn dùng đúng phụ thuộc trong cụm.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shp-local
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30432, hostPort: 15432, listenAddress: "127.0.0.1" }   # PostgreSQL
      - { containerPort: 30017, hostPort: 27117, listenAddress: "127.0.0.1" }   # MongoDB
      - { containerPort: 30379, hostPort: 16379, listenAddress: "127.0.0.1" }   # Redis
      - { containerPort: 30672, hostPort: 15673, listenAddress: "127.0.0.1" }   # RabbitMQ AMQP
      - { containerPort: 30673, hostPort: 25672, listenAddress: "127.0.0.1" }   # RabbitMQ management UI
      - { containerPort: 30100, hostPort: 10000, listenAddress: "127.0.0.1" }   # Azurite blob (cổng mặc định của emulator)
      - { containerPort: 30101, hostPort: 10001, listenAddress: "127.0.0.1" }   # Azurite queue
      - { containerPort: 30080, hostPort: 18080, listenAddress: "127.0.0.1" }   # Keycloak
