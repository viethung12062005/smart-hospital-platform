# Common values for EVERY service when deployed to the kind cluster (dev/scripts/deploy.sh). The service-specific file
# (services/<svc>/deploy/values-local.yaml) is loaded afterwards and can override these.
replicaCount: 1
image:
  pullPolicy: Never          # images are loaded with `kind load`, not pulled from a registry
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
pdb:
  enabled: false             # with 1 replica a PDB blocks node drains
networkPolicy:
  enabled: false             # local allows all traffic; NetworkPolicy is verified on uat/prod
# Passwords/connection strings for dependencies in the shp-deps namespace (Secret created by deploy.sh, passwords randomly generated on this machine).
# Variable names follow the Spring Boot convention (relaxed binding) for Java services; MONGODB_URI/RABBITMQ_URL for Python services.
secretEnv:
  - { name: SPRING_DATASOURCE_PASSWORD, secretName: shp-local-conn, key: postgres-password }
  - { name: SPRING_RABBITMQ_PASSWORD, secretName: shp-local-conn, key: rabbitmq-password }
  - { name: SPRING_DATA_REDIS_PASSWORD, secretName: shp-local-conn, key: redis-password }
  - { name: AZURE_STORAGE_CONNECTION_STRING, secretName: shp-local-conn, key: blob }
  - { name: MONGODB_URI, secretName: shp-local-conn, key: mongodb }
  - { name: RABBITMQ_URL, secretName: shp-local-conn, key: rabbitmq }
env:
  # Tokens are obtained from the dev machine via http://localhost:18080, so the issuer is localhost; a pod cannot reach the machine localhost
  # → the signing keys (JWKS) are fetched via in-cluster DNS, while the issuer still validates against the localhost value.
  OIDC_AUTHORITY: http://localhost:18080/realms/shp
  OIDC_JWK_SET_URI: http://keycloak.shp-deps.svc.cluster.local:8080/realms/shp/protocol/openid-connect/certs
  OIDC_AUDIENCE: shp-api
  SHP_REQUIRE_MFA_FOR_STAFF: "false"   # test users in the local Keycloak do not have MFA
  SHP_CLINICAL_URL: http://clinical
  SPRING_RABBITMQ_HOST: rabbitmq.shp-deps.svc.cluster.local
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: shp
  SPRING_DATA_REDIS_HOST: redis.shp-deps.svc.cluster.local
  SPRING_DATA_REDIS_PORT: "6379"
