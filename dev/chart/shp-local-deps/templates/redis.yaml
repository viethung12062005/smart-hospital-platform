{{- if .Values.components.redis }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-host
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379, nodePort: 30379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: redis-password } }
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 5
          resources: {{- toYaml .Values.resources.redis | nindent 12 }}
{{- end }}
