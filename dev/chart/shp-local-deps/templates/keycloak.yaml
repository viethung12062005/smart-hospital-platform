{{- if .Values.components.keycloak }}
# Realm `shp` được nạp lúc khởi động (--import-realm). Người dùng thử nghiệm (dữ liệu giả) tạo bằng `make seed-users`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels: {{- include "shp.labels" . | nindent 4 }}
data:
  realm-shp.json: |
{{ .Files.Get "files/realm-shp.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-host
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080, targetPort: 8080, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak }}
          args: ["start-dev", "--import-realm", "--http-port=8080", "--hostname-strict=false"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: keycloak-admin-password } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /realms/shp, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources: {{- toYaml .Values.resources.keycloak | nindent 12 }}
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
{{- end }}
