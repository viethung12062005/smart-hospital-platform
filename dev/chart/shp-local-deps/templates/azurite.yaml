{{- if .Values.components.azurite }}
# Azure Storage emulator (blob + queue). Account "shp" with a random key generated on each machine (AZURITE_ACCOUNTS).
# Unlike cloud: SAS is signed with the emulator account key (no user delegation SAS), and there is no immutability/WORM.
apiVersion: v1
kind: Service
metadata:
  name: azurite
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  selector: { app: azurite }
  ports:
    - { name: blob, port: 10000 }
    - { name: queue, port: 10001 }
---
apiVersion: v1
kind: Service
metadata:
  name: azurite-host
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: azurite }
  ports:
    - { name: blob, port: 10000, targetPort: 10000, nodePort: 30100 }
    - { name: queue, port: 10001, targetPort: 10001, nodePort: 30101 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: azurite }
  template:
    metadata:
      labels: { app: azurite }
    spec:
      containers:
        - name: azurite
          image: {{ .Values.images.azurite }}
          args: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
          env:
            - name: AZURITE_ACCOUNTS
              valueFrom: { secretKeyRef: { name: shp-local-credentials, key: azurite-accounts } }
          ports:
            - { containerPort: 10000 }
            - { containerPort: 10001 }
          readinessProbe:
            tcpSocket: { port: 10000 }
            periodSeconds: 5
          resources: {{- toYaml .Values.resources.azurite | nindent 12 }}
{{- end }}
