{{- if .Values.components.rabbitmq }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-host
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672, nodePort: 30672 }
    - { name: management, port: 15672, targetPort: 15672, nodePort: 30673 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: {{- include "shp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.images.rabbitmq }}
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: shp }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: rabbitmq-password } }
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.rabbitmq | nindent 12 }}
{{- end }}
