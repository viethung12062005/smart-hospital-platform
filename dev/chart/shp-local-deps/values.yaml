# Passwords are NOT stored here: the chart reads them from the `credentialsSecret` Secret generated randomly by dev/scripts/up.sh.
credentialsSecret: shp-local-credentials

images:
  postgres: postgres:16-alpine
  mongo: mongo:8
  redis: redis:7-alpine
  rabbitmq: rabbitmq:4-management
  azurite: mcr.microsoft.com/azure-storage/azurite:3.37.0
  keycloak: quay.io/keycloak/keycloak:26.0

# Profile: core = enough for most tasks. (Full profile: LOC-08.)
components:
  postgres: true
  mongo: true
  redis: true
  rabbitmq: true
  azurite: true
  keycloak: true

storage:
  postgres: 2Gi
  mongo: 2Gi

postgres:
  user: shp
  databases: [scheduling]   # notification and ml use MongoDB (ADR-0014)

mongo:
  replicaSet: rs0

resources:            # small limits so it runs on a 16 GB machine
  postgres: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  mongo:    { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  redis:    { requests: { cpu: 50m,  memory: 32Mi  }, limits: { memory: 128Mi } }
  rabbitmq: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  azurite:  { requests: { cpu: 50m,  memory: 64Mi  }, limits: { memory: 256Mi } }
  # The Keycloak start-dev mode rebuilds Quarkus at startup, so RAM spikes during the first seconds; 1Gi gets OOMKilled on many-core machines.
  keycloak: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1536Mi } }

# The Keycloak JVM defaults to a heap of 70% of the limit, and the GC/JIT thread count follows the MACHINE core count (not the cluster),
# so the same chart runs out of memory on many-core machines. A 50% heap (768Mi) + a fixed 2 CPUs keeps memory stable on any machine.
keycloakJvm:
  heap: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"
  append: "-XX:ActiveProcessorCount=2"
