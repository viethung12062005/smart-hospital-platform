# Weekly dependency updates; PRs are reviewed by the SA (GOV-06).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
  - package-ecosystem: pip
    directories: ["/services/ai", "/services/ml", "/tools/contracts"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/services/*"]
    schedule: { interval: weekly }
    ignore:
      # Stay on LTS JDK 21 (matches java.version and distroless java21); do not jump to non-LTS releases.
      - dependency-name: "library/maven"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
