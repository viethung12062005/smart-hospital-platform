# Weekly dependency updates; PRs are reviewed by the SA (GOV-06).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
  - package-ecosystem: pip
    directories: ["/services/ai", "/services/ml", "/tools/contracts"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/services/*", "/web"]
    schedule: { interval: weekly }
    ignore:
      # Builder image: stay on LTS JDK 21 (matches java.version and distroless java21). Dependabot sees
      # 3.9-eclipse-temurin-21 -> -26 as a suffix change, not a major bump, so an update-types rule cannot stop it.
      # Ignore the image entirely: the rolling tag 3.9-eclipse-temurin-21 already brings Maven and JDK 21 patches on each build.
      - dependency-name: "library/maven"
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly }
    groups:
      # One PR per family keeps related packages in step.
      mantine: { patterns: ["@mantine/*"] }
      testing: { patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "msw"] }
      lint: { patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "prettier", "globals"] }
    ignore:
      # Major versions are planned changes (ADR-0016): the toolchain moves together (Vite <-> plugin-react <-> Vitest,
      # MSW API changes) and Dependabot merging them one by one breaks the build. Only minor and patch updates here.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      # One PR for all action bumps instead of one per action.
      actions: { patterns: ["*"] }
