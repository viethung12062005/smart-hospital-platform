# Weekly dependency updates; PRs are reviewed by the SA (GOV-06).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
  - package-ecosystem: pip
    directories: ["/services/ai", "/services/ml", "/tools/contracts"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/services/*", "/web"]
    schedule: { interval: weekly }
    ignore:
      # Builder image: stay on LTS JDK 21 (matches java.version and distroless java21). Dependabot sees
      # 3.9-eclipse-temurin-21 -> -26 as a suffix change, not a major bump, so an update-types rule cannot stop it.
      # Ignore the image entirely: the rolling tag 3.9-eclipse-temurin-21 already brings Maven and JDK 21 patches on each build.
      - dependency-name: "library/maven"
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly }
    groups:
      # One PR per family keeps related packages in step.
      mantine: { patterns: ["@mantine/*"] }
      testing: { patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "msw"] }
      lint: { patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "prettier", "globals"] }
    ignore:
      # React 19 / Mantine 8 / Vite 7+ are major moves decided in ADR-0016; upgrade deliberately, not via Dependabot.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      # Build and test toolchain moves together (Vite <-> plugin-react <-> Vitest; MSW 3 changed its API): upgrade as one planned change.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "msw"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
