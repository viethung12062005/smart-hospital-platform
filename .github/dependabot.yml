# Cập nhật phụ thuộc hằng tuần; PR do SA review (GOV-06).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
  - package-ecosystem: pip
    directories: ["/services/ai", "/services/ml", "/tools/contracts"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/services/*"]
    schedule: { interval: weekly }
    ignore:
      # Giữ JDK LTS 21 (khớp java.version và distroless java21); không nhảy bản không-LTS.
      - dependency-name: "library/maven"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
