# CI for the shared Java libraries (libs/java). Contracts (contracts/) are embedded in the libraries, so contract changes also re-run it.
name: libs-java
on:
  pull_request:
    paths: ["libs/java/**", "contracts/**", "pom.xml", ".mvn/**", ".github/workflows/libs-java.yml"]
  push:
    branches: [main]
    paths: ["libs/java/**", "contracts/**", "pom.xml", ".mvn/**"]
permissions:
  contents: read
jobs:
  ci:
    uses: viethung12062005/shp-platform-templates/.github/workflows/java-ci.yml@v0.1.2
    with:
      modules: libs/java/shp-service-defaults,libs/java/shp-authz,libs/java/shp-events,libs/java/shp-security,libs/java/shp-web,libs/java/shp-data-postgres,libs/java/shp-data-mongo
