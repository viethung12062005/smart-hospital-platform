# PR title must follow docs/00-git-github.md section 2.1 (<story> (<task>): <description>). The title becomes the commit on
# main after squash merge. Re-runs when the title is edited so fixing it does not need a new commit. Pinned to a template release tag.
name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    uses: viethung12062005/shp-platform-templates/.github/workflows/pr-title.yml@v0.1.7
