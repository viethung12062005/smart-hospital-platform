# Generated by tools/scaffold/java_service.py. Pipeline: CI (Maven verify) -> image (scan, SBOM, sign) -> promote to uat (awaits approval).
name: svc-notification
on:
  pull_request:
    paths: ["services/notification/**", "libs/java/**", "contracts/**", "pom.xml", ".github/workflows/svc-notification.yml"]
  push:
    branches: [main]
    paths: ["services/notification/**", "libs/java/**", "contracts/**", "pom.xml", ".github/workflows/svc-notification.yml"]
permissions:
  contents: read
jobs:
  ci:
    uses: viethung12062005/shp-platform-templates/.github/workflows/java-ci.yml@v0.1.3
    with:
      modules: services/notification
  container:
    needs: ci
    uses: viethung12062005/shp-platform-templates/.github/workflows/container.yml@v0.1.3
    permissions:
      contents: read
      id-token: write
    with:
      context: .
      dockerfile: services/notification/Dockerfile
      image-name: notification
      push: ${{ github.ref == 'refs/heads/main' }}
      acr-name: ${{ vars.ACR_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  promote-uat:
    if: github.ref == 'refs/heads/main'
    needs: container
    uses: viethung12062005/shp-platform-templates/.github/workflows/gitops-promote.yml@v0.1.3
    with:
      service: notification
      environment: uat
      digest: ${{ needs.container.outputs.digest }}
      gitops-owner: viethung12062005
      gitops-repo: shp-gitops
      gitops-app-id: ${{ vars.GITOPS_APP_ID }}
      mode: commit
    secrets:
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
