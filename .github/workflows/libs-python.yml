# CI for the shared Python library (libs/python/shp_platform). The library and the event schemas are copied into each Python
# service by tools/pylib/sync.py (service build contexts are services/<svc>); `sync` fails when a copy drifts from the source.
name: libs-python
on:
  pull_request:
    paths: ["libs/python/**", "contracts/events/**", "tools/pylib/**", "services/ai/src/shp_platform/**", "services/ml/src/shp_platform/**", ".github/workflows/libs-python.yml"]
  push:
    branches: [main]
    paths: ["libs/python/**", "contracts/events/**", "tools/pylib/**"]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Service copies match libs/python and contracts/events
        run: python -I tools/pylib/sync.py --check
  ci:
    uses: viethung12062005/shp-platform-templates/.github/workflows/python-ci.yml@v0.1.6
    with:
      working-directory: libs/python
