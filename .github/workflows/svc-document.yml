# Sinh bởi tools/scaffold/dotnet_service.py. Pipeline: CI → image (quét, SBOM, ký) → promote uat (chờ duyệt).
name: svc-document
on:
  pull_request:
    paths: ["services/document/**", "libs/dotnet/**", "Directory.*.props", "global.json", ".github/workflows/svc-document.yml"]
  push:
    branches: [main]
    paths: ["services/document/**", "libs/dotnet/**", "Directory.*.props", "global.json", ".github/workflows/svc-document.yml"]
permissions:
  contents: read
jobs:
  ci:
    uses: viethung12062005/shp-platform-templates-scratch/.github/workflows/dotnet-ci.yml@work/initial-baseline
    with:
      working-directory: services/document
  container:
    needs: ci
    uses: viethung12062005/shp-platform-templates-scratch/.github/workflows/container.yml@work/initial-baseline
    permissions:
      contents: read
      id-token: write
    with:
      context: .
      dockerfile: services/document/Dockerfile
      image-name: document
      push: ${{ github.ref == 'refs/heads/main' }}
      acr-name: ${{ vars.ACR_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  promote-uat:
    if: github.ref == 'refs/heads/main'
    needs: container
    uses: viethung12062005/shp-platform-templates-scratch/.github/workflows/gitops-promote.yml@work/initial-baseline
    with:
      service: document
      environment: uat
      digest: ${{ needs.container.outputs.digest }}
      gitops-owner: viethung12062005
      gitops-repo: shp-gitops-scratch
      gitops-app-id: ${{ vars.GITOPS_APP_ID }}
      mode: commit
    secrets:
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
