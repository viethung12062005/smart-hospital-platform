# Kiểm hợp đồng (phân quyền, event, OpenAPI, terminology) mỗi khi hợp đồng hoặc thiết kế đổi.
name: contracts
on:
  pull_request:
    paths: ["contracts/**", "tools/contracts/**", "docs/03-architecture/detailed-design/**", ".github/workflows/contracts.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", "tools/contracts/**", "docs/03-architecture/detailed-design/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/contracts/requirements.txt
      - run: pip install -r tools/contracts/requirements.txt
      - run: tools/contracts/check_all.sh
