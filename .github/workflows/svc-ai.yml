# Sinh bởi tools/scaffold/python_service.py. Pipeline: CI → image (quét, SBOM, ký) → promote uat (chờ duyệt).
name: svc-ai
on:
  pull_request:
    paths: ["services/ai/**", ".github/workflows/svc-ai.yml"]
  push:
    branches: [main]
    paths: ["services/ai/**", ".github/workflows/svc-ai.yml"]
permissions:
  contents: read
jobs:
  ci:
    uses: viethung12062005/shp-platform-templates/.github/workflows/python-ci.yml@main
    with:
      working-directory: services/ai
  container:
    needs: ci
    uses: viethung12062005/shp-platform-templates/.github/workflows/container.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      context: services/ai
      image-name: ai
      push: ${{ github.ref == 'refs/heads/main' }}
      acr-name: ${{ vars.ACR_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  promote-uat:
    if: github.ref == 'refs/heads/main'
    needs: container
    uses: viethung12062005/shp-platform-templates/.github/workflows/gitops-promote.yml@main
    with:
      service: ai
      environment: uat
      digest: ${{ needs.container.outputs.digest }}
      gitops-owner: viethung12062005
      gitops-repo: shp-gitops
      gitops-app-id: ${{ vars.GITOPS_APP_ID }}
      mode: commit
    secrets:
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
