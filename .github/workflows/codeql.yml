# Static analysis by CodeQL for the languages this repository ships (CIT-07, NFR-SEC6).
# Runs on every PR, on main, and weekly so a new query pack finds older code. Not yet a required check: pr-gate in
# shp-platform-templates lists the workflows it aggregates, so adding CodeQL there is a templates release (follow-up).
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 19 * * 0"   # weekly, Sunday 02:23 Vietnam time
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Java covers services/* and libs/java, python covers services/ai, services/ml and libs/python,
        # javascript-typescript covers web/.
        language: [java, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          # No build required: CodeQL reads the source and the dependency graph the CI already produces.
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:${{ matrix.language }}"
