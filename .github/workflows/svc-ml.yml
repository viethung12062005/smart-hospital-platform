# Generated by tools/scaffold/python_service.py. Pipeline: CI -> image (scan, SBOM, sign) -> promote to uat (awaits approval).
name: svc-ml
on:
  pull_request:
    paths: ["services/ml/**", ".github/workflows/svc-ml.yml"]
  push:
    branches: [main]
    paths: ["services/ml/**", ".github/workflows/svc-ml.yml"]
permissions:
  contents: read
jobs:
  ci:
    uses: viethung12062005/shp-platform-templates/.github/workflows/python-ci.yml@v0.1.3
    with:
      working-directory: services/ml
  container:
    needs: ci
    uses: viethung12062005/shp-platform-templates/.github/workflows/container.yml@v0.1.3
    permissions:
      contents: read
      id-token: write
    with:
      context: services/ml
      image-name: ml
      push: ${{ github.ref == 'refs/heads/main' }}
      acr-name: ${{ vars.ACR_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  promote-uat:
    if: github.ref == 'refs/heads/main'
    needs: container
    uses: viethung12062005/shp-platform-templates/.github/workflows/gitops-promote.yml@v0.1.3
    with:
      service: ml
      environment: uat
      digest: ${{ needs.container.outputs.digest }}
      gitops-owner: viethung12062005
      gitops-repo: shp-gitops
      gitops-app-id: ${{ vars.GITOPS_APP_ID }}
      mode: commit
    secrets:
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
