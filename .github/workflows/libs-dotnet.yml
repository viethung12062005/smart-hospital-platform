# CI cho thư viện .NET dùng chung (libs/dotnet). Thay đổi ma trận phân quyền cũng chạy lại vì nó được nhúng vào Shp.Authorization.
name: libs-dotnet
on:
  pull_request:
    paths: ["libs/dotnet/**", "contracts/authz/**", "Directory.*.props", "global.json", ".github/workflows/libs-dotnet.yml"]
  push:
    branches: [main]
    paths: ["libs/dotnet/**", "contracts/authz/**", "Directory.*.props", "global.json"]
permissions:
  contents: read
jobs:
  ci:
    uses: viethung12062005/shp-platform-templates-scratch/.github/workflows/dotnet-ci.yml@work/initial-baseline
    with:
      working-directory: libs/dotnet
