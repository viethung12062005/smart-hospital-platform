# Header bảo mật dùng chung. Nginx KHÔNG kế thừa add_header từ cấp trên khi một location tự khai báo add_header,
# nên file này được include ở server và ở từng location (test: e2e/headers.spec.ts, quét ZAP trong qa.yml).
# connect-src chỉ cho phép API cùng origin (qua cổng vào), Microsoft Entra ID (cloud) và Keycloak của cụm local. Không dùng
# 'https:' hay wildcard: nếu có lỗ hổng XSS, dữ liệu bệnh nhân vẫn không gửi được ra trang tùy ý (ZAP 10055).
# Đổi nhà cung cấp định danh = sửa nguồn này. style-src 'unsafe-inline' giữ lại vì Mantine ghi style nội tuyến; script-src vẫn chỉ 'self'.
# HSTS do cổng vào (Envoy Gateway) đặt vì TLS kết thúc ở đó.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com http://localhost:18080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
