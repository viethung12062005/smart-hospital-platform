# Shared security headers. Nginx does NOT inherit add_header from a parent level when a location declares its own add_header,
# so this file is included at the server and in each location (test: e2e/headers.spec.ts, ZAP scan in qa.yml).
# connect-src only allows the same-origin API and Keycloak (cloud: Keycloak sits at the /idp path behind the ingress, ADR-0017) and the local cluster's Keycloak. Do not use
# 'https:' or wildcards: if there is an XSS flaw, patient data still cannot be sent to an arbitrary page (ZAP 10055).
# Changing the identity provider means editing this source. style-src 'unsafe-inline' is kept because Mantine writes inline styles; script-src still only allows 'self'.
# HSTS is set by the ingress (Envoy Gateway) because TLS terminates there.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:18080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
