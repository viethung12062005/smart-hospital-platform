# nginx phục vụ SPA, chạy bằng user không phải root (uid 101), filesystem gốc có thể chỉ-đọc (mọi file tạm ở /tmp).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Log JSON một dòng, không ghi query string (có thể chứa dữ liệu tìm kiếm) và không ghi IP đầy đủ.
  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"ms":$request_time}';
  access_log /dev/stdout json;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/shp-security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Cấu hình lúc chạy (ConfigMap) và trang gốc: không cache để đổi cấu hình/phiên bản có hiệu lực ngay.
    location = /config.json {
      include /etc/nginx/shp-security-headers.conf;
      add_header Cache-Control "no-store" always;
    }
    location = /index.html {
      include /etc/nginx/shp-security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # File có hash trong tên: cache dài hạn.
    location /assets/ {
      include /etc/nginx/shp-security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Định tuyến phía trình duyệt: mọi đường dẫn khác trả index.html.
    location / {
      try_files $uri /index.html;
    }
  }
}
