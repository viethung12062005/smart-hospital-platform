# nginx serves the SPA, running as a non-root user (uid 101), with a possibly read-only root filesystem (all temp files in /tmp).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Single-line JSON log, without the query string (which may contain search data) and without the full IP.
  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"ms":$request_time}';
  access_log /dev/stdout json;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/shp-security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Runtime configuration (ConfigMap) and the root page: no caching so config/version changes take effect immediately.
    location = /config.json {
      include /etc/nginx/shp-security-headers.conf;
      add_header Cache-Control "no-store" always;
    }
    location = /index.html {
      include /etc/nginx/shp-security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Files with a hash in the name: long-term caching.
    location /assets/ {
      include /etc/nginx/shp-security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Browser-side routing: every other path returns index.html.
    location / {
      try_files $uri /index.html;
    }
  }
}
