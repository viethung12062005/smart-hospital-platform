# OWASP ZAP baseline rules for the web app (passive scan). Columns: rule ID, action (FAIL | WARN | IGNORE), description.
# By default every alert is WARN (recorded in the report, does not block). The rules below block a PR because they relate directly to NFR-SEC15.
10020	FAIL	(Missing Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10063	FAIL	(Permissions Policy Header Not Set)
90004	FAIL	(Insufficient Site Isolation Against Spectre Vulnerability)
10098	FAIL	(Cross-Domain Misconfiguration)
10010	FAIL	(Cookie No HttpOnly Flag)
10011	FAIL	(Cookie Without Secure Flag)
10054	FAIL	(Cookie without SameSite Attribute)
# style-src 'unsafe-inline': Mantine writes inline styles; accepted conditionally, script-src still only allows 'self'.
10055	WARN	(CSP: style-src unsafe-inline)
# HSTS is set by the ingress because TLS terminates at Envoy Gateway; the container only speaks HTTP.
10035	IGNORE	(Strict-Transport-Security Header Not Set)
