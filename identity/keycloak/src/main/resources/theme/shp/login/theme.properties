# SHP login theme (IAM-03). Extends the stock keycloak.v2 theme (PatternFly 5) of Keycloak 26.8.2 and changes only the colours,
# type and wording, so no page template is copied and a Keycloak upgrade keeps its accessibility and security fixes.
parent=keycloak.v2
import=common/keycloak

# css/styles.css resolves to the parent's file; css/shp.css holds the SHP design tokens (web/src/styles/tokens.css).
styles=css/styles.css css/shp.css

# The SHP design system has one light palette; its contrast is checked (ThemeContrastTest), a dark variant is not.
darkMode=false

# The languages this theme is written for; the realm lists the same (supportedLocales, default vi).
locales=vi,en
